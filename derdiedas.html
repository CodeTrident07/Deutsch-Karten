<title>DeutschKarten – Der Die Das</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Surfaces ── */
  --bg:   #F4F4F2;
  --s1:   #FFFFFF;
  --s2:   #EBEBE9;
  --s3:   #E2E2E0;
  --s4:   #D8D8D6;

  /* ── Greyscale ── */
  --g1:   #111415;
  --g2:   #454A4B;
  --g3:   #5E6263;
  --g4:   #D3D4D3;

  /* ── Semantic aliases ── */
  --surface:   var(--s1);
  --surface2:  var(--s2);
  --surface3:  var(--s3);
  --border:    var(--g4);
  --border2:   #A3A5A5;
  --text:      var(--g1);
  --text2:     var(--g2);
  --text3:     var(--g3);
  --ink:       var(--g1);
  --ink2:      var(--g2);
  --ink3:      var(--g3);

  /* ── Spacing scale (4px base) ── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ── Typography ── */
  --font-sans:  'Archivo', system-ui, sans-serif;
  --font-serif: 'Archivo', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --text-xs:   0.65rem;   /* 10.4px — labels, badges */
  --text-sm:   0.75rem;   /* 12px   — secondary text */
  --text-base: 0.875rem;  /* 14px   — body */
  --text-md:   1rem;      /* 16px   — UI text */
  --text-lg:   1.25rem;   /* 20px   — card headings */
  --text-xl:   1.5rem;    /* 24px   — section headings */
  --text-2xl:  2rem;      /* 32px   — display */
  --text-3xl:  2.8rem;    /* 44px   — hero */

  /* ── Border radius ── */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 24px;

  /* ── Shadows ── */
  --shadow-sm:  0 1px 2px rgba(17,20,21,0.06);
  --shadow-md:  0 4px 14px rgba(17,20,21,0.08);
  --shadow-lg:  0 12px 32px rgba(17,20,21,0.12);
  --shadow-card: 0 1px 2px rgba(17,20,21,0.05), 0 10px 30px rgba(17,20,21,0.07);

  /* ── Glow (monochrome white) ── */
  --glow-xs:  0 0 0 transparent;
  --glow-sm:  0 0 0 transparent;
  --glow-md:  0 0 0 transparent;

  /* ── Transitions ── */
  --ease:       cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:   cubic-bezier(0, 0, 0.2, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast:     100ms;
  --t-base:     160ms;
  --t-slow:     280ms;

  /* ── Layout ── */
  --topbar-h:   52px;
  --card-max:   600px;
  --page-max:   860px;

  /* ── Keep old names pointing to new tokens (backward compat) ── */
  --surf:    var(--s1);
  --surf2:   var(--s2);
  --surf3:   var(--s3);
  --sf2:     var(--s2);
  --sf3:     var(--s3);
  --bord:    var(--g4);
  --bord2:   #A3A5A5;
  --rule:    var(--g4);
  --rule2:   #A3A5A5;
  --ln2:     #A3A5A5;
  --line:    var(--g4);
  --glow:    var(--glow-sm);
  --glow-sm: 0 0 0 transparent;

  /* ── Activity-specific (keep for derdiedas, old level vars) ── */
  --der:  var(--g1); --derd: var(--s2);
  --die:  var(--g2); --died: var(--s2);
  --das:  var(--g2); --dasd: var(--s2);
  --a1: var(--g1); --a1d: var(--s2); --a1m: rgba(17,20,21,0.04);
  --a2: var(--g1); --a2d: var(--s2); --a2m: rgba(17,20,21,0.04);
  --b1: var(--g1); --b1d: var(--s2); --b1m: rgba(17,20,21,0.04);
  --b2: var(--g1); --b2d: var(--s2); --b2m: rgba(17,20,21,0.04);
  --c1: var(--g1); --c1d: var(--s2); --c1m: rgba(17,20,21,0.04);
  --amber: var(--g1); --amberd: var(--s2);
  --accent: #2F4E56; --accentd: #E3EBEC;
  --lvl: var(--g1); --lvld: var(--s2); --lvlm: rgba(17,20,21,0.04);
  --green:   var(--g1); --greend: var(--s2);
  --red:     var(--g2); --redd:   var(--s2);
  --gold:    var(--g1); --goldd:  var(--s2);
  --silver:  var(--g2);
  --bronze:  var(--g3);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--g1);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font-family: inherit; }

/* ── Focus ring — accessibility ── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--g4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--g3); }

/* ── Topbar — shared across all pages ── */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--g4);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--g1);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  transition: opacity var(--t-base) var(--ease);
  user-select: none;
}
.logo:hover {text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;}
.logo-slash {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--g3);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ── Back link / nav buttons — universal ── */
.back-link, .nav-btn, .back-btn {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  color: var(--g3);
  text-decoration: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--g4);
  border-radius: var(--r-xs);
  background: transparent;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.back-link:hover, .nav-btn:hover, .back-btn:hover {
  color: var(--g1);
  border-color: var(--g3);
  box-shadow: var(--glow-sm);
}
:is(.back-link, .nav-btn, .back-btn):focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
}

/* ── Primary button ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.6rem;
  background: var(--g1);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 800;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: opacity var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease),
              transform var(--t-fast) var(--ease);
}
.btn-primary:hover {background: #2F4E56;}
.btn-primary:active { transform: scale(0.97); opacity: 0.8; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Ghost button ── */
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.4rem;
  background: transparent;
  color: var(--g2);
  border: 1px solid var(--g4);
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 700;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.btn-ghost:hover { color: var(--g1); border-color: var(--g3); box-shadow: var(--glow-sm); }
.btn-ghost:active { transform: scale(0.97); }
.btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Card surface ── */
.card {
  background: var(--s1);
  border: 1px solid var(--g4);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: none;
  pointer-events: none;
}

/* ── Input ── */
.input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.55rem 0.85rem;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--g1);
  outline: none;
  transition: border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.input:focus {
  border-color: var(--g3);
  box-shadow: 0 0 0 3px rgba(17,20,21,0.04);
}
.input::placeholder { color: var(--g3); }
.input:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Progress bar ── */
.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--g4);
  overflow: hidden;
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  background: var(--g1);
  border-radius: 1px;
  transition: width 0.4s var(--ease);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--sp-8);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.45rem 1rem;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.03em;
  color: var(--g2);
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  transition: opacity var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Utility ── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}


.card-scene:hover .card-face,
.quiz-card:hover {
  border-color: var(--g3);
  box-shadow: 0 0 30px rgba(17,20,21,0.05), 0 20px 48px rgba(17,20,21,0.125) !important;
}

.nav-btn, .back-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--ink3);
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid var(--border2);
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.nav-btn:hover, .back-btn:hover {
  color: var(--ink);
  border-color: var(--ink3);
  background: var(--surface2);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:18px; }
body {
  background:var(--bg);
  font-family:'Archivo',sans-serif;
  color:var(--text);

body::before {

/* Topbar */

  display:grid;

  align-items:center;
  padding:0.9rem 1.6rem;

  background: var(--bg);

}
.logo {

}
.top-right {
  display:flex; align-items:center; gap:0.5rem; justify-self:end;
}



/* Stats bar */
.stats-bar {
  display:flex; align-items:center; gap:1.2rem;
  padding:0.6rem 1.6rem;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  font-family:'JetBrains Mono',monospace; font-size:0.78rem;
  color:var(--text3); position:relative; z-index:1; flex-wrap:wrap;
}
.stat { display:flex; align-items:center; gap:0.4rem; }
.stat-val { color:var(--text2); font-weight:700; }
.stat-der { color:var(--der); }
.stat-die { color:var(--die); }
.stat-das { color:var(--das); }
.acc-bar {
  flex:1; max-width:180px; height:5px;
  background:var(--surf2); border-radius:10px; overflow:hidden;
  border:1px solid var(--border);
}
.acc-fill { height:100%; background:var(--green); border-radius:10px; transition:width 0.5s ease; width:0%; }
.session-info { margin-left:auto; color:var(--text3); font-size:0.72rem; }

/* Main arena */
.arena {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:2rem 1rem; position:relative; z-index:1;
  gap:1.5rem;
}

/* Card */
.question-card {
  background:var(--surface); border:1px solid var(--border2);
  border-radius: 14px; padding:2.5rem 3rem;
  text-align:center; max-width:540px; width:100%;
  animation:cardIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
  transition:border-color 0.3s, box-shadow 0.3s;
}
.question-card.correct-der { border-color:var(--der); box-shadow:0 0 32px rgba(116,192,252,0.15); }
.question-card.correct-die { border-color:var(--die); box-shadow:0 0 32px rgba(247,131,172,0.15); }
.question-card.correct-das { border-color:var(--das); box-shadow:0 0 32px rgba(169,227,75,0.15); }
.question-card.wrong { border-color:var(--red); box-shadow:0 0 32px rgba(255,107,107,0.15); animation:shake 0.35s ease; }

@keyframes cardIn {
  from { opacity:0; transform:translateY(12px) scale(0.97); }
  to   { opacity:1; transform:none; }
}
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20% { transform:translateX(-8px); }
  60% { transform:translateX(8px); }
}

.word-english {
  font-family: var(--font-sans); 
  font-size:1.1rem; color:var(--text3); margin-bottom:0.5rem;
}
.word-german {
  font-size:2.4rem; font-weight:800; letter-spacing:-0.03em;
  margin-bottom:0.3rem; color:var(--text);
}
.word-blank {
  font-size:2.4rem; font-weight:800; letter-spacing:-0.03em;
  color:var(--text3);
}
.article-reveal {
  font-size:2.4rem; font-weight:800; letter-spacing:-0.03em;
  transition:color 0.3s;
}
.article-reveal.der { color:var(--der); }
.article-reveal.die { color:var(--die); }
.article-reveal.das { color:var(--das); }

.result-msg {
  font-family:'JetBrains Mono',monospace; font-size:0.82rem;
  min-height:1.4rem; transition:all 0.2s;
}
.result-msg.correct { color:var(--green); }
.result-msg.wrong { color:var(--red); }
.hint-text {
  font-size:0.78rem; color:var(--text3); margin-top:0.3rem;
  font-family:'JetBrains Mono',monospace; min-height:1.2rem;
}

.article-btns {
  display:flex; gap:1rem; max-width:540px; width:100%;
}

  font-size:1.4rem; font-weight:800; cursor:pointer;
  transition:all 0.15s; position:relative; overflow:hidden;
  color:var(--text2);
}
.art-btn::before {
  content:''; position:absolute; inset:0;
  opacity:0; transition:opacity 0.2s;
}
.art-btn.btn-der { border-color:var(--derd); }
.art-btn.btn-der:hover { border-color:var(--der); color:var(--der); background: var(--s1); }
.art-btn.btn-die { border-color:var(--died); }
.art-btn.btn-die:hover { border-color:var(--die); color:var(--die); background: var(--s1); }
.art-btn.btn-das { border-color:var(--dasd); }
.art-btn.btn-das:hover { border-color:var(--das); color:var(--das); background: var(--s1); }

.art-btn.chosen-correct.btn-der { background: var(--s2); border-color:var(--der); color:var(--der); }
.art-btn.chosen-correct.btn-die { background: var(--s2); border-color:var(--die); color:var(--die); }
.art-btn.chosen-correct.btn-das { background: var(--s2); border-color:var(--das); color:var(--das); }
.art-btn.chosen-wrong { background:var(--redd); border-color:var(--red); color:var(--red); }
.art-btn.show-correct.btn-der { background: var(--s1); border-color:var(--der); color:var(--der); opacity:0.6; }
.art-btn.show-correct.btn-die { background: var(--s1); border-color:var(--die); color:var(--die); opacity:0.6; }
.art-btn.show-correct.btn-das { background: var(--s1); border-color:var(--das); color:var(--das); opacity:0.6; }
.art-btn:disabled { cursor:default; }

.art-btn .art-label { font-size:0.72rem; display:block; font-weight:500; opacity:0.7; margin-top:0.2rem; font-family:'JetBrains Mono',monospace; }

/* Next btn */
.next-btn {
  padding:0.8rem 2.5rem; background:var(--green); color:var(--bg);

  display:none;
}
.next-btn:hover {background: #2F4E56;}
.next-btn:active { transform:scale(0.97); }
.next-btn.show { display:block; }

/* Progress */
.progress-wrap { max-width:540px; width:100%; }
.progress-track {
  height:4px; background:var(--surf2); border-radius:10px;
  overflow:hidden; border:1px solid var(--border);
}
.progress-fill {
  height:100%; background:var(--green); border-radius:10px;
  transition:width 0.4s cubic-bezier(0.34,1.56,0.64,1); width:0%;
}

/* Complete screen */
.complete-screen {
  display:none; flex-direction:column; align-items:center;

}
.complete-screen.show { display:flex; }
.complete-emoji { font-size:3.5rem; }
.complete-title { font-size:2rem; font-weight:800; letter-spacing:-0.03em; }
.complete-stats {

.cstat-label {

.cstat-der { color:var(--der); }
.cstat-die { color:var(--die); }
.cstat-das { color:var(--das); }

.weak-panel {

.btn-row {

/* Level badge */
.level-badge {

/* Keyboard shortcut hint */
.kbd-hint-bar {

.kbd {

termination / participation"}, {"w": "die Leitung", "a": "die", "en": "management / leadership"}, {"w": "das Werk", "a": "das", "en": "work (of art)"}, {"w": "der Dichter", "a": "der", "en": "poet"}, {"w": "die Galerie", "a": "die", "en": "gallery"}, {"w": "der Auftritt", "a": "der", "en": "performance / appearance"}, {"w": "das Ballett", "a": "das", "en": "ballet"}, {"w": "der Schriftsteller", "a": "der", "en": "author / writer"}, {"w": "das Symbol", "a": "das", "en": "symbol"}, {"w": "die Aufnahme", "a": "die", "en": "recording"}, {"w": "die Biologie", "a": "die", "en": "biology"}, {"w": "die Theorie", "a": "die", "en": "theory"}, {"w": "das Misstrauen", "a": "das", "en": "distrust / mistrust"}, {"w": "die Einzelheit", "a": "die", "en": "detail"}];
const SESSION_SIZE = 20;

// ── Storage ───────────────────────────────────────────────────
function getSession() {
  try {
    const s = JSON.parse(localStorage.getItem('dk_session') || 'null');
    return s && s.email ? s : null;
  } catch { return null; }
}

function getDDDKey() {
  const s = getSession();
  return 'dk_ddd_' + (s ? s.email.replace(/[^a-z0-9]/gi,'_') : 'guest');
}

function loadDDD() {
  try { return JSON.parse(localStorage.getItem(getDDDKey())) || {}; } catch { return {}; }
}

function saveDDD(data) {
  localStorage.setItem(getDDDKey(), JSON.stringify(data));
}

// DDD data structure per word: { correct: N, wrong: N, lastWrong: bool }
function getDDDRecord(data, word) {
  if (!data[word]) data[word] = { correct:0, wrong:0, lastWrong:false };
  return data[word];
}

// ── Scoring hints ──────────────────────────────────────────────
const ARTICLE_HINTS = {
  der: [
    'Days, months & seasons → der (Montag, Januar, Sommer)',
    'Nouns ending in -er, -en, -el often → der',
    'Compass points → der (der Norden, der Süden)',
    'Most "-ismus" nouns → der (der Kapitalismus)',
  ],
  die: [
    'Nouns ending in -ung, -heit, -keit → die',
    'Nouns ending in -schaft, -tion, -tät → die',
    'Most nouns ending in -e → die (die Straße)',
    'Numbers and letters as nouns → die (die Eins)',
  ],
  das: [
    'Diminutives (-chen, -lein) → always das',
    'Infinitives used as nouns → das (das Essen)',
    'Most metals & chemical elements → das',
    'Colors as nouns → das (das Blau, das Grün)',
  ],
};

// ── State ──────────────────────────────────────────────────────
let deck = [];
let idx = 0;
let correct = 0;
let wrong = 0;
let answered = false;
let derWrong = 0, dieWrong = 0, dasWrong = 0;
let sessionWeak = []; // words wrong this session

// ── Init ───────────────────────────────────────────────────────
function getWeakWords() {
  const data = loadDDD();
  // Words with more wrongs than corrects, or wrong > 2
  return ALL_NOUNS.filter(n => {
    const r = data[n.w];
    if (!r) return false;
    return r.wrong > r.correct || r.wrong >= 2;
  });
}

function startSession(weakOnly) {
  const data = loadDDD();
  let pool = weakOnly ? getWeakWords() : ALL_NOUNS;
  if (pool.length === 0) pool = ALL_NOUNS;

  // Shuffle, prioritize weak words
  const weak = weakOnly ? pool : pool.filter(n => {
    const r = data[n.w];
    return r && (r.wrong > r.correct || r.wrong >= 2);
  });
  const rest = pool.filter(n => !weak.includes(n));

  // Shuffle each group
  const shuffle = arr => arr.sort(() => Math.random() - 0.5);
  deck = [...shuffle(weak), ...shuffle(rest)].slice(0, SESSION_SIZE);

  idx = 0; correct = 0; wrong = 0;
  derWrong = 0; dieWrong = 0; dasWrong = 0;
  sessionWeak = [];
  answered = false;

  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('mainArena').querySelector('.progress-wrap').style.display = '';
  document.getElementById('questionCard').style.display = '';
  document.getElementById('articleBtns').style.display = '';
  document.getElementById('nextBtn').classList.remove('show');

  updateStats();
  showWord();
}

function showWord() {
  if (idx >= deck.length) { showComplete(); return; }
  const noun = deck[idx];

  answered = false;
  const card = document.getElementById('questionCard');
  card.className = 'question-card';

  document.getElementById('wordEnglish').textContent = noun.en;

  // Show word without article
  const bare = noun.w.replace(/^(der|die|das) /,'');
  document.getElementById('wordBlank').textContent = bare;
  document.getElementById('wordBlank').style.display = '';
  document.getElementById('wordGerman').style.display = 'none';
  document.getElementById('articleReveal').style.display = 'none';
  document.getElementById('resultMsg').textContent = '';
  document.getElementById('resultMsg').className = 'result-msg';
  document.getElementById('hintText').textContent = '';

  document.getElementById('nextBtn').classList.remove('show');

  // Reset buttons
  ['btnDer','btnDie','btnDas'].forEach(id => {
    const b = document.getElementById(id);
    b.disabled = false;
    b.className = b.dataset.base;
  });
  document.getElementById('btnDer').dataset.base = 'art-btn btn-der';
  document.getElementById('btnDie').dataset.base = 'art-btn btn-die';
  document.getElementById('btnDas').dataset.base = 'art-btn btn-das';
  document.getElementById('btnDer').className = 'art-btn btn-der';
  document.getElementById('btnDie').className = 'art-btn btn-die';
  document.getElementById('btnDas').className = 'art-btn btn-das';

  // Progress
  const pct = (idx / deck.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('sessionInfo').textContent = `Session: ${idx}/${deck.length}`;
}

function guess(article) {
  if (answered) return;
  answered = true;
  const noun = deck[idx];
  const isCorrect = article === noun.a;

  // Update storage
  const data = loadDDD();
  const r = getDDDRecord(data, noun.w);
  if (isCorrect) { r.correct++; r.lastWrong = false; }
  else { r.wrong++; r.lastWrong = true; }
  saveDDD(data);

  // Update session stats
  if (isCorrect) { correct++; }
  else {
    wrong++;
    if (noun.a === 'der') derWrong++;
    else if (noun.a === 'die') dieWrong++;
    else dasWrong++;
    if (!sessionWeak.includes(noun)) sessionWeak.push(noun);
  }

  // Reveal article on card
  const revEl = document.getElementById('articleReveal');
  revEl.textContent = noun.a;
  revEl.className = 'article-reveal ' + noun.a;
  revEl.style.display = '';

  const bare = noun.w.replace(/^(der|die|das) /,'');
  document.getElementById('wordBlank').style.display = 'none';

  // Style card
  const card = document.getElementById('questionCard');
  if (isCorrect) {
    card.className = 'question-card correct-' + noun.a;
    document.getElementById('resultMsg').textContent = '✓ Correct!';
    document.getElementById('resultMsg').className = 'result-msg correct';
  } else {
    card.className = 'question-card wrong';
    document.getElementById('resultMsg').textContent = `✗ It's ${noun.a} ${bare}`;
    document.getElementById('resultMsg').className = 'result-msg wrong';
    // Show a rule hint
    const hints = ARTICLE_HINTS[noun.a];
    document.getElementById('hintText').textContent = hints[Math.floor(Math.random()*hints.length)];
  }

  // Style buttons
  const btnMap = { der:'btnDer', die:'btnDie', das:'btnDas' };
  const btnClassMap = { der:'btn-der', die:'btn-die', das:'btn-das' };
  Object.entries(btnMap).forEach(([art, btnId]) => {
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    if (art === article && isCorrect) {
      btn.className = `art-btn ${btnClassMap[art]} chosen-correct`;
    } else if (art === article && !isCorrect) {
      btn.className = `art-btn ${btnClassMap[art]} chosen-wrong`;
    } else if (art === noun.a && !isCorrect) {
      btn.className = `art-btn ${btnClassMap[art]} show-correct`;
    } else {
      btn.className = `art-btn ${btnClassMap[art]}`;
      btn.style.opacity = '0.3';
    }
  });

  updateStats();
  document.getElementById('nextBtn').classList.add('show');
}

function nextWord() {
  if (!answered) return;
  idx++;
  // Reset opacity
  ['btnDer','btnDie','btnDas'].forEach(id => {
    document.getElementById(id).style.opacity = '';
  });
  showWord();
}

function updateStats() {
  const total = correct + wrong;
  const acc = total > 0 ? Math.round((correct/total)*100) : null;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statAcc').textContent = acc !== null ? acc+'%' : '—';
  document.getElementById('accFill').style.width = (acc||0) + '%';
  document.getElementById('statDer').textContent = derWrong;
  document.getElementById('statDie').textContent = dieWrong;
  document.getElementById('statDas').textContent = dasWrong;
}

function showComplete() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('articleBtns').style.display = 'none';
  document.getElementById('nextBtn').classList.remove('show');

  const total = correct + wrong;
  const acc = total > 0 ? Math.round((correct/total)*100) : 0;

  let emoji = '';
  let title = 'Keep going!';
  let sub = 'Practice makes perfect.';
  if (acc >= 90) { emoji=''; title='Ausgezeichnet!'; sub='Outstanding performance!'; }
  else if (acc >= 75) { emoji=''; title='Sehr gut!'; sub='Great work this session!'; }
  else if (acc >= 60) { emoji=''; title='Gut gemacht!'; sub="You're getting there!"; }

  document.getElementById('completeEmoji').textContent = emoji;
  document.getElementById('completeTitle').textContent = title;
  document.getElementById('completeSub').textContent = sub;

  document.getElementById('completeStats').innerHTML = `
    <div class="cstat"><div class="cstat-val" style="color:var(--green)">${correct}</div><div class="cstat-label">correct</div></div>
    <div class="cstat"><div class="cstat-val" style="color:var(--red)">${wrong}</div><div class="cstat-label">wrong</div></div>
    <div class="cstat"><div class="cstat-val" style="color:var(--gold)">${acc}%</div><div class="cstat-label">accuracy</div></div>
    <div class="cstat"><div class="cstat-val cstat-der">${derWrong}</div><div class="cstat-label">der missed</div></div>
    <div class="cstat"><div class="cstat-val cstat-die">${dieWrong}</div><div class="cstat-label">die missed</div></div>
    <div class="cstat"><div class="cstat-val cstat-das">${dasWrong}</div><div class="cstat-label">das missed</div></div>
  `;

  // Weak words panel
  const weakPanel = document.getElementById('weakPanel');
  const weakGrid = document.getElementById('weakGrid');
  if (sessionWeak.length > 0) {
    weakPanel.classList.add('show');
    weakGrid.innerHTML = sessionWeak.map(n => {
      const bare = n.w.replace(/^(der|die|das) /,'');
      return `<span class="weak-word ${n.a}">${n.a} ${bare}</span>`;
    }).join('');
  } else {
    weakPanel.classList.remove('show');
  }

  // Show "retry weak" button if there are persistent weak words
  const allWeak = getWeakWords();
  document.getElementById('btnWeakOnly').style.display = allWeak.length > 0 ? '' : 'none';

  document.getElementById('completeScreen').classList.add('show');
}

// ── Keyboard ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === '1') guess('der');
  else if (e.key === '2') guess('die');
  else if (e.key === '3') guess('das');
  else if (e.key === 'Enter') {
    if (answered) nextWord();
  }
});

// ── Start ──────────────────────────────────────────────────────
startSession(false);
</script>

      .catch(err => console.warn('[SW] Registration failed:', err));
  });
