<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080808">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch-Karten</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .logo-author {
  font-size: 0.6rem;
  margin-left: 6px;
  color: var(--text3);
  font-weight: 400;
  vertical-align: middle;
}

@media (max-width: 500px) {
  .logo-author {
    font-size: 0.5rem;
    margin-left: 3px;
  }
}
:root {
  /* ── Surfaces ── */
  --bg:   #080808;
  --s1:   #0f0f0f;
  --s2:   #161616;
  --s3:   #1e1e1e;
  --s4:   #242424;

  /* ── Greyscale ── */
  --g1:   #f0f0f0;
  --g2:   #909090;
  --g3:   #484848;
  --g4:   #303030;

  /* ── Semantic aliases ── */
  --surface:   var(--s1);
  --surface2:  var(--s2);
  --surface3:  var(--s3);
  --border:    var(--g4);
  --border2:   var(--g3);
  --text:      var(--g1);
  --text2:     var(--g2);
  --text3:     var(--g3);
  --ink:       var(--g1);
  --ink2:      var(--g2);
  --ink3:      var(--g3);

  /* ── Spacing scale (4px base) ── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ── Typography ── */
  --font-sans:  'Bricolage Grotesque', system-ui, sans-serif;
  --font-serif: 'DM Serif Display', Georgia, serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --text-xs:   0.65rem;   /* 10.4px — labels, badges */
  --text-sm:   0.75rem;   /* 12px   — secondary text */
  --text-base: 0.875rem;  /* 14px   — body */
  --text-md:   1rem;      /* 16px   — UI text */
  --text-lg:   1.25rem;   /* 20px   — card headings */
  --text-xl:   1.5rem;    /* 24px   — section headings */
  --text-2xl:  2rem;      /* 32px   — display */
  --text-3xl:  2.8rem;    /* 44px   — hero */

  /* ── Border radius ── */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 24px;

  /* ── Shadows ── */
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.5);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.6);
  --shadow-lg:  0 12px 40px rgba(0,0,0,0.7);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.6), 0 16px 40px rgba(0,0,0,0.5);

  /* ── Glow (monochrome white) ── */
  --glow-xs:  0 0 8px  rgba(255,255,255,0.04);
  --glow-sm:  0 0 16px rgba(255,255,255,0.06);
  --glow-md:  0 0 28px rgba(255,255,255,0.08);

  /* ── Transitions ── */
  --ease:       cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:   cubic-bezier(0, 0, 0.2, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast:     100ms;
  --t-base:     160ms;
  --t-slow:     280ms;

  /* ── Layout ── */
  --topbar-h:   52px;
  --card-max:   600px;
  --page-max:   860px;
  --card-h:     360px;

  /* ── Keep old names pointing to new tokens (backward compat) ── */
  --surf:    var(--s1);
  --surf2:   var(--s2);
  --surf3:   var(--s3);
  --sf2:     var(--s2);
  --sf3:     var(--s3);
  --bord:    var(--g4);
  --bord2:   var(--g3);
  --rule:    var(--g4);
  --rule2:   var(--g3);
  --ln2:     var(--g3);
  --line:    var(--g4);
  --glow:    var(--glow-sm);
  --glow-sm: 0 0 16px rgba(255,255,255,0.06);

  /* ── Activity-specific (keep for derdiedas, old level vars) ── */
  --der:  var(--g1); --derd: var(--s2);
  --die:  var(--g2); --died: var(--s2);
  --das:  var(--g2); --dasd: var(--s2);
  --a1: var(--g1); --a1d: var(--s2); --a1m: rgba(255,255,255,0.04);
  --a2: var(--g1); --a2d: var(--s2); --a2m: rgba(255,255,255,0.04);
  --b1: var(--g1); --b1d: var(--s2); --b1m: rgba(255,255,255,0.04);
  --b2: var(--g1); --b2d: var(--s2); --b2m: rgba(255,255,255,0.04);
  --c1: var(--g1); --c1d: var(--s2); --c1m: rgba(255,255,255,0.04);
  --amber: var(--g1); --amberd: var(--s2);
  --accent: var(--g1); --accentd: var(--s2);
  --lvl: var(--g1); --lvld: var(--s2); --lvlm: rgba(255,255,255,0.04);
  --green:   var(--g1); --greend: var(--s2);
  --red:     var(--g2); --redd:   var(--s2);
  --gold:    var(--g1); --goldd:  var(--s2);
  --silver:  var(--g2);
  --bronze:  var(--g3);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--g1);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font-family: inherit; }

/* ── Focus ring — accessibility ── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--g4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--g3); }

/* ── Topbar — shared across all pages ── */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--g4);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--g1);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  transition: opacity var(--t-base) var(--ease);
  user-select: none;
}
.logo:hover { opacity: 0.6; }
.logo-slash {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--g3);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ── Back link / nav buttons — universal ── */
.back-link, .nav-btn, .back-btn {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  color: var(--g3);
  text-decoration: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--g4);
  border-radius: var(--r-xs);
  background: transparent;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.back-link:hover, .nav-btn:hover, .back-btn:hover {
  color: var(--g1);
  border-color: var(--g3);
  box-shadow: var(--glow-sm);
}
:is(.back-link, .nav-btn, .back-btn):focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
}

/* ── Primary button ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.6rem;
  background: var(--g1);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 800;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: opacity var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease),
              transform var(--t-fast) var(--ease);
}
.btn-primary:hover {
  opacity: 0.88;
  box-shadow: 0 0 20px rgba(255,255,255,0.12);
  transform: translateY(-1px);
}
.btn-primary:active { transform: scale(0.97); opacity: 0.8; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Ghost button ── */
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.4rem;
  background: transparent;
  color: var(--g2);
  border: 1px solid var(--g4);
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 700;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.btn-ghost:hover { color: var(--g1); border-color: var(--g3); box-shadow: var(--glow-sm); }
.btn-ghost:active { transform: scale(0.97); }
.btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Card surface ── */
.card {
  background: var(--s1);
  border: 1px solid var(--g4);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  pointer-events: none;
}

/* ── Input ── */
.input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.55rem 0.85rem;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--g1);
  outline: none;
  transition: border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.input:focus {
  border-color: var(--g3);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
}
.input::placeholder { color: var(--g3); }
.input:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Progress bar ── */
.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--g4);
  overflow: hidden;
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  background: var(--g1);
  border-radius: 1px;
  transition: width 0.4s var(--ease);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--sp-8);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.45rem 1rem;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.03em;
  color: var(--g2);
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  transition: opacity var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Utility ── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}


.card-scene:hover .card-face,
.quiz-card:hover {
  border-color: var(--g3);
  box-shadow: 0 0 30px rgba(255,255,255,0.05), 0 20px 48px rgba(0,0,0,0.5) !important;
}




html { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Bricolage Grotesque', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ─── ANIMATED BG ─── */
.bg-orb { display: none; }
.bg-orb { display: none; }
.bg-orb { display: none; }
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px, -30px); } }

/* ─── TOP BAR ─── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  background: var(--s1);
}
.logo {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
  transition: text-shadow 0.3s, transform 0.2s;
}

.logo:hover {
  opacity: 0.65;
  transform: translateY(-1px);
}
.logo span { color: var(--g1); }

.kbd-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: var(--text3);
  display: flex;
  gap: 0.8rem;
  align-items: center;
}
.kbd {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 2px 6px;
  color: var(--text2);
}

/* ─── LEVEL TABS ─── */
.level-tabs {
  position: relative;
  z-index: 10;
  display: flex;
  padding: 1rem 1.8rem 0;
  gap: 0.3rem;
  border-bottom: 1px solid var(--border);
}
.lvl-tab {
  padding: 0.5rem 1.1rem 0.8rem;
  background: none;
  border: none;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
  top: 1px;
}
.lvl-tab[data-l="A1"] { --tc: var(--a1); }
.lvl-tab[data-l="A2"] { --tc: var(--a2); }
.lvl-tab[data-l="B1"] { --tc: var(--b1); }
.lvl-tab[data-l="B2"] { --tc: var(--b2); }
.lvl-tab[data-l="C1"] { --tc: var(--c1); }
.lvl-tab:hover { color: var(--g2); }
.lvl-tab.active { color: var(--g1); border-bottom-color: var(--g1); }

/* ─── ACTIVITY STRIP ─── */
.activity-strip-wrap {
  position: relative;
  z-index: 10;
  padding: 0.6rem 1.8rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.activity-strip-wrap::-webkit-scrollbar { display: none; }
.activity-strip-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}
.act-chip {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.75rem;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text3);
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.18s;
}
.act-chip:hover { border-color: var(--g2); color: var(--g1); box-shadow: var(--glow-sm); }

@media (max-width: 500px) {
  .activity-strip-wrap { padding: 0.5rem 1rem; }
  .activity-strip-label { display: none; }
}

/* ─── CATEGORY STRIP ─── */
.cat-strip-wrap {
  position: relative;
  z-index: 10;
  padding: 0.9rem 1.8rem;
  border-bottom: 1px solid var(--border);
}
.cat-strip {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.cat-strip::-webkit-scrollbar { display: none; }
.cat-chip {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.38rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.18s;
}
.cat-chip:hover { border-color: var(--g2); color: var(--g1); }
.cat-chip.active { background: var(--s2); border-color: var(--g2); color: var(--g1); }
.cat-chip .icon { font-size: 0.9rem; }
/* SRS: practice chip badge */
.cat-chip .srs-badge {
  font-size: 0.65rem;
  background: var(--s2);
  color: var(--g3);
  border-radius: 6px;
  padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
/* SRS: due indicator dot on progress label */
#srsDueNote {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: var(--g2);
  margin-left: 0.5rem;
}

/* ─── MAIN ─── */
main {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1.5rem 2rem;
}

/* ─── PROGRESS ─── */
.progress-area {
  width: 100%;
  max-width: 580px;
  margin-bottom: 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--text3);
}
.progress-label strong { color: var(--text2); }
.progress-stats {
  display: flex;
  gap: 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
}
.stat-known { color: var(--g2); }
.stat-learn { color: var(--g3); }
.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--g1);
  border-radius: 6px;
  transition: width 0.45s cubic-bezier(0.4,0,0.2,1), background 0.4s;
}

/* ─── CARD SCENE ─── */
.card-scene {
  width: 100%;
  max-width: 620px;
  height: var(--card-h);
  perspective: 1800px;
  cursor: pointer;
  margin-bottom: 1.2rem;
  user-select: none;
}
.card-inner {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.34, 1.1, 0.64, 1);
  position: relative;
}
.card-scene.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2.5rem;
  text-align: center;
  border: 1px solid var(--border);
}

/* FRONT */
.card-front {
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--border), 0 24px 60px rgba(0,0,0,0.4);
}
.card-front::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: radial-gradient(ellipse at 30% 20%, color-mix(in srgb, var(--lvl) 8%, transparent), transparent 65%);
  pointer-events: none;
  transition: background 0.4s;
}

.card-tag {
  position: absolute;
  top: 1.2rem;
  left: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--text3);
  text-transform: uppercase;
}
.card-tag-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lvl);
  transition: background 0.4s;
}

.card-flip-hint {
  position: absolute;
  bottom: 1.2rem;
  right: 1.5rem;
  font-size: 0.65rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.word-article {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem;
  font-style: italic;
  color: var(--lvl);
  margin-bottom: 0.4rem;
  transition: color 0.4s;
  min-height: 1.5rem;
}
.word-main {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
  line-height: 1;
  margin-bottom: 0.7rem;
}
.word-type {
  font-size: 0.75rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 3px 8px;
}

/* BACK */
.card-back {
  background: var(--surface2);
  transform: rotateY(180deg);
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  border-color: color-mix(in srgb, var(--lvl) 30%, transparent);
  transition: border-color 0.4s;
}
.card-back::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: radial-gradient(ellipse at 70% 80%, color-mix(in srgb, var(--lvl) 10%, transparent), transparent 60%);
  pointer-events: none;
  transition: background 0.4s;
}

.back-en {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--lvl);
  margin-bottom: 1rem;
  line-height: 1.1;
  transition: color 0.4s;
}
.back-example {
  font-family: 'DM Serif Display', serif;
  font-size: 1rem;
  font-style: italic;
  color: var(--text2);
  line-height: 1.65;
  max-width: 420px;
}
.back-example strong {
  color: var(--text);
  font-style: normal;
  font-weight: 400;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--lvl) 50%, transparent);
  text-underline-offset: 3px;
}

/* ─── ACTION ROW ─── */
.action-row {
  display: grid;
  grid-template-columns: 48px 1fr 1fr 48px;
  gap: 0.6rem;
  width: 100%;
  max-width: 620px;
}
.flip-prompt {
  grid-column: 2 / 4;
  height: 48px;
  border-radius: var(--r-sm);
  border: 1px dashed var(--g4);
  background: transparent;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  color: var(--g3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: border-color 0.15s, color 0.15s;
}
.flip-prompt:hover { border-color: var(--g3); color: var(--g2); }
.btn-know, .btn-learn {
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease,
              border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.2s;
}
.card-scene.flipped ~ .action-row .flip-prompt { display: none; }
.card-scene.flipped ~ .action-row .btn-know,
.card-scene.flipped ~ .action-row .btn-learn {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}
.icon-btn {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all 0.18s;
}
.icon-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); transform: scale(1.05); }
.icon-btn:active { transform: scale(0.96); }

.action-btn {
  height: 48px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.btn-know {
  color: var(--g1);
  border-color: var(--s2);
}
.btn-know:hover { background: var(--s2); border-color: var(--g2); color: var(--g1); box-shadow: var(--glow-sm); }
.btn-know:active { transform: scale(0.97); }

.btn-learn {
  color: var(--g3);
  border-color: var(--s2);
}
.btn-learn:hover { background: var(--s2); border-color: var(--g2); color: var(--g1); box-shadow: var(--glow-sm); }
.btn-learn:active { transform: scale(0.97); }

.btn-know.marked { background: var(--s2); border-color: var(--g2); color: var(--g1); }
.btn-learn.marked { background: var(--s2); border-color: var(--g2); color: var(--g1); }

/* ─── SWIPE ANIMATION ─── */
@keyframes swipeRight {
  to { transform: translateX(110%) rotate(12deg); opacity: 0; }
}
@keyframes swipeLeft {
  to { transform: translateX(-110%) rotate(-12deg); opacity: 0; }
}
.swipe-right { animation: swipeRight 0.35s cubic-bezier(0.4,0,1,1) forwards; }
.swipe-left { animation: swipeLeft 0.35s cubic-bezier(0.4,0,1,1) forwards; }

/* ─── COMPLETION SCREEN ─── */
.complete-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem;
  width: 100%;
  max-width: 580px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.complete-screen.visible { display: flex; }
.complete-emoji { font-size: 3.5rem; margin-bottom: 1rem; }
.complete-title {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 0.5rem;
  color: var(--lvl);
}
.complete-sub { color: var(--text2); font-family: 'DM Serif Display', serif; font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6; }
.complete-stats {
  display: flex;
  gap: 2rem;
  margin-bottom: 2rem;
}
.c-stat-val { font-size: 2rem; font-weight: 800; }
.c-stat-lbl { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text3); margin-top: 0.2rem; }
.btn-restart {
  padding: 0.75rem 2rem;
  border-radius: 12px;
  background: var(--lvl);
  color: var(--bg);
  border: none;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.18s;
  margin-right: 0.5rem;
}
.btn-restart:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-only-learning {
  padding: 0.75rem 1.5rem;
  border-radius: 12px;
  background: none;
  color: var(--a1);
  border: 1px solid var(--a1d);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.18s;
}
.btn-only-learning:hover { background: var(--a1d); }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 0.6rem 1.2rem;
  font-size: 0.82rem;
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 500px) {
  :root { --card-h: 300px; }
  .topbar { padding: 1rem; }
  .level-tabs { padding: 0.8rem 1rem 0; }
  .cat-strip-wrap { padding: 0.7rem 1rem; }
  main { padding: 1rem; }
  .kbd-hint { display: none; }
  .action-row { grid-template-columns: 44px 1fr 1fr 44px; max-width: 100%; }
}

// ════════════════════════════════════════════════════════════
//  SRS ENGINE  (SM-2 inspired, lightweight)
// ════════════════════════════════════════════════════════════

const SRS_KEY = 'dk_srs_v1';          // localStorage key
const SRS_PRACTICE_CAT = '🔁 Needs Practice'; // virtual category name

// Load SRS metadata from localStorage. Returns {} on missing/corrupt data.
function srsLoad() {
  try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; } catch { return {}; }
}

// Persist SRS metadata
function srsSave(data) {
  try { localStorage.setItem(SRS_KEY, JSON.stringify(data)); } catch {}
}

// Deterministic, stable card ID: "level:word"
function srsId(levelKey, card) {
  return levelKey + ':' + card.w;
}

// Return SRS record for a card, creating defaults if absent
function srsGet(data, id) {
  if (!data[id]) {
    data[id] = { rep: 0, ef: 2.5, interval: 0, due: 0, lastReviewed: 0 };
  }
  return data[id];
}

// SM-2 update after a review
// isKnown=true  → quality 5 (perfect recall)
// isKnown=false → quality 1 (wrong / still learning)
function srsUpdate(id, isKnown) {
  const data = srsLoad();
  const r = srsGet(data, id);
  const now = Date.now();

  if (isKnown) {
    r.rep += 1;
    // SM-2 interval calculation
    if (r.rep === 1)      r.interval = 1;
    else if (r.rep === 2) r.interval = 6;
    else                  r.interval = Math.round(r.interval * r.ef);

    // Update ease factor: clamp between 1.3 and 3.0
    r.ef = Math.min(3.0, Math.max(1.3, r.ef + 0.1));
  } else {
    // Reset on wrong answer
    r.rep = 0;
    r.interval = 1;
    r.ef = Math.max(1.3, r.ef - 0.2);
  }

  r.due = now + r.interval * 86400000; // interval in ms
  r.lastReviewed = now;
  data[id] = r;
  srsSave(data);
}

// Is a card due for review now?
function srsDue(data, id) {
  const r = data[id];
  if (!r) return true;           // never reviewed → due immediately
  return Date.now() >= r.due;
}

// Is a card in the "needs practice" group?
// Criteria: lastReviewed exists AND (isKnown was false → rep===0) OR interval<=1
function srsPractice(data, id) {
  const r = data[id];
  if (!r || r.lastReviewed === 0) return false;
  return r.rep === 0 || r.interval <= 1;
}

// Build the "Needs Practice" deck across the current level
function buildPracticeDeck(levelKey) {
  const data = srsLoad();
  const cats = VOCAB[levelKey].cats;
  const all = Object.values(cats).flat();
  return all.filter(card => srsPractice(data, srsId(levelKey, card)));
}

// Count due cards in an array of cards
function countDue(cards, levelKey) {
  const data = srsLoad();
  return cards.filter(c => srsDue(data, srsId(levelKey, c))).length;
}

//  STATE
// ════════════════════════════════════════════════════════════

let level = 'B1';
let catKey = null;
let deck = [];
let idx = 0;
let isFlipped = false;
let known = {}; // key → true/false

function getColor() { return VOCAB[level].color; }
function getDark()  { return VOCAB[level].dark; }

function cardKey(i) {
  return level + ':' + (deck[i] ? deck[i].w : '');
}

// ════════════════════════════════════════════════════════════
//  SETUP
// ════════════════════════════════════════════════════════════

function init() {
  applyLevelStyle();
  buildCats();
  const cats = Object.keys(VOCAB[level].cats);
  catKey = cats[0];
  highlightCat();
  buildDeck();
  renderCard();
}

function applyLevelStyle() {
  const c = getColor(), d = getDark();
  document.documentElement.style.setProperty('--lvl', c);
  document.documentElement.style.setProperty('--lvld', d);
  document.querySelector('.logo span').style.color = c;
  document.querySelectorAll('.bg-orb { display: none; }

function buildCats() {
  const strip = document.getElementById('catStrip');
  strip.innerHTML = '';

  // "All" chip
  const all = document.createElement('button');
  all.className = 'cat-chip' + (catKey === '__all__' ? ' active' : '');
  all.dataset.cat = '__all__';
  all.innerHTML = '<span class="icon">✨</span> All topics';
  all.onclick = () => selectCat('__all__');
  strip.appendChild(all);

  // SRS: "Needs Practice" chip — only shown if there are practice cards
  const practiceCards = buildPracticeDeck(level);
  if (practiceCards.length > 0) {
    const pc = document.createElement('button');
    pc.className = 'cat-chip' + (catKey === '__practice__' ? ' active' : '');
    pc.dataset.cat = '__practice__';
    pc.innerHTML = `<span class="icon">🔁</span> Needs Practice <span class="srs-badge">${practiceCards.length}</span>`;
    pc.onclick = () => selectCat('__practice__');
    strip.appendChild(pc);
  } else if (catKey === '__practice__') {
    // Practice deck emptied — fall back to first real category
    catKey = Object.keys(VOCAB[level].cats)[0];
  }

  Object.keys(VOCAB[level].cats).forEach(k => {
    const chip = document.createElement('button');
    chip.className = 'cat-chip' + (catKey === k ? ' active' : '');
    chip.dataset.cat = k;
    const [icon, ...rest] = k.split(' ');
    chip.innerHTML = `<span class="icon">${icon}</span>${rest.join(' ')}`;
    chip.onclick = () => selectCat(k);
    strip.appendChild(chip);
  });
}

function highlightCat() {
  document.querySelectorAll('.cat-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === catKey);
  });
}

function buildDeck() {
  const cats = VOCAB[level].cats;
  let allCards;

  if (catKey === '__practice__') {
    // SRS: practice deck — cards marked still learning or with low interval
    allCards = buildPracticeDeck(level);
  } else if (catKey === '__all__') {
    allCards = Object.values(cats).flat();
  } else {
    allCards = [...(cats[catKey] || cats[Object.keys(cats)[0]])];
  }

  // SRS: filter to due cards only; fall back to full set if none are due
  const data = srsLoad();
  const due = allCards.filter(c => srsDue(data, srsId(level, c)));
  deck = due.length > 0 ? due : allCards;

  idx = 0;
  isFlipped = false;
  hideComplete();
}

// ════════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════════

function selectLevel(lvl) {
  level = lvl;
  catKey = Object.keys(VOCAB[level].cats)[0];
  known = {};
  document.querySelectorAll('.lvl-tab').forEach(t => t.classList.toggle('active', t.dataset.l === lvl));
  applyLevelStyle();
  buildCats();
  buildDeck();
  renderCard();
}

function selectCat(k) {
  catKey = k;
  highlightCat();
  buildDeck();
  renderCard();
  updateProgress();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardScene').classList.toggle('flipped', isFlipped);
}

function nextCard(animate) {
  if (idx >= deck.length - 1) {
    showComplete();
    return;
  }
  if (animate) {
    const scene = document.getElementById('cardScene');
    scene.classList.add(animate === 'right' ? 'swipe-right' : 'swipe-left');
    setTimeout(() => {
      scene.classList.remove('swipe-right', 'swipe-left');
      idx++;
      isFlipped = false;
      renderCard();
      updateProgress();
    }, 320);
  } else {
    idx++;
    isFlipped = false;
    renderCard();
    updateProgress();
  }
}

function prevCard() {
  if (idx === 0) return;
  idx--;
  isFlipped = false;
  renderCard();
  updateProgress();
}

function markCard(isKnown) {
  const k = cardKey(idx);
  known[k] = isKnown;
  // SRS: update spaced repetition metadata for this card
  if (deck[idx]) srsUpdate(srsId(level, deck[idx]), isKnown);
  updateButtons();
  updateProgress();
  showToast(isKnown ? '✓ Marked as known' : '✗ Still learning');
  setTimeout(() => nextCard(isKnown ? 'right' : 'left'), 200);
}

function shuffleDeck() {
  deck = deck.sort(() => Math.random() - 0.5);
  idx = 0;
  isFlipped = false;
  renderCard();
  updateProgress();
  showToast('⇄ Deck shuffled!');
}

// ════════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════════

function renderCard() {
  hideComplete();
  document.getElementById('cardScene').classList.remove('flipped', 'swipe-right', 'swipe-left');
  isFlipped = false;

  if (!deck.length || idx >= deck.length) return;
  const card = deck[idx];

  document.getElementById('tagText').textContent = level + ' · ' + cap(card.t === 'verb+prep' ? 'Verb + Präp.' : card.t);
  document.getElementById('wordArticle').textContent = card.a || '';
  document.getElementById('wordMain').textContent = card.w;
  document.getElementById('wordType').textContent = card.t === 'verb+prep' ? 'verb + Präp.' : card.t;
  document.getElementById('backEn').textContent = card.en;
  document.getElementById('backEx').innerHTML = card.ex;

  updateButtons();
  updateProgress();
}

function updateButtons() {
  const k = cardKey(idx);
  document.getElementById('btnKnow').classList.toggle('marked', known[k] === true);
  document.getElementById('btnLearn').classList.toggle('marked', known[k] === false);
}

function updateProgress() {
  const total = deck.length;
  const pct = total ? Math.round((idx / total) * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progIdx').textContent = Math.min(idx + 1, total);
  document.getElementById('progTotal').textContent = total;

  const ks = Object.values(known).filter(v => v === true).length;
  const ls = Object.values(known).filter(v => v === false).length;
  document.getElementById('knownN').textContent = ks;
  document.getElementById('learnN').textContent = ls;

  // SRS: update due note in progress label
  const dueEl = document.getElementById('srsDueNote');
  if (dueEl) {
    const allCards = catKey === '__practice__' ? buildPracticeDeck(level)
                   : catKey === '__all__'      ? Object.values(VOCAB[level].cats).flat()
                   : (VOCAB[level].cats[catKey] || []);
    const dueCount = countDue(allCards, level);
    dueEl.textContent = dueCount < allCards.length ? ` · ${dueCount} due` : '';
  }

  // SRS: refresh practice chip badge count live
  buildCats();
  highlightCat();
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

// ════════════════════════════════════════════════════════════
//  COMPLETE SCREEN
// ════════════════════════════════════════════════════════════

function showComplete() {
  document.getElementById('cardScene').style.display = 'none';
  document.getElementById('actionRow').style.display = 'none';
  const screen = document.getElementById('completeScreen');
  screen.classList.add('visible');

  const ks = Object.values(known).filter(v => v === true).length;
  const ls = Object.values(known).filter(v => v === false).length;
  const pct = deck.length ? Math.round((ks / deck.length) * 100) : 0;

  document.getElementById('cKnown').textContent = ks;
  document.getElementById('cLearn').textContent = ls;
  document.getElementById('cTotal').textContent = deck.length;

  let emoji, title, sub;
  if (pct >= 90) { emoji = '🏆'; title = 'Ausgezeichnet!'; sub = 'You knew ' + pct + '% of this deck. Incredible work!'; }
  else if (pct >= 70) { emoji = '🎉'; title = 'Sehr gut!'; sub = 'You knew ' + pct + '% of the deck. Keep it up!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Gut gemacht!'; sub = 'You knew ' + pct + '% — practice the rest!'; }
  else { emoji = '💪'; title = 'Weiter üben!'; sub = 'You knew ' + pct + '% — review the "still learning" pile.'; }

  document.getElementById('completeEmoji').textContent = emoji;
  document.getElementById('completeTitle').textContent = title;
  document.getElementById('completeSub').textContent = sub;

  const btnOnly = document.getElementById('btnOnlyLearning');
  btnOnly.style.display = ls > 0 ? 'inline-flex' : 'none';
}

function hideComplete() {
  document.getElementById('cardScene').style.display = 'block';
  document.getElementById('actionRow').style.display = 'grid';
  document.getElementById('completeScreen').classList.remove('visible');
}

function restartDeck() {
  idx = 0;
  isFlipped = false;
  hideComplete();
  renderCard();
  updateProgress();
}

function reviewLearning() {
  const learningCards = deck.filter((_, i) => {
    const k = level + ':' + deck[i].w;
    return known[k] === false;
  });
  if (learningCards.length === 0) { showToast('No learning cards!'); return; }
  deck = learningCards;
  idx = 0;
  known = {};
  isFlipped = false;
  hideComplete();
  renderCard();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ════════════════════════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════════════════════════

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); if (isFlipped) markCard(true); else nextCard(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); if (isFlipped) markCard(false); else prevCard(); }
  if ((e.key === 'y' || e.key === 'Y') && isFlipped) markCard(true);
  if ((e.key === 'n' || e.key === 'N') && isFlipped) markCard(false);
});

// ════════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════════

init();
</script>

      .catch(err => console.warn('[SW] Registration failed:', err));
