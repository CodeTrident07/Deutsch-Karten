<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch-Karten</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .logo-author {
  font-size: 0.6rem;
  margin-left: 6px;
  color: var(--text3);
  font-weight: 400;
  vertical-align: middle;
}

@media (max-width: 500px) {
  .logo-author {
    font-size: 0.5rem;
    margin-left: 3px;
  }
}
:root {
  --bg:   #080808;
  --s1:   #0f0f0f;
  --s2:   #161616;
  --s3:   #1e1e1e;
  --g1:   #f5f5f5;
  --g2:   #888;
  --g3:   #444;
  --g4:   #2e2e2e;
  --surface:  #0f0f0f;
  --surface2: #161616;
  --surface3: #1e1e1e;
  --surf:  #0f0f0f;
  --surf2: #161616;
  --surf3: #1e1e1e;
  --sf2:   #161616;
  --sf3:   #1e1e1e;
  --border:  #2e2e2e;
  --border2: #444;
  --bord:    #2e2e2e;
  --bord2:   #444;
  --text:  #f5f5f5;
  --text2: #888;
  --text3: #444;
  --ink:   #f5f5f5;
  --ink2:  #888;
  --ink3:  #444;
  /* All colour vars → greyscale */
  --green:   #f5f5f5; --greend: #161616;
  --red:     #888;    --redd:   #161616;
  --gold:    #f5f5f5; --goldd:  #161616;
  --amber:   #f5f5f5; --amberd: #161616;
  --yellow:  #f5f5f5; --yellowd:#161616;
  --orange:  #888;    --oranged:#161616;
  --purple:  #888;    --purpled:#161616;
  --blue:    #888;    --blued:  #161616;
  --silver:  #888;
  --bronze:  #444;
  --lvl:     #f5f5f5; --lvld:  #161616;
  --accent:  #f5f5f5; --accentd:#161616;
  /* Glow token */
  --glow-sm: 0 0 12px rgba(255,255,255,0.06);
  --glow-md: 0 0 24px rgba(255,255,255,0.09);
}

/* ── Hover glow for interactive elements ── */
button:not(:disabled):hover,
a.nav-btn:hover, a.back-btn:hover, a.back-link:hover {
  box-shadow: 0 0 12px rgba(255,255,255,0.06);
}
.card-scene:hover .card-face,
.quiz-card:hover {
  border-color: #444 !important;
  box-shadow: 0 0 30px rgba(255,255,255,0.05), 0 20px 48px rgba(0,0,0,0.5) !important;
}


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Bricolage Grotesque', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ─── ANIMATED BG ─── */
.bg-orb { display: none; }
.bg-orb { display: none; }
.bg-orb { display: none; }
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px, -30px); } }

/* ─── TOP BAR ─── */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.2rem 1.8rem;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  background: var(--s1);
}
.logo {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
  transition: text-shadow 0.3s, transform 0.2s;
}

.logo:hover {
  text-shadow: 0 0 12px color-mix(in srgb, var(--lvl) 60%, transparent);
  transform: translateY(-1px);
}
.logo span { color: var(--lvl); transition: color 0.4s; }

.kbd-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: var(--text3);
  display: flex;
  gap: 0.8rem;
  align-items: center;
}
.kbd {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 2px 6px;
  color: var(--text2);
}

/* ─── LEVEL TABS ─── */
.level-tabs {
  position: relative;
  z-index: 10;
  display: flex;
  padding: 1rem 1.8rem 0;
  gap: 0.3rem;
  border-bottom: 1px solid var(--border);
}
.lvl-tab {
  padding: 0.5rem 1.1rem 0.8rem;
  background: none;
  border: none;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
  top: 1px;
}
.lvl-tab[data-l="A1"] { --tc: var(--a1); }
.lvl-tab[data-l="A2"] { --tc: var(--a2); }
.lvl-tab[data-l="B1"] { --tc: var(--b1); }
.lvl-tab[data-l="B2"] { --tc: var(--b2); }
.lvl-tab[data-l="C1"] { --tc: var(--c1); }
.lvl-tab:hover { color: var(--tc); }
.lvl-tab.active { color: var(--tc); border-bottom-color: var(--tc); }

/* ─── ACTIVITY STRIP ─── */
.activity-strip-wrap {
  position: relative;
  z-index: 10;
  padding: 0.6rem 1.8rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.activity-strip-wrap::-webkit-scrollbar { display: none; }
.activity-strip-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}
.act-chip {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.75rem;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text3);
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.18s;
}
.act-chip:hover { border-color: var(--lvl); color: var(--lvl); background: var(--lvld); }

@media (max-width: 500px) {
  .activity-strip-wrap { padding: 0.5rem 1rem; }
  .activity-strip-label { display: none; }
}

/* ─── CATEGORY STRIP ─── */
.cat-strip-wrap {
  position: relative;
  z-index: 10;
  padding: 0.9rem 1.8rem;
  border-bottom: 1px solid var(--border);
}
.cat-strip {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.cat-strip::-webkit-scrollbar { display: none; }
.cat-chip {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.38rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.18s;
}
.cat-chip:hover { border-color: var(--lvl); color: var(--lvl); }
.cat-chip.active { background: var(--lvld); border-color: var(--lvl); color: var(--lvl); }
.cat-chip .icon { font-size: 0.9rem; }
/* SRS: practice chip badge */
.cat-chip .srs-badge {
  font-size: 0.65rem;
  background: #3d1515;
  color: var(--g3);
  border-radius: 6px;
  padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
/* SRS: due indicator dot on progress label */
#srsDueNote {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: var(--a2);
  margin-left: 0.5rem;
}

/* ─── MAIN ─── */
main {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1.5rem 2rem;
}

/* ─── PROGRESS ─── */
.progress-area {
  width: 100%;
  max-width: 580px;
  margin-bottom: 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--text3);
}
.progress-label strong { color: var(--text2); }
.progress-stats {
  display: flex;
  gap: 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
}
.stat-known { color: var(--b1); }
.stat-learn { color: var(--a1); }
.progress-bar {
  width: 100%;
  height: 3px;
  background: var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--lvl);
  border-radius: 6px;
  transition: width 0.45s cubic-bezier(0.4,0,0.2,1), background 0.4s;
}

/* ─── CARD SCENE ─── */
.card-scene {
  width: 100%;
  max-width: 580px;
  height: var(--card-h);
  perspective: 1800px;
  cursor: pointer;
  margin-bottom: 1.2rem;
  user-select: none;
}
.card-inner {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.34, 1.1, 0.64, 1);
  position: relative;
}
.card-scene.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2.5rem;
  text-align: center;
  border: 1px solid var(--border);
}

/* FRONT */
.card-front {
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--border), 0 24px 60px rgba(0,0,0,0.4);
}
.card-front::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: radial-gradient(ellipse at 30% 20%, color-mix(in srgb, var(--lvl) 8%, transparent), transparent 65%);
  pointer-events: none;
  transition: background 0.4s;
}

.card-tag {
  position: absolute;
  top: 1.2rem;
  left: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--text3);
  text-transform: uppercase;
}
.card-tag-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lvl);
  transition: background 0.4s;
}

.card-flip-hint {
  position: absolute;
  bottom: 1.2rem;
  right: 1.5rem;
  font-size: 0.65rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.word-article {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem;
  font-style: italic;
  color: var(--lvl);
  margin-bottom: 0.4rem;
  transition: color 0.4s;
  min-height: 1.5rem;
}
.word-main {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
  line-height: 1;
  margin-bottom: 0.7rem;
}
.word-type {
  font-size: 0.75rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 3px 8px;
}

/* BACK */
.card-back {
  background: var(--surface2);
  transform: rotateY(180deg);
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  border-color: color-mix(in srgb, var(--lvl) 30%, transparent);
  transition: border-color 0.4s;
}
.card-back::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: radial-gradient(ellipse at 70% 80%, color-mix(in srgb, var(--lvl) 10%, transparent), transparent 60%);
  pointer-events: none;
  transition: background 0.4s;
}

.back-en {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--lvl);
  margin-bottom: 1rem;
  line-height: 1.1;
  transition: color 0.4s;
}
.back-example {
  font-family: 'DM Serif Display', serif;
  font-size: 1rem;
  font-style: italic;
  color: var(--text2);
  line-height: 1.65;
  max-width: 420px;
}
.back-example strong {
  color: var(--text);
  font-style: normal;
  font-weight: 400;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--lvl) 50%, transparent);
  text-underline-offset: 3px;
}

/* ─── ACTION ROW ─── */
.action-row {
  display: grid;
  grid-template-columns: 48px 1fr 1fr 48px;
  gap: 0.6rem;
  width: 100%;
  max-width: 580px;
}
.icon-btn {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all 0.18s;
}
.icon-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); transform: scale(1.05); }
.icon-btn:active { transform: scale(0.96); }

.action-btn {
  height: 48px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.btn-know {
  color: var(--g1);
  border-color: #1a3d20;
}
.btn-know:hover { background: #0f3018; border-color: var(--g1); color: var(--g1); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(105,219,124,0.15); }
.btn-know:active { transform: scale(0.97); }

.btn-learn {
  color: var(--g3);
  border-color: #3d1515;
}
.btn-learn:hover { background: #3d1515; border-color: var(--g3); color: var(--g3); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,107,107,0.15); }
.btn-learn:active { transform: scale(0.97); }

.btn-know.marked { background: #0f3018; border-color: var(--g1); }
.btn-learn.marked { background: #3d1515; border-color: var(--g3); }

/* ─── SWIPE ANIMATION ─── */
@keyframes swipeRight {
  to { transform: translateX(110%) rotate(12deg); opacity: 0; }
}
@keyframes swipeLeft {
  to { transform: translateX(-110%) rotate(-12deg); opacity: 0; }
}
.swipe-right { animation: swipeRight 0.35s cubic-bezier(0.4,0,1,1) forwards; }
.swipe-left { animation: swipeLeft 0.35s cubic-bezier(0.4,0,1,1) forwards; }

/* ─── COMPLETION SCREEN ─── */
.complete-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem;
  width: 100%;
  max-width: 580px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.complete-screen.visible { display: flex; }
.complete-emoji { font-size: 3.5rem; margin-bottom: 1rem; }
.complete-title {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 0.5rem;
  color: var(--lvl);
}
.complete-sub { color: var(--text2); font-family: 'DM Serif Display', serif; font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6; }
.complete-stats {
  display: flex;
  gap: 2rem;
  margin-bottom: 2rem;
}
.c-stat-val { font-size: 2rem; font-weight: 800; }
.c-stat-lbl { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text3); margin-top: 0.2rem; }
.btn-restart {
  padding: 0.75rem 2rem;
  border-radius: 12px;
  background: var(--lvl);
  color: var(--bg);
  border: none;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.18s;
  margin-right: 0.5rem;
}
.btn-restart:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-only-learning {
  padding: 0.75rem 1.5rem;
  border-radius: 12px;
  background: none;
  color: var(--a1);
  border: 1px solid var(--a1d);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.18s;
}
.btn-only-learning:hover { background: var(--a1d); }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 0.6rem 1.2rem;
  font-size: 0.82rem;
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 500px) {
  :root { --card-h: 280px; }
  .topbar { padding: 1rem; }
  .level-tabs { padding: 0.8rem 1rem 0; }
  .cat-strip-wrap { padding: 0.7rem 1rem; }
  main { padding: 1rem; }
  .kbd-hint { display: none; }
  .action-row { grid-template-columns: 44px 1fr 1fr 44px; }
}
</style>
</head>
<body>


<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">
    Deutsch<span>Karten</span>
    <span class="logo-author">By Praanav</span>
  </div>
  <div class="kbd-hint">
    <span><span class="kbd">Space</span> flip</span>
    <span><span class="kbd">→</span> next</span>
    <span><span class="kbd">Y</span> know it</span>
    <span><span class="kbd">N</span> learning</span>
  </div>
</header>

<!-- LEVEL TABS -->
<div class="level-tabs" id="levelTabs">
  <button class="lvl-tab" data-l="A1" onclick="selectLevel('A1')">A1</button>
  <button class="lvl-tab" data-l="A2" onclick="selectLevel('A2')">A2</button>
  <button class="lvl-tab active" data-l="B1" onclick="selectLevel('B1')">B1</button>
  <button class="lvl-tab" data-l="B2" onclick="selectLevel('B2')">B2</button>
  <button class="lvl-tab" data-l="C1" onclick="selectLevel('C1')">C1</button>
</div>

<!-- ACTIVITY STRIP -->
<div class="activity-strip-wrap">
  <span class="activity-strip-label">Activities</span>
  <a href="wordle.html"       class="act-chip">🟩 Wördle</a>
  <a href="sprint.html"       class="act-chip">⚡ Sprint</a>
  <a href="derdiedas.html"    class="act-chip">🔵 Der/Die/Das</a>
  <a href="spelling.html"     class="act-chip">✍️ Spelling</a>
  <a href="phrases.html"      class="act-chip">💬 Phrases</a>
  <a href="praepositionen.html" class="act-chip">🔗 Präpositionen</a>
  <a href="leaderboard.html"  class="act-chip">🏆 Leaderboard</a>
</div>

<!-- CATEGORY STRIP -->
<div class="cat-strip-wrap">
  <div class="cat-strip" id="catStrip"></div>
</div>

<!-- MAIN -->
<main>
  <div class="progress-area">
    <div class="progress-meta">
      <div class="progress-label"><strong id="progIdx">1</strong> / <strong id="progTotal">1</strong> cards<span id="srsDueNote"></span></div>
      <div class="progress-stats">
        <span class="stat-known">✓ <span id="knownN">0</span></span>
        <span class="stat-learn">✗ <span id="learnN">0</span></span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <!-- CARD -->
  <div class="card-scene" id="cardScene" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <!-- FRONT -->
      <div class="card-face card-front">
        <div class="card-tag"><span class="card-tag-dot"></span><span id="tagText">B1 · Noun</span></div>
        <div class="word-article" id="wordArticle"></div>
        <div class="word-main" id="wordMain">—</div>
        <div class="word-type" id="wordType">noun</div>
        <div class="card-flip-hint">flip ↩</div>
      </div>

      {w:'das Misstrauen',a:'das', t:'noun', en:'distrust / mistrust', ex:'Das <strong>Misstrauen</strong> ist berechtigt.'},
      {w:'die Einzelheit',a:'die', t:'noun', en:'detail',         ex:'Ich brauche alle <strong>Einzelheiten</strong>.'},
      {w:'erforderlich',  a:'',    t:'adj',  en:'required / necessary', ex:'Das ist <strong>erforderlich</strong>.'},
      {w:'wesentlich',    a:'',    t:'adj',  en:'essential / significant', ex:'Das ist ein <strong>wesentlicher</strong> Punkt.'},
      {w:'nützlich',      a:'',    t:'adj',  en:'useful',          ex:'Das ist sehr <strong>nützlich</strong>.'},
      {w:'voraussetzen',  a:'',    t:'verb', en:'to presuppose / require', ex:'Das <strong>setzt</strong> Erfahrung <strong>voraus</strong>.'},
      {w:'erforschen',    a:'',    t:'verb', en:'to research / explore', ex:'Wir <strong>erforschen</strong> neue Methoden.'},
      {w:'belegen',       a:'',    t:'verb', en:'to prove / substantiate', ex:'Kannst du das <strong>belegen</strong>?'},
    ],
    '🔗 Verben mit Präpositionen': [
      {w:'appellieren an',       a:'', t:'verb+prep', en:'to appeal to  (+Akk)',             ex:'Der Minister <strong>appellierte</strong> an die Vernunft der Bürger.'},
      {w:'plädieren für',        a:'', t:'verb+prep', en:'to argue for / plead for  (+Akk)', ex:'Der Anwalt <strong>plädierte</strong> für einen Freispruch.'},
      {w:'sich abfinden mit',    a:'', t:'verb+prep', en:'to come to terms with  (+Dat)',    ex:'Er hat sich mit der Situation <strong>abgefunden</strong>.'},
      {w:'anknüpfen an',         a:'', t:'verb+prep', en:'to connect to / build on  (+Akk)', ex:'Ich möchte an Ihre Aussage <strong>anknüpfen</strong>.'},
      {w:'ausgehen von',         a:'', t:'verb+prep', en:'to assume / proceed from  (+Dat)', ex:'Wir <strong>gehen</strong> davon <strong>aus</strong>, dass es klappt.'},
      {w:'sich auseinandersetzen mit', a:'', t:'verb+prep', en:'to engage with / examine  (+Dat)', ex:'Man muss sich mit dem Thema <strong>auseinandersetzen</strong>.'},
      {w:'beruhen auf',          a:'', t:'verb+prep', en:'to be based on  (+Dat)',           ex:'Die Theorie <strong>beruht</strong> auf falschen Annahmen.'},
      {w:'einwirken auf',        a:'', t:'verb+prep', en:'to act on / influence  (+Akk)',    ex:'Stress <strong>wirkt</strong> negativ auf die Gesundheit <strong>ein</strong>.'},
      {w:'sich entscheiden für/gegen', a:'', t:'verb+prep', en:'to decide for/against  (+Akk)', ex:'Sie hat sich für die Stelle <strong>entschieden</strong>.'},
      {w:'herausgehen aus',      a:'', t:'verb+prep', en:'to emerge from  (+Dat)',           ex:'Er <strong>geht</strong> gestärkt aus der Krise <strong>heraus</strong>.'},
      {w:'sich richten nach',    a:'', t:'verb+prep', en:'to follow / be guided by  (+Dat)', ex:'Das Urteil <strong>richtet</strong> sich nach dem Gesetz.'},
      {w:'zurückführen auf',     a:'', t:'verb+prep', en:'to attribute to / trace back to  (+Akk)', ex:'Den Fehler kann man auf mangelnde Kommunikation <strong>zurückführen</strong>.'},
    ],
  }
},

}; // end VOCAB

// ════════════════════════════════════════════════════════════
//  SRS ENGINE  (SM-2 inspired, lightweight)
// ════════════════════════════════════════════════════════════

const SRS_KEY = 'dk_srs_v1';          // localStorage key
const SRS_PRACTICE_CAT = '🔁 Needs Practice'; // virtual category name

// Load SRS metadata from localStorage. Returns {} on missing/corrupt data.
function srsLoad() {
  try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; } catch { return {}; }
}

// Persist SRS metadata
function srsSave(data) {
  try { localStorage.setItem(SRS_KEY, JSON.stringify(data)); } catch {}
}

// Deterministic, stable card ID: "level:word"
function srsId(levelKey, card) {
  return levelKey + ':' + card.w;
}

// Return SRS record for a card, creating defaults if absent
function srsGet(data, id) {
  if (!data[id]) {
    data[id] = { rep: 0, ef: 2.5, interval: 0, due: 0, lastReviewed: 0 };
  }
  return data[id];
}

// SM-2 update after a review
// isKnown=true  → quality 5 (perfect recall)
// isKnown=false → quality 1 (wrong / still learning)
function srsUpdate(id, isKnown) {
  const data = srsLoad();
  const r = srsGet(data, id);
  const now = Date.now();

  if (isKnown) {
    r.rep += 1;
    // SM-2 interval calculation
    if (r.rep === 1)      r.interval = 1;
    else if (r.rep === 2) r.interval = 6;
    else                  r.interval = Math.round(r.interval * r.ef);

    // Update ease factor: clamp between 1.3 and 3.0
    r.ef = Math.min(3.0, Math.max(1.3, r.ef + 0.1));
  } else {
    // Reset on wrong answer
    r.rep = 0;
    r.interval = 1;
    r.ef = Math.max(1.3, r.ef - 0.2);
  }

  r.due = now + r.interval * 86400000; // interval in ms
  r.lastReviewed = now;
  data[id] = r;
  srsSave(data);
}

// Is a card due for review now?
function srsDue(data, id) {
  const r = data[id];
  if (!r) return true;           // never reviewed → due immediately
  return Date.now() >= r.due;
}

// Is a card in the "needs practice" group?
// Criteria: lastReviewed exists AND (isKnown was false → rep===0) OR interval<=1
function srsPractice(data, id) {
  const r = data[id];
  if (!r || r.lastReviewed === 0) return false;
  return r.rep === 0 || r.interval <= 1;
}

// Build the "Needs Practice" deck across the current level
function buildPracticeDeck(levelKey) {
  const data = srsLoad();
  const cats = VOCAB[levelKey].cats;
  const all = Object.values(cats).flat();
  return all.filter(card => srsPractice(data, srsId(levelKey, card)));
}

// Count due cards in an array of cards
function countDue(cards, levelKey) {
  const data = srsLoad();
  return cards.filter(c => srsDue(data, srsId(levelKey, c))).length;
}

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════

let level = 'B1';
let catKey = null;
let deck = [];
let idx = 0;
let isFlipped = false;
let known = {}; // key → true/false

function getColor() { return VOCAB[level].color; }
function getDark()  { return VOCAB[level].dark; }

function cardKey(i) {
  return level + ':' + (deck[i] ? deck[i].w : '');
}

// ════════════════════════════════════════════════════════════
//  SETUP
// ════════════════════════════════════════════════════════════

function init() {
  applyLevelStyle();
  buildCats();
  const cats = Object.keys(VOCAB[level].cats);
  catKey = cats[0];
  highlightCat();
  buildDeck();
  renderCard();
}

function applyLevelStyle() {
  const c = getColor(), d = getDark();
  document.documentElement.style.setProperty('--lvl', c);
  document.documentElement.style.setProperty('--lvld', d);
  document.querySelector('.logo span').style.color = c;
  document.querySelectorAll('.bg-orb { display: none; }

function buildCats() {
  const strip = document.getElementById('catStrip');
  strip.innerHTML = '';

  // "All" chip
  const all = document.createElement('button');
  all.className = 'cat-chip' + (catKey === '__all__' ? ' active' : '');
  all.dataset.cat = '__all__';
  all.innerHTML = '<span class="icon">✨</span> All topics';
  all.onclick = () => selectCat('__all__');
  strip.appendChild(all);

  // SRS: "Needs Practice" chip — only shown if there are practice cards
  const practiceCards = buildPracticeDeck(level);
  if (practiceCards.length > 0) {
    const pc = document.createElement('button');
    pc.className = 'cat-chip' + (catKey === '__practice__' ? ' active' : '');
    pc.dataset.cat = '__practice__';
    pc.innerHTML = `<span class="icon">🔁</span> Needs Practice <span class="srs-badge">${practiceCards.length}</span>`;
    pc.onclick = () => selectCat('__practice__');
    strip.appendChild(pc);
  } else if (catKey === '__practice__') {
    // Practice deck emptied — fall back to first real category
    catKey = Object.keys(VOCAB[level].cats)[0];
  }

  Object.keys(VOCAB[level].cats).forEach(k => {
    const chip = document.createElement('button');
    chip.className = 'cat-chip' + (catKey === k ? ' active' : '');
    chip.dataset.cat = k;
    const [icon, ...rest] = k.split(' ');
    chip.innerHTML = `<span class="icon">${icon}</span>${rest.join(' ')}`;
    chip.onclick = () => selectCat(k);
    strip.appendChild(chip);
  });
}

function highlightCat() {
  document.querySelectorAll('.cat-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === catKey);
  });
}

function buildDeck() {
  const cats = VOCAB[level].cats;
  let allCards;

  if (catKey === '__practice__') {
    // SRS: practice deck — cards marked still learning or with low interval
    allCards = buildPracticeDeck(level);
  } else if (catKey === '__all__') {
    allCards = Object.values(cats).flat();
  } else {
    allCards = [...(cats[catKey] || cats[Object.keys(cats)[0]])];
  }

  // SRS: filter to due cards only; fall back to full set if none are due
  const data = srsLoad();
  const due = allCards.filter(c => srsDue(data, srsId(level, c)));
  deck = due.length > 0 ? due : allCards;

  idx = 0;
  isFlipped = false;
  hideComplete();
}

// ════════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════════

function selectLevel(lvl) {
  level = lvl;
  catKey = Object.keys(VOCAB[level].cats)[0];
  known = {};
  document.querySelectorAll('.lvl-tab').forEach(t => t.classList.toggle('active', t.dataset.l === lvl));
  applyLevelStyle();
  buildCats();
  buildDeck();
  renderCard();
}

function selectCat(k) {
  catKey = k;
  highlightCat();
  buildDeck();
  renderCard();
  updateProgress();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardScene').classList.toggle('flipped', isFlipped);
}

function nextCard(animate) {
  if (idx >= deck.length - 1) {
    showComplete();
    return;
  }
  if (animate) {
    const scene = document.getElementById('cardScene');
    scene.classList.add(animate === 'right' ? 'swipe-right' : 'swipe-left');
    setTimeout(() => {
      scene.classList.remove('swipe-right', 'swipe-left');
      idx++;
      isFlipped = false;
      renderCard();
      updateProgress();
    }, 320);
  } else {
    idx++;
    isFlipped = false;
    renderCard();
    updateProgress();
  }
}

function prevCard() {
  if (idx === 0) return;
  idx--;
  isFlipped = false;
  renderCard();
  updateProgress();
}

function markCard(isKnown) {
  const k = cardKey(idx);
  known[k] = isKnown;
  // SRS: update spaced repetition metadata for this card
  if (deck[idx]) srsUpdate(srsId(level, deck[idx]), isKnown);
  updateButtons();
  updateProgress();
  showToast(isKnown ? '✓ Marked as known' : '✗ Still learning');
  setTimeout(() => nextCard(isKnown ? 'right' : 'left'), 200);
}

function shuffleDeck() {
  deck = deck.sort(() => Math.random() - 0.5);
  idx = 0;
  isFlipped = false;
  renderCard();
  updateProgress();
  showToast('⇄ Deck shuffled!');
}

// ════════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════════

function renderCard() {
  hideComplete();
  document.getElementById('cardScene').classList.remove('flipped', 'swipe-right', 'swipe-left');
  isFlipped = false;

  if (!deck.length || idx >= deck.length) return;
  const card = deck[idx];

  document.getElementById('tagText').textContent = level + ' · ' + cap(card.t === 'verb+prep' ? 'Verb + Präp.' : card.t);
  document.getElementById('wordArticle').textContent = card.a || '';
  document.getElementById('wordMain').textContent = card.w;
  document.getElementById('wordType').textContent = card.t === 'verb+prep' ? 'verb + Präp.' : card.t;
  document.getElementById('backEn').textContent = card.en;
  document.getElementById('backEx').innerHTML = card.ex;

  updateButtons();
  updateProgress();
}

function updateButtons() {
  const k = cardKey(idx);
  document.getElementById('btnKnow').classList.toggle('marked', known[k] === true);
  document.getElementById('btnLearn').classList.toggle('marked', known[k] === false);
}

function updateProgress() {
  const total = deck.length;
  const pct = total ? Math.round((idx / total) * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progIdx').textContent = Math.min(idx + 1, total);
  document.getElementById('progTotal').textContent = total;

  const ks = Object.values(known).filter(v => v === true).length;
  const ls = Object.values(known).filter(v => v === false).length;
  document.getElementById('knownN').textContent = ks;
  document.getElementById('learnN').textContent = ls;

  // SRS: update due note in progress label
  const dueEl = document.getElementById('srsDueNote');
  if (dueEl) {
    const allCards = catKey === '__practice__' ? buildPracticeDeck(level)
                   : catKey === '__all__'      ? Object.values(VOCAB[level].cats).flat()
                   : (VOCAB[level].cats[catKey] || []);
    const dueCount = countDue(allCards, level);
    dueEl.textContent = dueCount < allCards.length ? ` · ${dueCount} due` : '';
  }

  // SRS: refresh practice chip badge count live
  buildCats();
  highlightCat();
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

// ════════════════════════════════════════════════════════════
//  COMPLETE SCREEN
// ════════════════════════════════════════════════════════════

function showComplete() {
  document.getElementById('cardScene').style.display = 'none';
  document.getElementById('actionRow').style.display = 'none';
  const screen = document.getElementById('completeScreen');
  screen.classList.add('visible');

  const ks = Object.values(known).filter(v => v === true).length;
  const ls = Object.values(known).filter(v => v === false).length;
  const pct = deck.length ? Math.round((ks / deck.length) * 100) : 0;

  document.getElementById('cKnown').textContent = ks;
  document.getElementById('cLearn').textContent = ls;
  document.getElementById('cTotal').textContent = deck.length;

  let emoji, title, sub;
  if (pct >= 90) { emoji = '🏆'; title = 'Ausgezeichnet!'; sub = 'You knew ' + pct + '% of this deck. Incredible work!'; }
  else if (pct >= 70) { emoji = '🎉'; title = 'Sehr gut!'; sub = 'You knew ' + pct + '% of the deck. Keep it up!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Gut gemacht!'; sub = 'You knew ' + pct + '% — practice the rest!'; }
  else { emoji = '💪'; title = 'Weiter üben!'; sub = 'You knew ' + pct + '% — review the "still learning" pile.'; }

  document.getElementById('completeEmoji').textContent = emoji;
  document.getElementById('completeTitle').textContent = title;
  document.getElementById('completeSub').textContent = sub;

  const btnOnly = document.getElementById('btnOnlyLearning');
  btnOnly.style.display = ls > 0 ? 'inline-flex' : 'none';
}

function hideComplete() {
  document.getElementById('cardScene').style.display = 'block';
  document.getElementById('actionRow').style.display = 'grid';
  document.getElementById('completeScreen').classList.remove('visible');
}

function restartDeck() {
  idx = 0;
  isFlipped = false;
  hideComplete();
  renderCard();
  updateProgress();
}

function reviewLearning() {
  const learningCards = deck.filter((_, i) => {
    const k = level + ':' + deck[i].w;
    return known[k] === false;
  });
  if (learningCards.length === 0) { showToast('No learning cards!'); return; }
  deck = learningCards;
  idx = 0;
  known = {};
  isFlipped = false;
  hideComplete();
  renderCard();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ════════════════════════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════════════════════════

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft')  prevCard();
  if (e.key === 'y' || e.key === 'Y') markCard(true);
  if (e.key === 'n' || e.key === 'N') markCard(false);
});

// ════════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════════

init();
</script>
