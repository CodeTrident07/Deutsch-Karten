<title>DeutschKarten – Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Surfaces ── */
  --bg:   #080808;
  --s1:   #0f0f0f;
  --s2:   #161616;
  --s3:   #1e1e1e;
  --s4:   #242424;

  /* ── Greyscale ── */
  --g1:   #f0f0f0;
  --g2:   #909090;
  --g3:   #484848;
  --g4:   #303030;

  /* ── Semantic aliases ── */
  --surface:   var(--s1);
  --surface2:  var(--s2);
  --surface3:  var(--s3);
  --border:    var(--g4);
  --border2:   var(--g3);
  --text:      var(--g1);
  --text2:     var(--g2);
  --text3:     var(--g3);
  --ink:       var(--g1);
  --ink2:      var(--g2);
  --ink3:      var(--g3);

  /* ── Spacing scale (4px base) ── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ── Typography ── */
  --font-sans:  'Bricolage Grotesque', system-ui, sans-serif;
  --font-serif: 'DM Serif Display', Georgia, serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --text-xs:   0.65rem;   /* 10.4px — labels, badges */
  --text-sm:   0.75rem;   /* 12px   — secondary text */
  --text-base: 0.875rem;  /* 14px   — body */
  --text-md:   1rem;      /* 16px   — UI text */
  --text-lg:   1.25rem;   /* 20px   — card headings */
  --text-xl:   1.5rem;    /* 24px   — section headings */
  --text-2xl:  2rem;      /* 32px   — display */
  --text-3xl:  2.8rem;    /* 44px   — hero */

  /* ── Border radius ── */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 24px;

  /* ── Shadows ── */
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.5);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.6);
  --shadow-lg:  0 12px 40px rgba(0,0,0,0.7);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.6), 0 16px 40px rgba(0,0,0,0.5);

  /* ── Glow (monochrome white) ── */
  --glow-xs:  0 0 8px  rgba(255,255,255,0.04);
  --glow-sm:  0 0 16px rgba(255,255,255,0.06);
  --glow-md:  0 0 28px rgba(255,255,255,0.08);

  /* ── Transitions ── */
  --ease:       cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:   cubic-bezier(0, 0, 0.2, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast:     100ms;
  --t-base:     160ms;
  --t-slow:     280ms;

  /* ── Layout ── */
  --topbar-h:   52px;
  --card-max:   600px;
  --page-max:   860px;

  /* ── Keep old names pointing to new tokens (backward compat) ── */
  --surf:    var(--s1);
  --surf2:   var(--s2);
  --surf3:   var(--s3);
  --sf2:     var(--s2);
  --sf3:     var(--s3);
  --bord:    var(--g4);
  --bord2:   var(--g3);
  --rule:    var(--g4);
  --rule2:   var(--g3);
  --ln2:     var(--g3);
  --line:    var(--g4);
  --glow:    var(--glow-sm);
  --glow-sm: 0 0 16px rgba(255,255,255,0.06);

  /* ── Activity-specific (keep for derdiedas, old level vars) ── */
  --der:  var(--g1); --derd: var(--s2);
  --die:  var(--g2); --died: var(--s2);
  --das:  var(--g2); --dasd: var(--s2);
  --a1: var(--g1); --a1d: var(--s2); --a1m: rgba(255,255,255,0.04);
  --a2: var(--g1); --a2d: var(--s2); --a2m: rgba(255,255,255,0.04);
  --b1: var(--g1); --b1d: var(--s2); --b1m: rgba(255,255,255,0.04);
  --b2: var(--g1); --b2d: var(--s2); --b2m: rgba(255,255,255,0.04);
  --c1: var(--g1); --c1d: var(--s2); --c1m: rgba(255,255,255,0.04);
  --amber: var(--g1); --amberd: var(--s2);
  --accent: var(--g1); --accentd: var(--s2);
  --lvl: var(--g1); --lvld: var(--s2); --lvlm: rgba(255,255,255,0.04);
  --green:   var(--g1); --greend: var(--s2);
  --red:     var(--g2); --redd:   var(--s2);
  --gold:    var(--g1); --goldd:  var(--s2);
  --silver:  var(--g2);
  --bronze:  var(--g3);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--g1);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font-family: inherit; }

/* ── Focus ring — accessibility ── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--g4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--g3); }

/* ── Topbar — shared across all pages ── */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--g4);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--g1);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  transition: opacity var(--t-base) var(--ease);
  user-select: none;
}
.logo:hover { opacity: 0.6; }
.logo-slash {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--g3);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ── Back link / nav buttons — universal ── */
.back-link, .nav-btn, .back-btn {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  color: var(--g3);
  text-decoration: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--g4);
  border-radius: var(--r-xs);
  background: transparent;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.back-link:hover, .nav-btn:hover, .back-btn:hover {
  color: var(--g1);
  border-color: var(--g3);
  box-shadow: var(--glow-sm);
}
:is(.back-link, .nav-btn, .back-btn):focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
}

/* ── Primary button ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.6rem;
  background: var(--g1);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 800;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: opacity var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease),
              transform var(--t-fast) var(--ease);
}
.btn-primary:hover {
  opacity: 0.88;
  box-shadow: 0 0 20px rgba(255,255,255,0.12);
  transform: translateY(-1px);
}
.btn-primary:active { transform: scale(0.97); opacity: 0.8; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Ghost button ── */
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.4rem;
  background: transparent;
  color: var(--g2);
  border: 1px solid var(--g4);
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 700;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.btn-ghost:hover { color: var(--g1); border-color: var(--g3); box-shadow: var(--glow-sm); }
.btn-ghost:active { transform: scale(0.97); }
.btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Card surface ── */
.card {
  background: var(--s1);
  border: 1px solid var(--g4);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  pointer-events: none;
}

/* ── Input ── */
.input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.55rem 0.85rem;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--g1);
  outline: none;
  transition: border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.input:focus {
  border-color: var(--g3);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
}
.input::placeholder { color: var(--g3); }
.input:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Progress bar ── */
.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--g4);
  overflow: hidden;
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  background: var(--g1);
  border-radius: 1px;
  transition: width 0.4s var(--ease);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--sp-8);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.45rem 1rem;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.03em;
  color: var(--g2);
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  transition: opacity var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Utility ── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}


.card-scene:hover .card-face,
.quiz-card:hover {
  border-color: var(--g3);
  box-shadow: 0 0 30px rgba(255,255,255,0.05), 0 20px 48px rgba(0,0,0,0.5) !important;
}

.nav-btn, .back-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--ink3);
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid var(--border2);
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.nav-btn:hover, .back-btn:hover {
  color: var(--ink);
  border-color: var(--ink3);
  background: var(--surface2);
}


html { font-size: 18px; }
body {
  background: var(--bg);
  font-family: 'Bricolage Grotesque', sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── Animated bg ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.18;
  pointer-events: none;
  z-index: 0;
}





/* ── Topbar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.04em; }
.logo span { color: var(--green); }
.logo small { font-size: 0.62rem; font-family: 'JetBrains Mono', monospace; color: var(--text3); margin-left: 0.5rem; }
.top-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.86rem; font-weight: 600;
  color: var(--text3); letter-spacing: 0.06em;
  text-transform: uppercase; text-align: center;
}
.top-right { display: flex; gap: 0.6rem; justify-self: end; align-items: center; }



/* ── Hero ── */
.hero {
  position: relative; z-index: 1;
  text-align: center;
  padding: 3rem 2rem 2rem;
}
.hero-title {
  font-size: clamp(2.2rem, 6vw, 3.5rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 0.6rem;
}
.hero-title .trophy { display: inline-block; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.hero-sub {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--text2);
  margin-bottom: 1.5rem;
}
.refresh-btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--sf2); border: 1px solid var(--bord2);
  border-radius: 6px; padding: 0.4rem 1rem;
  font-family: 'JetBrains Mono', monospace; font-size: 0.83rem;
  color: var(--text2); cursor: pointer; transition: all 0.2s;
  font-weight: 600;
}
.refresh-btn:hover { border-color: var(--green); color: var(--green); }
.refresh-btn.spinning span { display: inline-block; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Podium ── */
.podium-section {
  position: relative; z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0.8rem;
  padding: 0 2rem 2rem;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}

.podium-slot {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  max-width: 200px;
}

.podium-slot:nth-child(1) { order: 2; }
.podium-slot:nth-child(2) { order: 1; }
.podium-slot:nth-child(3) { order: 3; }

.podium-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; font-weight: 800;
  border: 3px solid var(--border);
  position: relative;
  transition: transform 0.3s;
}
.podium-avatar:hover { transform: scale(1.08); }

.podium-slot:nth-child(1) .podium-avatar { width: 68px; height: 68px; font-size: 1.6rem; border-color: var(--gold); background: var(--goldd); color: var(--gold); }
.podium-slot:nth-child(2) .podium-avatar { border-color: var(--silver); background: var(--s1); color: var(--silver); }
.podium-slot:nth-child(3) .podium-avatar { border-color: var(--bronze); background: var(--s1); color: var(--bronze); }

.podium-crown {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
  font-size: 1rem;
}

.podium-name {
  font-size: 0.95rem; font-weight: 700;
  color: var(--text);
  text-align: center;
  max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.podium-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem; color: var(--text2);
  text-align: center;
}

.podium-block {
  width: 100%;
  border-radius: 12px 12px 0 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  padding: 0.8rem 0;
  border: 1px solid var(--border);
  border-bottom: none;
}
.podium-slot:nth-child(1) .podium-block { height: 90px; background: linear-gradient(180deg, var(--goldd) 0%, transparent 100%); border-color: var(--gold); }
.podium-slot:nth-child(2) .podium-block { height: 60px; background: linear-gradient(180deg, rgba(206,212,218,0.05) 0%, transparent 100%); border-color: var(--silver); }
.podium-slot:nth-child(3) .podium-block { height: 45px; background: linear-gradient(180deg, rgba(205,127,50,0.06) 0%, transparent 100%); border-color: var(--bronze); }

/* ── Main list ── */
.list-section {
  position: relative; z-index: 1;
  max-width: 780px; margin: 0 auto;
  width: 100%; padding: 0 1.5rem 4rem;
}

.list-header {
  display: grid;
  grid-template-columns: 2.5rem 1fr 90px 90px 90px;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem; font-weight: 700;
  color: var(--text3); letter-spacing: 0.07em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.4rem;
}

.list-header span:not(:first-child) { text-align: right; }

.player-row {
  display: grid;
  grid-template-columns: 2.5rem 1fr 90px 90px 90px;
  gap: 0.5rem;
  align-items: center;
  padding: 0.75rem 1rem;
  border-radius: 14px;
  border: 1px solid transparent;
  transition: background 0.2s, border-color 0.2s;
  animation: rowIn 0.35s ease both;
  cursor: default;
}
@keyframes rowIn {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: translateX(0); }
}
.player-row:hover { background: var(--sf2); border-color: var(--bord2); }
.player-row.is-me { background: var(--greend); border-color: var(--green) !important; }
.player-row.is-me:hover { background: var(--s1); }

.row-rank {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem; font-weight: 700;
  color: var(--text3);
  text-align: center;
}
.row-rank.gold   { color: var(--gold); }
.row-rank.silver { color: var(--silver); }
.row-rank.bronze { color: var(--bronze); }

.row-player { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
.row-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--sf2); border: 1.5px solid var(--bord2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 800; flex-shrink: 0;
  color: var(--text2);
}
.is-me .row-avatar { border-color: var(--green); color: var(--green); background: var(--greend); }

.row-info { min-width: 0; }
.row-name {
  font-size: 0.98rem; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row-badges { display: flex; gap: 0.25rem; margin-top: 0.15rem; }
.badge {
  font-size: 0.72rem;
  padding: 0.1rem 0.4rem;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.badge-fire   { background: var(--s1); color: var(--orange); border: 1px solid rgba(255,169,77,0.3); }
.badge-spell  { background: var(--s1); color: var(--blue);   border: 1px solid rgba(116,192,252,0.3); }
.badge-top    { background: var(--goldd); color: var(--gold);             border: 1px solid rgba(255,212,59,0.3); }
.badge-new    { background: var(--greend); color: var(--green);           border: 1px solid rgba(105,219,124,0.3); }

.row-stat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem; font-weight: 700;
  text-align: right; color: var(--text2);
}
.row-stat.highlight { color: var(--text); }

.row-activity {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem; color: var(--text3);
  text-align: right;
}

/* ── Activity feed ── */
.feed-section {
  position: relative; z-index: 1;
  max-width: 780px; margin: 0 auto;
  width: 100%; padding: 0 1.5rem 2rem;
}
.section-title {
  font-size: 0.8rem; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text3); font-family: 'JetBrains Mono', monospace;
  margin-bottom: 0.8rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

.feed-item {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.65rem 0;
  border-bottom: 1px solid var(--border);
  animation: rowIn 0.3s ease both;
  font-size: 0.95rem;
}
.feed-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--sf2); border: 1px solid var(--bord2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; font-weight: 800; color: var(--text2); flex-shrink: 0;
}
.feed-text { flex: 1; color: var(--text2); }
.feed-text strong { color: var(--text); }
.feed-time { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--text3); }

/* ── Your stats card ── */
.my-stats {
  position: relative; z-index: 1;
  max-width: 780px; margin: 0 auto;
  width: 100%; padding: 0 1.5rem 1rem;
}
.my-stats-card {
  background: var(--greend);
  border: 1px solid var(--green);
  border-radius: 18px;
  padding: 1.2rem 1.5rem;
  display: flex; align-items: center; gap: 1.5rem;
  flex-wrap: wrap;
}
.my-stats-title {
  font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--green); font-family: 'JetBrains Mono', monospace;
  margin-bottom: 1rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid rgba(105,219,124,0.2);
  max-width: 780px; margin: 0 auto; width: 100%;
  padding: 0 1.5rem 0.6rem;
}
.my-stat { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; flex: 1; min-width: 70px; }
.my-stat-val { font-size: 1.6rem; font-weight: 800; color: var(--green); }
.my-stat-label { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: rgba(105,219,124,0.6); text-transform: uppercase; letter-spacing: 0.05em; }
.my-rank-big { font-size: 2rem; font-weight: 800; color: var(--gold); }

/* ── Empty / loading states ── */
.state-msg {
  text-align: center; padding: 3rem 1rem;
  font-family: 'DM Serif Display', serif; font-style: italic;
  color: var(--text3); font-size: 1.1rem;
}
.loading-dots::after {
  content: '...';
  animation: dots 1.2s steps(3,end) infinite;
}
@keyframes dots {
  0%   { content: '.'; }
  33%  { content: '..'; }
  66%  { content: '...'; }
  100% { content: '.'; }
}

/* ── Tabs ── */
.tabs-row {
  position: relative; z-index: 1;
  display: flex; gap: 0.5rem;
  max-width: 780px; margin: 0 auto;
  width: 100%; padding: 1rem 1.5rem 0;
}
.tab-btn {
  padding: 0.45rem 1.1rem;
  border-radius: 6px;
  border: 1px solid var(--bord2);
  background: var(--sf2);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.9rem; font-weight: 700;
  color: var(--text2); cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: var(--green); color: var(--bg); border-color: var(--green); }

/* Contact */
.contact-footer {
  position: fixed; bottom: 1rem; left: 1.5rem;
  font-size: 0.68rem; color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none; z-index: 50;
}
.contact-footer span { color: var(--text2); }

@media (max-width: 600px) {
  .topbar { padding: 0.8rem 1rem; }
  .hero { padding: 2rem 1rem 1rem; }
  .podium-section { padding: 0 1rem 1.5rem; gap: 0.5rem; }
  .list-section, .feed-section, .my-stats { padding: 0 1rem 2rem; }
  .list-header, .player-row { grid-template-columns: 2rem 1fr 70px 70px; }
  .list-header .col-streak, .player-row .col-streak { display: none; }
  .my-stats-card { gap: 0.8rem; }
  .my-stat-val { font-size: 1.2rem; }
}
</style>
</head>

// ── Auth guard ────────────────────────────────────────────────
let currentUser = null;

(function() {
  try {
    const s = JSON.parse(localStorage.getItem('dk_session'));
    if (!s) { window.location.href = 'index.html'; return; }
    const u = JSON.parse(localStorage.getItem('dk_users') || '{}')[s.email];
    if (!u) { window.location.href = 'index.html'; return; }
    currentUser = u;
  } catch { window.location.href = 'index.html'; }
})();

// ── Helpers ───────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0,10); }

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function getInitials(name) {
  return (name || '?').slice(0, 2).toUpperCase();
}

// ── Load local stats for current user ─────────────────────────
function getMyStats() {
  const email = currentUser.email;

  // Count total known words across all levels from SRS data
  const srsKey  = 'srs_data_v1_' + email;
  let srsData   = {};
  try { srsData = JSON.parse(localStorage.getItem(srsKey)) || {}; } catch {}
  const wordsKnown = Object.values(srsData).filter(c => c && c.interval >= 4).length;

  // Streak
  let streak = 0;
  try {
    const sd = JSON.parse(localStorage.getItem('dk_streak_' + email));
    streak = (sd && sd.last === todayStr()) ? sd.count : (sd ? sd.count : 0);
  } catch {}

  // Best spelling accuracy from localStorage (we'll track this)
  let spellingAcc = 0;
  try {
    const sa = JSON.parse(localStorage.getItem('dk_spell_acc_' + email));
    spellingAcc = sa ? sa.pct : 0;
  } catch {}

  // Best level (just show current level or highest unlocked)
  const levels = ['A1','A2','B1','B2','C1'];
  let level = 'A1';
  for (const lvl of levels) {
    const k = 'srs_data_v1_' + email;
    if (srsData && Object.keys(srsData).some(id => id.startsWith(lvl + ':'))) level = lvl;
  }

  return { wordsKnown, streak, spellingAcc, level, email, name: currentUser.name };
}

// ── Push my stats to shared storage ───────────────────────────
// ── Save/load all local accounts' stats ──────────────────────
function getAllLocalPlayers() {
  // Gather stats for every account saved on this browser
  const players = [];
  try {
    const users = JSON.parse(localStorage.getItem('dk_users') || '{}');
    for (const email of Object.keys(users)) {
      const user = users[email];
      const srsKey = 'srs_data_v1_' + email;
      let srsData = {};
      try { srsData = JSON.parse(localStorage.getItem(srsKey)) || {}; } catch {}
      const wordsKnown = Object.values(srsData).filter(c => c && c.interval >= 4).length;

      let streak = 0;
      try {
        const sd = JSON.parse(localStorage.getItem('dk_streak_' + email));
        if (sd) streak = sd.last === todayStr() ? sd.count : sd.count;
      } catch {}

      let spellingAcc = 0;
      try {
        const sa = JSON.parse(localStorage.getItem('dk_spell_acc_' + email));
        spellingAcc = sa ? sa.pct : 0;
      } catch {}

      // Best level
      let level = 'A1';
      const lvls = ['A1','A2','B1','B2','C1'];
      for (const lvl of lvls) {
        if (Object.keys(srsData).some(id => id.startsWith(lvl + ':'))) level = lvl;
      }

      let updatedAt = 0;
      try {
        const sd = JSON.parse(localStorage.getItem('dk_streak_' + email));
        if (sd && sd.last === todayStr()) updatedAt = Date.now();
        else if (sd) updatedAt = new Date(sd.last).getTime() + 86400000;
      } catch {}

      players.push({ name: user.name, email, wordsKnown, streak, spellingAcc, level, updatedAt });
    }
  } catch {}
  return players;
}

function getActivityFeed() {
  const items = [];
  try {
    const users = JSON.parse(localStorage.getItem('dk_users') || '{}');
    for (const email of Object.keys(users)) {
      const user = users[email];
      let streak = 0;
      try {
        const sd = JSON.parse(localStorage.getItem('dk_streak_' + email));
        if (sd) streak = sd.count;
      } catch {}
      const srsKey = 'srs_data_v1_' + email;
      let srsData = {};
      try { srsData = JSON.parse(localStorage.getItem(srsKey)) || {}; } catch {}
      const wordsKnown = Object.values(srsData).filter(c => c && c.interval >= 4).length;
      items.push({ name: user.name, email, streak, wordsKnown, ts: Date.now() - Math.random() * 3600000 });
    }
  } catch {}
  return items;
}

// ── Load leaderboard ──────────────────────────────────────────
let currentTab = 'words';
let allPlayers = [];

async function loadLeaderboard() {
  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');
  btn.classList.add('spinning');
  icon.textContent = '↻';

  allPlayers = getAllLocalPlayers();
  renderLeaderboard();
  renderFeed(getActivityFeed());
  renderMyStats();

  btn.classList.remove('spinning');
}

// ── Render leaderboard ────────────────────────────────────────
function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLeaderboard();
}

function sortKey(tab) {
  if (tab === 'streak')   return 'streak';
  if (tab === 'spelling') return 'spellingAcc';
  return 'wordsKnown';
}

function renderLeaderboard() {
  const sorted = [...allPlayers].sort((a,b) => (b[sortKey(currentTab)]||0) - (a[sortKey(currentTab)]||0));
  renderPodium(sorted.slice(0,3));
  renderList(sorted);
}

function renderPodium(top3) {
  const section = document.getElementById('podiumSection');
  if (top3.length === 0) { section.innerHTML = ''; return; }

  const order = [top3[0], top3[1], top3[2]]; // 1st, 2nd, 3rd
  const medals = ['🥇','🥈','🥉'];
  const ranks  = [1,2,3];

  section.innerHTML = order.map((p, i) => {
    if (!p) return '<div class="podium-slot"></div>';
    const isMe = p.email === currentUser.email;
    const val  = currentTab === 'words' ? p.wordsKnown + ' words'
               : currentTab === 'streak' ? p.streak + ' days'
               : (p.spellingAcc || 0) + '% acc';
    return `
      <div class="podium-slot">
        <div class="podium-avatar" style="${isMe ? 'border-color:var(--green);background:var(--greend);color:var(--green)' : ''}">
          ${i === 0 ? '<div class="podium-crown">👑</div>' : ''}
          ${getInitials(p.name)}
        </div>
        <div class="podium-name">${escHtml(p.name)}${isMe ? ' (you)' : ''}</div>
        <div class="podium-score">${val}</div>
        <div class="podium-block">${medals[i]}</div>
      </div>`;
  }).join('');
}

function renderList(sorted) {
  const list = document.getElementById('leaderList');
  if (sorted.length === 0) {
    list.innerHTML = '<div class="state-msg">No players yet — be the first! 🚀</div>';
    return;
  }

  list.innerHTML = sorted.map((p, i) => {
    const rank = i + 1;
    const isMe = p.email === currentUser.email;
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const rankLabel = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

    // Badges
    const badges = [];
    if (rank === 1) badges.push('<span class="badge badge-top">👑 #1</span>');
    if (p.streak >= 7) badges.push('<span class="badge badge-fire">🔥 ' + p.streak + 'd</span>');
    if (p.spellingAcc >= 80) badges.push('<span class="badge badge-spell">✍️ ' + p.spellingAcc + '%</span>');
    const daysSince = (Date.now() - (p.updatedAt||0)) / 86400000;
    if (daysSince < 1) badges.push('<span class="badge badge-new">⚡ active</span>');

    const mainVal = currentTab === 'words'    ? (p.wordsKnown||0)
                  : currentTab === 'streak'   ? (p.streak||0)
                  : (p.spellingAcc||0) + '%';

    const active = timeAgo(p.updatedAt || 0);

    return `
      <div class="player-row${isMe ? ' is-me' : ''}" style="animation-delay:${i*0.04}s">
        <div class="row-rank ${rankClass}">${rankLabel}</div>
        <div class="row-player">
          <div class="row-avatar">${getInitials(p.name)}</div>
          <div class="row-info">
            <div class="row-name">${escHtml(p.name)}${isMe ? ' <span style="color:var(--green);font-size:0.72rem">(you)</span>' : ''}</div>
            <div class="row-badges">${badges.join('')}</div>
          </div>
        </div>
        <div class="row-stat highlight">${mainVal}</div>
        <div class="row-stat col-streak">${p.streak||0}🔥</div>
        <div class="row-activity">${active}</div>
      </div>`;
  }).join('');
}

// ── Activity feed ─────────────────────────────────────────────

function renderFeed(items) {
  const feed = document.getElementById('activityFeed');
  if (!items.length) {
    feed.innerHTML = '<div class="state-msg" style="padding:1rem 0">No activity yet — start studying! 📚</div>';
    return;
  }

  feed.innerHTML = items.map((a, i) => {
    const isMe = a.email === currentUser.email;
    const msgs = [
      `reviewed <strong>${a.wordsKnown} word${a.wordsKnown!==1?'s':''}</strong>`,
      `is on a <strong>${a.streak} day streak 🔥</strong>`,
      `studied today 📖`,
    ];
    const msg = a.streak >= 3 ? msgs[1] : msgs[0];
    return `
      <div class="feed-item" style="animation-delay:${i*0.06}s">
        <div class="feed-avatar" style="${isMe ? 'border-color:var(--green);color:var(--green)' : ''}">${getInitials(a.name)}</div>
        <div class="feed-text"><strong>${escHtml(a.name)}</strong> ${msg}</div>
        <div class="feed-time">${timeAgo(a.ts||0)}</div>
      </div>`;
  }).join('');
}

// ── My stats card ─────────────────────────────────────────────
function renderMyStats() {
  const stats = getMyStats();
  const section = document.getElementById('myStatsSection');
  const card    = document.getElementById('myStatsCard');
  section.style.display = '';

  // Find my rank
  const sorted = [...allPlayers].sort((a,b) => (b.wordsKnown||0) - (a.wordsKnown||0));
  const myRank = sorted.findIndex(p => p.email === currentUser.email) + 1;

  card.innerHTML = `
    <div class="my-stat">
      <div class="my-stat-val">${myRank > 0 ? '#' + myRank : '—'}</div>
      <div class="my-stat-label">Rank</div>
    </div>
    <div class="my-stat">
      <div class="my-stat-val">${stats.wordsKnown}</div>
      <div class="my-stat-label">Words known</div>
    </div>
    <div class="my-stat">
      <div class="my-stat-val">${stats.streak}🔥</div>
      <div class="my-stat-label">Day streak</div>
    </div>
    <div class="my-stat">
      <div class="my-stat-val">${stats.spellingAcc}%</div>
      <div class="my-stat-label">Spelling acc.</div>
    </div>
    <div class="my-stat">
      <div class="my-stat-val">${stats.level}</div>
      <div class="my-stat-label">Level</div>
    </div>`;
}

// ── Utils ─────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
