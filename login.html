<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschKarten – Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0c0c0f;
  --surface:  #141418;
  --surface2: #1c1c22;
  --border:   #26262e;
  --border2:  #32323d;
  --text:     #eeeef0;
  --text2:    #8888a0;
  --text3:    #45455a;
  --green:    #69db7c;
  --greend:   #0f3018;
  --red:      #ff6b6b;
  --redd:     #3d1515;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  font-family: 'Bricolage Grotesque', sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

/* ── Background grid ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.35;
  pointer-events: none;
}

/* ── Glow orb ── */
body::after {
  content: '';
  position: fixed;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(105,219,124,0.08) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* ── Card ── */
.card {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 3rem 2.5rem 2.5rem;
  width: 100%;
  max-width: 420px;
  margin: 1rem;
  animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Logo area ── */
.logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 2.2rem;
}

.logo-icon {
  width: 38px;
  height: 38px;
  background: var(--green);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}

.logo-text {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text);
}

.logo-text span {
  color: var(--green);
}

/* ── Headings ── */
.card-title {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 0.35rem;
}

.card-sub {
  font-family: 'Crimson Pro', serif;
  font-size: 1.05rem;
  color: var(--text2);
  font-style: italic;
  margin-bottom: 2rem;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  background: var(--surface2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 1.8rem;
  border: 1px solid var(--border);
}

.tab {
  flex: 1;
  padding: 0.5rem;
  border: none;
  background: none;
  border-radius: 9px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}

.tab.active {
  background: var(--green);
  color: var(--bg);
}

/* ── Form ── */
.field {
  margin-bottom: 1.1rem;
}

label {
  display: block;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 0.45rem;
}

input[type="email"],
input[type="password"],
input[type="text"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 0.75rem 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(105,219,124,0.12);
}

input::placeholder { color: var(--text3); }

/* ── Saved accounts ── */
.saved-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  margin-top: 0.2rem;
}

.saved-accounts {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-bottom: 1.1rem;
}

.saved-account {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.55rem 0.8rem;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
  animation: fadeIn 0.25s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}

.saved-account:hover {
  border-color: var(--green);
  background: var(--greend);
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--greend);
  border: 1.5px solid var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--green);
  flex-shrink: 0;
}

.saved-email {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--text2);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.remove-btn {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  font-size: 0.9rem;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.15s, background 0.15s;
  line-height: 1;
}

.remove-btn:hover { color: var(--red); background: var(--redd); }

/* ── Submit button ── */
.btn-submit {
  width: 100%;
  padding: 0.85rem;
  background: var(--green);
  color: var(--bg);
  border: none;
  border-radius: 12px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: opacity 0.2s, transform 0.15s;
  letter-spacing: -0.01em;
}

.btn-submit:hover { opacity: 0.88; }
.btn-submit:active { transform: scale(0.98); }

/* ── Error / success ── */
.message {
  font-size: 0.82rem;
  border-radius: 10px;
  padding: 0.6rem 0.9rem;
  margin-bottom: 1rem;
  display: none;
  animation: fadeIn 0.2s ease;
}

.message.error { background: var(--redd); color: var(--red); border: 1px solid var(--red); display: block; }
.message.success { background: var(--greend); color: var(--green); border: 1px solid var(--green); display: block; }

/* ── Footer ── */
.card-footer {
  margin-top: 1.5rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 0.8rem;
  color: var(--text3);
}

.card-footer a {
  color: var(--green);
  text-decoration: none;
  font-weight: 600;
}

/* ── Decorative flag pills ── */
.flags {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 1.5rem;
}

.flag-pill {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.2rem 0.55rem;
  border-radius: 20px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.pill-a1 { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
.pill-b1 { background: rgba(105,219,124,0.15); color: #69db7c; border: 1px solid rgba(105,219,124,0.3); }
.pill-c1 { background: rgba(218,119,242,0.15); color: #da77f2; border: 1px solid rgba(218,119,242,0.3); }
</style>
</head>
<body>

<div class="card" id="authCard">

  <div class="logo">
    <div class="logo-icon">🇩🇪</div>
    <div class="logo-text">Deutsch<span>Karten</span></div>
  </div>

  <div class="flags">
    <span class="flag-pill pill-a1">A1</span>
    <span class="flag-pill pill-b1">B1</span>
    <span class="flag-pill pill-c1">C1</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign in</button>
    <button class="tab" onclick="switchTab('register')">Create account</button>
  </div>

  <div id="msgBox" class="message"></div>

  <!-- ── Login form ── -->
  <div id="loginForm">

    <!-- Saved accounts -->
    <div id="savedSection" style="display:none;">
      <div class="saved-label">Saved accounts</div>
      <div class="saved-accounts" id="savedList"></div>
    </div>

    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-submit" onclick="handleLogin()">Sign in →</button>

  </div>

  <!-- ── Register form ── -->
  <div id="registerForm" style="display:none;">

    <div class="field">
      <label for="regName">Display name</label>
      <input type="text" id="regName" placeholder="e.g. Anna" autocomplete="name">
    </div>

    <div class="field">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="at least 6 characters" autocomplete="new-password">
    </div>

    <button class="btn-submit" onclick="handleRegister()">Create account →</button>
  </div>

  <div class="card-footer">
    Your progress is saved locally in your browser 🔒
  </div>
</div>

<script>
// ── Storage helpers ──────────────────────────────────────────
const USERS_KEY = 'dk_users';
const SESSION_KEY = 'dk_session';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch { return {}; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; }
}
function saveSession(email) { localStorage.setItem(SESSION_KEY, JSON.stringify({ email, ts: Date.now() })); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }

// ── Saved accounts (emails list for quick login) ──────────────
const SAVED_KEY = 'dk_saved_emails';
function getSavedEmails() {
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch { return []; }
}
function addSavedEmail(email) {
  const list = getSavedEmails().filter(e => e !== email);
  list.unshift(email);
  localStorage.setItem(SAVED_KEY, JSON.stringify(list.slice(0, 5)));
}
function removeSavedEmail(email) {
  const list = getSavedEmails().filter(e => e !== email);
  localStorage.setItem(SAVED_KEY, JSON.stringify(list));
  renderSaved();
}

// ── Redirect if already signed in ───────────────────────────
(function() {
  const session = getSession();
  if (session) {
    const users = getUsers();
    if (users[session.email]) {
      window.location.href = 'index.html';
    }
  }
})();

// ── Tab switching ────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  showMsg('', '');
}

// ── Message helper ───────────────────────────────────────────
function showMsg(text, type) {
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'message' + (type ? ' ' + type : '');
}

// ── Render saved accounts ────────────────────────────────────
function renderSaved() {
  const emails = getSavedEmails();
  const section = document.getElementById('savedSection');
  const list = document.getElementById('savedList');

  if (emails.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = '';
  list.innerHTML = '';

  emails.forEach((email, i) => {
    const row = document.createElement('div');
    row.className = 'saved-account';
    row.style.animationDelay = (i * 0.05) + 's';

    const initials = email.slice(0, 2).toUpperCase();
    row.innerHTML = `
      <div class="avatar">${initials}</div>
      <div class="saved-email">${email}</div>
      <button class="remove-btn" title="Remove" onclick="event.stopPropagation(); removeSavedEmail('${email}')">✕</button>
    `;
    row.addEventListener('click', () => {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').focus();
    });
    list.appendChild(row);
  });
}

// ── Hash password (simple, client-side) ─────────────────────
async function hashPassword(password) {
  const msgBuffer = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── Register ─────────────────────────────────────────────────
async function handleRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const password = document.getElementById('regPassword').value;

  if (!name) return showMsg('Please enter your name.', 'error');
  if (!email || !email.includes('@')) return showMsg('Please enter a valid email.', 'error');
  if (password.length < 6) return showMsg('Password must be at least 6 characters.', 'error');

  const users = getUsers();
  if (users[email]) return showMsg('An account with this email already exists.', 'error');

  const hash = await hashPassword(password);
  users[email] = { name, email, hash, joined: Date.now() };
  saveUsers(users);
  addSavedEmail(email);
  saveSession(email);

  showMsg('Account created! Redirecting…', 'success');
  setTimeout(() => window.location.href = 'index.html', 900);
}

// ── Login ────────────────────────────────────────────────────
async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;

  if (!email) return showMsg('Please enter your email.', 'error');
  if (!password) return showMsg('Please enter your password.', 'error');

  const users = getUsers();
  const user = users[email];
  if (!user) return showMsg('No account found with this email.', 'error');

  const hash = await hashPassword(password);
  if (hash !== user.hash) return showMsg('Incorrect password.', 'error');

  addSavedEmail(email);
  saveSession(email);

  showMsg('Welcome back, ' + user.name + '! 🎉', 'success');
  setTimeout(() => window.location.href = 'index.html', 700);
}

// ── Enter key support ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginVisible = document.getElementById('loginForm').style.display !== 'none';
    if (loginVisible) handleLogin();
    else handleRegister();
  }
});

// ── Init ─────────────────────────────────────────────────────
renderSaved();

// Pre-fill email if saved accounts exist
const saved = getSavedEmails();
if (saved.length > 0) {
  document.getElementById('loginEmail').value = saved[0];
}
</script>

</body>
</html>
