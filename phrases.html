<title>DeutschKarten – Phrases</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Surfaces ── */
  --bg:   #F4F4F2;
  --s1:   #FFFFFF;
  --s2:   #EBEBE9;
  --s3:   #E2E2E0;
  --s4:   #D8D8D6;

  /* ── Greyscale ── */
  --g1:   #111415;
  --g2:   #454A4B;
  --g3:   #5E6263;
  --g4:   #D3D4D3;

  /* ── Semantic aliases ── */
  --surface:   var(--s1);
  --surface2:  var(--s2);
  --surface3:  var(--s3);
  --border:    var(--g4);
  --border2:   #A3A5A5;
  --text:      var(--g1);
  --text2:     var(--g2);
  --text3:     var(--g3);
  --ink:       var(--g1);
  --ink2:      var(--g2);
  --ink3:      var(--g3);

  /* ── Spacing scale (4px base) ── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ── Typography ── */
  --font-sans:  'Archivo', system-ui, sans-serif;
  --font-serif: 'Archivo', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --text-xs:   0.65rem;   /* 10.4px — labels, badges */
  --text-sm:   0.75rem;   /* 12px   — secondary text */
  --text-base: 0.875rem;  /* 14px   — body */
  --text-md:   1rem;      /* 16px   — UI text */
  --text-lg:   1.25rem;   /* 20px   — card headings */
  --text-xl:   1.5rem;    /* 24px   — section headings */
  --text-2xl:  2rem;      /* 32px   — display */
  --text-3xl:  2.8rem;    /* 44px   — hero */

  /* ── Border radius ── */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 24px;

  /* ── Shadows ── */
  --shadow-sm:  0 1px 2px rgba(17,20,21,0.06);
  --shadow-md:  0 4px 14px rgba(17,20,21,0.08);
  --shadow-lg:  0 12px 32px rgba(17,20,21,0.12);
  --shadow-card: 0 1px 2px rgba(17,20,21,0.05), 0 10px 30px rgba(17,20,21,0.07);

  /* ── Glow (monochrome white) ── */
  --glow-xs:  0 0 0 transparent;
  --glow-sm:  0 0 0 transparent;
  --glow-md:  0 0 0 transparent;

  /* ── Transitions ── */
  --ease:       cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:   cubic-bezier(0, 0, 0.2, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast:     100ms;
  --t-base:     160ms;
  --t-slow:     280ms;

  /* ── Layout ── */
  --topbar-h:   52px;
  --card-max:   600px;
  --page-max:   860px;

  /* ── Keep old names pointing to new tokens (backward compat) ── */
  --surf:    var(--s1);
  --surf2:   var(--s2);
  --surf3:   var(--s3);
  --sf2:     var(--s2);
  --sf3:     var(--s3);
  --bord:    var(--g4);
  --bord2:   #A3A5A5;
  --rule:    var(--g4);
  --rule2:   #A3A5A5;
  --ln2:     #A3A5A5;
  --line:    var(--g4);
  --glow:    var(--glow-sm);
  --glow-sm: 0 0 0 transparent;

  /* ── Activity-specific (keep for derdiedas, old level vars) ── */
  --der:  var(--g1); --derd: var(--s2);
  --die:  var(--g2); --died: var(--s2);
  --das:  var(--g2); --dasd: var(--s2);
  --a1: var(--g1); --a1d: var(--s2); --a1m: rgba(17,20,21,0.04);
  --a2: var(--g1); --a2d: var(--s2); --a2m: rgba(17,20,21,0.04);
  --b1: var(--g1); --b1d: var(--s2); --b1m: rgba(17,20,21,0.04);
  --b2: var(--g1); --b2d: var(--s2); --b2m: rgba(17,20,21,0.04);
  --c1: var(--g1); --c1d: var(--s2); --c1m: rgba(17,20,21,0.04);
  --amber: var(--g1); --amberd: var(--s2);
  --accent: #2F4E56; --accentd: #E3EBEC;
  --lvl: var(--g1); --lvld: var(--s2); --lvlm: rgba(17,20,21,0.04);
  --green:   var(--g1); --greend: var(--s2);
  --red:     var(--g2); --redd:   var(--s2);
  --gold:    var(--g1); --goldd:  var(--s2);
  --silver:  var(--g2);
  --bronze:  var(--g3);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--g1);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font-family: inherit; }

/* ── Focus ring — accessibility ── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--g4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--g3); }

/* ── Topbar — shared across all pages ── */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--g4);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--g1);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  transition: opacity var(--t-base) var(--ease);
  user-select: none;
}
.logo:hover {text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;}
.logo-slash {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--g3);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ── Back link / nav buttons — universal ── */
.back-link, .nav-btn, .back-btn {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  color: var(--g3);
  text-decoration: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--g4);
  border-radius: var(--r-xs);
  background: transparent;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.back-link:hover, .nav-btn:hover, .back-btn:hover {
  color: var(--g1);
  border-color: var(--g3);
  box-shadow: var(--glow-sm);
}
:is(.back-link, .nav-btn, .back-btn):focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
}

/* ── Primary button ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.6rem;
  background: var(--g1);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 800;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: opacity var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease),
              transform var(--t-fast) var(--ease);
}
.btn-primary:hover {background: #2F4E56;}
.btn-primary:active { transform: scale(0.97); opacity: 0.8; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Ghost button ── */
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.4rem;
  background: transparent;
  color: var(--g2);
  border: 1px solid var(--g4);
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 700;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.btn-ghost:hover { color: var(--g1); border-color: var(--g3); box-shadow: var(--glow-sm); }
.btn-ghost:active { transform: scale(0.97); }
.btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Card surface ── */
.card {
  background: var(--s1);
  border: 1px solid var(--g4);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: none;
  pointer-events: none;
}

/* ── Input ── */
.input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.55rem 0.85rem;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--g1);
  outline: none;
  transition: border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.input:focus {
  border-color: var(--g3);
  box-shadow: 0 0 0 3px rgba(17,20,21,0.04);
}
.input::placeholder { color: var(--g3); }
.input:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Progress bar ── */
.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--g4);
  overflow: hidden;
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  background: var(--g1);
  border-radius: 1px;
  transition: width 0.4s var(--ease);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--sp-8);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.45rem 1rem;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.03em;
  color: var(--g2);
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  transition: opacity var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Utility ── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}


.card-scene:hover .card-face,
.quiz-card:hover {
  border-color: var(--g3);
  box-shadow: 0 0 30px rgba(17,20,21,0.05), 0 20px 48px rgba(17,20,21,0.125) !important;
}

.nav-btn, .back-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--ink3);
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid var(--border2);
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.nav-btn:hover, .back-btn:hover {
  color: var(--ink);
  border-color: var(--ink3);
  background: var(--surface2);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:18px; }
body {
  background:var(--bg); font-family:'Archivo',sans-serif;
  color:var(--text); min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image: linear-gradient(var(--bord) 1px,transparent 1px), linear-gradient(90deg,var(--bord) 1px,transparent 1px);
  background-size:48px 48px; opacity:0.15; pointer-events:none; z-index:0; display: none;}
.topbar {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding:0.9rem 1.6rem; border-bottom:1px solid var(--bord);
  background: var(--bg);
  position:sticky; top:0; z-index:100;
}
.logo { font-size:1.25rem; font-weight:800; letter-spacing:-0.04em; display:flex; align-items:center; gap:0.5rem; }
.top-right { display:flex; align-items:center; gap:0.5rem; justify-self:end; }



/* Controls */
.controls {
  display:flex; gap:0.5rem; padding:0.9rem 1.6rem;
  border-bottom:1px solid var(--bord); background:var(--surf);
  flex-wrap:wrap; align-items:center; position:relative; z-index:1;
}
.cat-btn {
  padding:0.3rem 0.8rem; border-radius: 6px; border:1px solid var(--bord2);
  background:var(--surf2); font-family:'Archivo',sans-serif;
  font-size:0.85rem; font-weight:700; color:var(--text2); cursor:pointer; transition:all 0.2s;
}
.cat-btn.active { background:var(--surf); border-color:var(--text2); color:var(--text); }
.mode-toggle {
  margin-left:auto; display:flex; gap:0.4rem;
}
.mode-btn {
  padding:0.3rem 0.8rem; border-radius: 6px; border:1px solid var(--bord2);
  background:var(--surf2); font-family:'JetBrains Mono',monospace;
  font-size:0.72rem; font-weight:700; color:var(--text3); cursor:pointer; transition:all 0.2s;
}
.mode-btn.active { border-color:var(--green); color:var(--green); }

/* Browse grid */
.browse-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr));
  gap:1rem; padding:1.5rem 1.6rem; position:relative; z-index:1;
}
.phrase-card {
  background:var(--surf); border:1px solid var(--bord2); border-radius:18px;
  padding:1.2rem 1.4rem; cursor:pointer; transition:all 0.2s;
  position:relative; overflow:hidden;
}
.phrase-card:hover { border-color:var(--bord); transform:translateY(-2px); box-shadow:0 8px 24px rgba(17,20,21,0.075); }
.phrase-cat {
  font-family:'JetBrains Mono',monospace; font-size:0.65rem; font-weight:700;
  text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.6rem;
  display:inline-flex; align-items:center; gap:0.3rem;
}
.phrase-de {
  font-size:1rem; font-weight:700; letter-spacing:-0.01em; margin-bottom:0.4rem; line-height:1.3;
}
.phrase-en {
  font-family: var(--font-sans);  color:var(--text2); font-size:0.9rem; margin-bottom:0.6rem;
}
.phrase-tip {
  font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--text3);
  border-top:1px solid var(--bord); padding-top:0.6rem; margin-top:0.2rem;
  display:none;
}
.phrase-card.expanded .phrase-tip { display:block; }
.phrase-card.expanded { border-color:var(--green); }

/* Quiz mode */
.quiz-screen {
  display:none; flex-direction:column; align-items:center;
  padding:2rem 1rem; gap:1.2rem; position:relative; z-index:1;
}
.quiz-screen.show { display:flex; }
.quiz-progress {
  max-width:560px; width:100%;
  font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text3);
  display:flex; justify-content:space-between; align-items:center;
}
.quiz-prog-track {
  flex:1; height:4px; background:var(--surf2); border-radius:10px; overflow:hidden;
  border:1px solid var(--bord); margin:0 0.8rem;
}
.quiz-prog-fill { height:100%; background:var(--green); border-radius:10px; transition:width 0.4s ease; }
.quiz-card {
  max-width:560px; width:100%; background:var(--surf); border:1px solid var(--bord2);
  border-radius: 6px; padding:2rem; text-align:center;
  animation:cardIn 0.3s cubic-bezier(0.16,1,0.3,1);
}
@keyframes cardIn { from{opacity:0;transform:translateY(10px) scale(0.97)} to{opacity:1;transform:none} }
.quiz-prompt { font-family: var(--font-sans);  font-size:0.95rem; color:var(--text3); margin-bottom:1rem; }
.quiz-phrase { font-size:1.4rem; font-weight:800; letter-spacing:-0.02em; line-height:1.3; margin-bottom:1.5rem; }
.quiz-options { display:flex; flex-direction:column; gap:0.6rem; }
.quiz-opt {
  padding:0.9rem 1.2rem; background:var(--surf2); border:1px solid var(--bord2);
  border-radius:14px; font-family: var(--font-sans); 
  font-size:1rem; color:var(--text2); cursor:pointer; transition:all 0.2s; text-align:left;
}
.quiz-opt:hover { border-color:var(--text2); color:var(--text); }
.quiz-opt.correct { background:var(--greend); border-color:var(--green); color:var(--green); }
.quiz-opt.wrong   { background:var(--s2); border-color:var(--red); color:var(--red); }
.quiz-opt.show-correct { background: var(--s1); border-color:var(--green); color:var(--green); opacity:0.6; }
.quiz-opt:disabled { cursor:default; }
.quiz-result-msg { font-family:'JetBrains Mono',monospace; font-size:0.82rem; min-height:1.2rem; }
.quiz-result-msg.correct { color:var(--green); }
.quiz-result-msg.wrong   { color:var(--red); }
.quiz-tip { font-size:0.78rem; color:var(--text3); font-family:'JetBrains Mono',monospace; }
.quiz-next-btn {
  max-width:560px; width:100%; padding:0.85rem; background:var(--green); color:var(--bg);
  border:none; border-radius:14px; font-family:'Archivo',sans-serif;
  font-size:1rem; font-weight:800; cursor:pointer; transition:opacity 0.2s; display:none;
}
.quiz-next-btn.show { display:block; }
.quiz-next-btn:hover {background: #2F4E56;}

/* Complete */
.quiz-complete {
  display:none; flex-direction:column; align-items:center; gap:1rem;
  text-align:center; max-width:400px; padding:2rem;
  animation:cardIn 0.35s ease;
}
.quiz-complete.show { display:flex; }

/* Cat colors */
.cat-Greetings { color:var(--g2); }
.cat-Idioms { color:var(--g2); }
.cat-Practical { color:var(--g2); }
.cat-Emotions { color:var(--g2); }
.cat-Work { color:var(--g2); }
.cat-Food { color:var(--g1); }
.cat-Time { color:var(--g2); }

@media(max-width:600px) {
  .browse-grid { grid-template-columns:1fr; padding:1rem; }
  .topbar { padding:0.8rem 1rem; }
  .controls { padding:0.7rem 1rem; }
  .quiz-phrase { font-size:1.1rem; }
}

/* Emoji slots are left in the markup for the scripts but not shown */
.cat-chip .icon, .complete-emoji, .result-emoji, #qCompleteEmoji, #levelRankIcon, .podium-crown, .trophy, .chat-header-icon { display: none !important; }

/* Shared activity top bar: same on every activity page */
.dk-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.dk-nav-brand {
  display: flex; align-items: baseline; gap: 8px; min-width: 0;
  font-family: 'Archivo', system-ui, sans-serif;
  font-size: 1rem; font-weight: 800; letter-spacing: -0.04em;
  color: #111415; text-decoration: none; white-space: nowrap;
}
.dk-nav-brand:hover .dk-nav-name { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.dk-nav-page {
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 400;
  letter-spacing: 0.02em; color: #454A4B; overflow: hidden; text-overflow: ellipsis;
}
.dk-nav-home {
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 500;
  color: #111415; text-decoration: none; white-space: nowrap;
  padding: 6px 14px; border: 1px solid #A3A5A5; border-radius: 6px; background: #EBEBE9;
}
.dk-nav-home:hover { background: #E2E2E0; border-color: #5E6263; }
@media (max-width: 500px) {
  .dk-nav { padding: 0 16px !important; }
  .dk-nav-name { display: none; }
  .dk-nav-page { font-size: 0.8rem; color: #111415; }
}

/* Editorial brand in the activity top bar */
.dk-nav-brand { align-items: center; gap: 14px; }
.dk-nav-name { font-size: 0.72rem; font-weight: 800; line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase; color: #111415; }
.dk-nav-brand:hover .dk-nav-name { text-decoration: none; color: #2F4E56; }
.dk-nav-page { font-family: 'Archivo', sans-serif; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; color: #111415; }
.dk-nav-home:hover { background: #2F4E56; border-color: #2F4E56; color: #fff; }
@media (max-width: 500px) { .dk-nav-page { font-size: 0.95rem; color: #111415; } }
</style>

<body>

<header class="topbar dk-nav">
  <a href="app.html" class="dk-nav-brand"><span class="dk-nav-name">Deutsch<br>Karten</span><span class="dk-nav-page">Phrases</span></a>
  <a href="app.html" class="dk-nav-home">← Home</a>
</header>

<div class="controls" id="controls">
  <button class="cat-btn active" onclick="filterCat('all',this)">All</button>
  <button class="cat-btn" onclick="filterCat('Greetings',this)">Greetings</button>
  <button class="cat-btn" onclick="filterCat('Idioms',this)">Idioms</button>
  <button class="cat-btn" onclick="filterCat('Practical',this)">Practical</button>
  <button class="cat-btn" onclick="filterCat('Emotions',this)">Emotions</button>
  <button class="cat-btn" onclick="filterCat('Work & School',this)">Work</button>
  <button class="cat-btn" onclick="filterCat('Food & Drink',this)">Food</button>
  <button class="cat-btn" onclick="filterCat('Time & Plans',this)">Time</button>
  <div class="mode-toggle">
    <button class="mode-btn active" id="modeBrowse" onclick="setMode('browse')">Browse</button>
    <button class="mode-btn" id="modeQuiz" onclick="setMode('quiz')">Quiz me</button>
  </div>
</div>

<!-- Browse mode -->
<div class="browse-grid" id="browseGrid"></div>

<!-- Quiz mode -->
<div class="quiz-screen" id="quizScreen">
  <div class="quiz-progress">
    <span id="qNum">1/10</span>
    <div class="quiz-prog-track"><div class="quiz-prog-fill" id="qProgFill" style="width:0%"></div></div>
    <span id="qScore" style="color:var(--green)">0 ✓</span>
  </div>
  <div class="quiz-card" id="quizCard">
    <div class="quiz-prompt" id="qPrompt">What does this mean in English?</div>
    <div class="quiz-phrase" id="qPhrase"></div>
    <div class="quiz-options" id="qOptions"></div>
    <div class="quiz-result-msg" id="qMsg"></div>
    <div class="quiz-tip" id="qTip"></div>
  </div>
  <button class="quiz-next-btn" id="qNextBtn" onclick="nextQuestion()">Next →</button>
  <div class="quiz-complete" id="quizComplete">
    <div style="font-size:3rem;" id="qCompleteEmoji"></div>
    <div style="font-size:1.8rem;font-weight:800;" id="qCompleteTitle">Fertig!</div>
    <div style="font-family:'Archivo',sans-serif;color:var(--text2);" id="qCompleteSub"></div>
    <div style="display:flex;gap:1.5rem;margin-top:0.5rem;">
      <div style="text-align:center;"><div style="font-size:2rem;font-weight:800;color:var(--green);" id="qFinalScore">0</div><div style="font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--text3);">CORRECT</div></div>
      <div style="text-align:center;"><div style="font-size:2rem;font-weight:800;color:var(--gold);" id="qFinalAcc">0%</div><div style="font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--text3);">ACCURACY</div></div>
    </div>
    <button onclick="startQuiz()" style="padding:0.8rem 2rem;background:var(--green);color:var(--bg);border:none;border-radius:14px;font-family:'Archivo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;">Play again</button>
    <button onclick="setMode('browse')" style="background:none;border:none;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:0.75rem;cursor:pointer;text-decoration:underline;">← Browse phrases</button>
  </div>
</div>

<script>
const PHRASES = [{"de": "Wie geht es Ihnen?", "en": "How are you? (formal)", "cat": "Greetings", "tip": "Use with strangers or authority figures"}, {"de": "Wie geht's?", "en": "How's it going?", "cat": "Greetings", "tip": "Casual version \u2014 use with friends"}, {"de": "Guten Appetit!", "en": "Enjoy your meal!", "cat": "Greetings", "tip": "Always say this before eating together"}, {"de": "Herzlich willkommen!", "en": "Warm welcome / Welcome!", "cat": "Greetings", "tip": "Herzlich = warmly, from the heart"}, {"de": "Bis sp\u00e4ter!", "en": "See you later!", "cat": "Greetings", "tip": "Bis = until, sp\u00e4ter = later"}, {"de": "Sch\u00f6nen Tag noch!", "en": "Have a nice day!", "cat": "Greetings", "tip": "Said when parting during the day"}, {"de": "Sch\u00f6nes Wochenende!", "en": "Have a nice weekend!", "cat": "Greetings", "tip": "Said on Fridays or before the weekend"}, {"de": "Das ist nicht mein Bier.", "en": "That's not my problem / not my cup of tea.", "cat": "Idioms", "tip": "Literally: 'That's not my beer' \u2014 Germans love this one!"}, {"de": "Ich dr\u00fccke dir die Daumen.", "en": "I'm keeping my fingers crossed for you.", "cat": "Idioms", "tip": "Literally: 'I press my thumbs for you' \u2014 Germans press thumbs, not cross fingers!"}, {"de": "Das geht mir auf die Nerven.", "en": "That gets on my nerves.", "cat": "Idioms", "tip": "Very common expression of annoyance"}, {"de": "Jetzt mal Butter bei die Fische.", "en": "Get to the point! / Cut to the chase.", "cat": "Idioms", "tip": "Literally: 'Now put butter with the fish' \u2014 Northern German saying"}, {"de": "Das ist mir Wurst.", "en": "I don't care. / It's all the same to me.", "cat": "Idioms", "tip": "Literally: 'That is sausage to me' \u2014 uniquely German!"}, {"de": "Ich verstehe nur Bahnhof.", "en": "I don't understand a thing.", "cat": "Idioms", "tip": "Literally: 'I only understand train station'"}, {"de": "Das ist nicht das Gelbe vom Ei.", "en": "That's not up to scratch / not ideal.", "cat": "Idioms", "tip": "Literally: 'That's not the yellow of the egg'"}, {"de": "Alles hat ein Ende, nur die Wurst hat zwei.", "en": "Everything comes to an end.", "cat": "Idioms", "tip": "Literally: 'Everything has one end, only the sausage has two' \u2014 typical German humour!"}, {"de": "Ich glaube, mein Schwein pfeift.", "en": "I can't believe it!", "cat": "Idioms", "tip": "Literally: 'I think my pig is whistling'"}, {"de": "Da liegt der Hund begraben.", "en": "That's the crux of the matter.", "cat": "Idioms", "tip": "Literally: 'That's where the dog is buried'"}, {"de": "Tomaten auf den Augen haben.", "en": "To be oblivious / not see what's obvious.", "cat": "Idioms", "tip": "Literally: 'To have tomatoes on your eyes'"}, {"de": "Entschuldigung, wo ist die Toilette?", "en": "Excuse me, where is the toilet?", "cat": "Practical", "tip": "Essential phrase for any trip to Germany"}, {"de": "K\u00f6nnten Sie das bitte wiederholen?", "en": "Could you please repeat that?", "cat": "Practical", "tip": "Polite way to ask someone to repeat themselves"}, {"de": "Ich h\u00e4tte gerne...", "en": "I would like...", "cat": "Practical", "tip": "Polite way to order food or request something"}, {"de": "Die Rechnung bitte.", "en": "The bill / check, please.", "cat": "Practical", "tip": "Essential in restaurants \u2014 waiters won't bring it automatically!"}, {"de": "Wie viel kostet das?", "en": "How much does this cost?", "cat": "Practical", "tip": "Shopping essential"}, {"de": "Das ist zu teuer.", "en": "That is too expensive.", "cat": "Practical", "tip": "Useful for markets and bargaining"}, {"de": "K\u00f6nnen Sie mir helfen?", "en": "Can you help me?", "cat": "Practical", "tip": "General request for help"}, {"de": "Ich bin verloren.", "en": "I am lost.", "cat": "Practical", "tip": "When navigation fails you"}, {"de": "Ich spreche kein Deutsch.", "en": "I don't speak German.", "cat": "Practical", "tip": "Ironic but useful when you're stuck!"}, {"de": "Sprechen Sie Englisch?", "en": "Do you speak English?", "cat": "Practical", "tip": "Most Germans do, but always ask politely"}, {"de": "Das freut mich sehr!", "en": "I'm very pleased about that!", "cat": "Emotions", "tip": "Freuen = to be pleased/glad"}, {"de": "Das tut mir leid.", "en": "I'm sorry about that.", "cat": "Emotions", "tip": "Leid tun = to be sorry \u2014 more sincere than 'Entschuldigung'"}, {"de": "Ich bin total ersch\u00f6pft.", "en": "I'm completely exhausted.", "cat": "Emotions", "tip": "Ersch\u00f6pft = exhausted"}, {"de": "Das macht mir Angst.", "en": "That scares me / makes me anxious.", "cat": "Emotions", "tip": "Angst = fear \u2014 yes, Germans exported this word to English!"}, {"de": "Mir ist das egal.", "en": "I don't care / It doesn't matter to me.", "cat": "Emotions", "tip": "Common expression of indifference"}, {"de": "K\u00f6nnen wir das besprechen?", "en": "Can we discuss this?", "cat": "Work & School", "tip": "Besprechen = to discuss"}, {"de": "Das ist ein Missverst\u00e4ndnis.", "en": "That is a misunderstanding.", "cat": "Work & School", "tip": "Missverst\u00e4ndnis = misunderstanding"}, {"de": "Ich bin damit einverstanden.", "en": "I agree with that.", "cat": "Work & School", "tip": "Einverstanden = in agreement"}, {"de": "Wann ist die Deadline?", "en": "When is the deadline?", "cat": "Work & School", "tip": "Germans use 'Deadline' from English!"}, {"de": "Ich bin im Homeoffice.", "en": "I'm working from home.", "cat": "Work & School", "tip": "Homeoffice is widely used in Germany since 2020"}, {"de": "Ich bin satt.", "en": "I'm full / I've had enough to eat.", "cat": "Food & Drink", "tip": "Don't say 'Ich bin voll' \u2014 that means 'I'm drunk'!"}, {"de": "Das schmeckt k\u00f6stlich!", "en": "That tastes delicious!", "cat": "Food & Drink", "tip": "K\u00f6stlich = delicious, exquisite"}, {"de": "Ein Bier bitte.", "en": "One beer please.", "cat": "Food & Drink", "tip": "Probably the most useful phrase in Germany"}, {"de": "Ich bin Vegetarier/Vegetarierin.", "en": "I am vegetarian.", "cat": "Food & Drink", "tip": "-er for male, -erin for female"}, {"de": "Auf n\u00fcchternen Magen.", "en": "On an empty stomach.", "cat": "Food & Drink", "tip": "N\u00fcchtern = sober/empty (stomach)"}, {"de": "Wann treffen wir uns?", "en": "When shall we meet?", "cat": "Time & Plans", "tip": "Sich treffen = to meet each other"}, {"de": "Ich bin gleich da.", "en": "I'll be right there.", "cat": "Time & Plans", "tip": "Gleich = immediately, in a moment"}, {"de": "Das passt mir gut.", "en": "That suits me well / That works for me.", "cat": "Time & Plans", "tip": "Passen = to suit/fit"}, {"de": "Ich habe keine Zeit.", "en": "I don't have time.", "cat": "Time & Plans", "tip": "Simple but essential"}, {"de": "In der Zwischenzeit...", "en": "In the meantime...", "cat": "Time & Plans", "tip": "Zwischenzeit = intermediate time"}];

// ── Cat colors ────────────────────────────────────────────────────
const CAT_COLORS = {
  'Greetings':   'var(--g1)',
  'Idioms':      'var(--g2)',
  'Practical':   'var(--g2)',
  'Emotions':    'var(--g2)',
  'Work & School':'var(--g2)',
  'Food & Drink':'#ffd43b',
  'Time & Plans':'var(--g2)',
};

// ── State ─────────────────────────────────────────────────────────
let currentCat = 'all';
let currentMode = 'browse';
let quizDeck = [], quizIdx = 0, quizScore = 0, quizAnswered = false;

// ── Browse ────────────────────────────────────────────────────────
function renderBrowse() {
  const grid = document.getElementById('browseGrid');
  const filtered = currentCat === 'all' ? PHRASES : PHRASES.filter(p => p.cat === currentCat);
  const color = CAT_COLORS[currentCat] || 'var(--text3)';

  grid.innerHTML = filtered.map((p, i) => `
    <div class="phrase-card" onclick="this.classList.toggle('expanded')" id="pc-${i}">
      <div class="phrase-cat" style="color:${CAT_COLORS[p.cat]||'var(--text3)'}">
        ${p.cat}
      </div>
      <div class="phrase-de">${p.de}</div>
      <div class="phrase-en">${p.en}</div>
      <div class="phrase-tip">${p.tip}</div>
    </div>
  `).join('');
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBrowse();
}

// ── Mode ──────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeBrowse').classList.toggle('active', mode==='browse');
  document.getElementById('modeQuiz').classList.toggle('active', mode==='quiz');
  document.getElementById('browseGrid').style.display = mode==='browse' ? '' : 'none';
  document.getElementById('quizScreen').classList.toggle('show', mode==='quiz');
  if (mode === 'quiz') startQuiz();
}

// ── Quiz ──────────────────────────────────────────────────────────
function startQuiz() {
  const pool = currentCat === 'all' ? PHRASES : PHRASES.filter(p=>p.cat===currentCat);
  quizDeck = [...pool].sort(()=>Math.random()-0.5).slice(0, Math.min(10, pool.length));
  quizIdx = 0; quizScore = 0; quizAnswered = false;

  document.getElementById('quizComplete').classList.remove('show');
  document.getElementById('quizCard').style.display = '';
  document.getElementById('qNextBtn').classList.remove('show');
  showQuestion();
}

function showQuestion() {
  if (quizIdx >= quizDeck.length) { showQuizComplete(); return; }
  const phrase = quizDeck[quizIdx];
  quizAnswered = false;

  const pct = (quizIdx / quizDeck.length) * 100;
  document.getElementById('qProgFill').style.width = pct + '%';
  document.getElementById('qNum').textContent = `${quizIdx+1}/${quizDeck.length}`;
  document.getElementById('qScore').textContent = quizScore + ' ✓';
  document.getElementById('qPhrase').textContent = phrase.de;
  document.getElementById('qPrompt').textContent = 'What does this mean in English?';
  document.getElementById('qMsg').textContent = '';
  document.getElementById('qMsg').className = 'quiz-result-msg';
  document.getElementById('qTip').textContent = '';
  document.getElementById('qNextBtn').classList.remove('show');
  document.getElementById('quizCard').style.animation = 'none';
  setTimeout(()=>document.getElementById('quizCard').style.animation='',10);

  // Build 4 options including correct one
  const others = PHRASES.filter(p=>p.en !== phrase.en).sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [...others, phrase].sort(()=>Math.random()-0.5);

  document.getElementById('qOptions').innerHTML = opts.map(o => `
    <button class="quiz-opt" onclick="answerQuiz('${o.en.replace(/'/g,"&#39;")}', '${phrase.en.replace(/'/g,"&#39;")}', this)">
      ${o.en}
    </button>
  `).join('');
}

function answerQuiz(chosen, correct, btn) {
  if (quizAnswered) return;
  quizAnswered = true;
  const isCorrect = chosen === correct;
  if (isCorrect) quizScore++;

  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add(isCorrect && b===btn ? 'correct' : 'show-correct');
    else if (b === btn) b.classList.add('wrong');
  });

  const msg = document.getElementById('qMsg');
  msg.textContent = isCorrect ? '✓ Correct!' : `✗ The answer was: "${correct}"`;
  msg.className = 'quiz-result-msg ' + (isCorrect ? 'correct' : 'wrong');

  const phrase = quizDeck[quizIdx];
  document.getElementById('qTip').textContent = phrase.tip ? `${phrase.tip}` : '';
  document.getElementById('qNextBtn').classList.add('show');
}

function nextQuestion() {
  quizIdx++;
  showQuestion();
}

function showQuizComplete() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('qNextBtn').classList.remove('show');
  const acc = Math.round((quizScore/quizDeck.length)*100);
  let emoji='', title='Keep going!';
  if (acc>=90){emoji='';title='Ausgezeichnet!';}
  else if (acc>=70){emoji='';title='Sehr gut!';}
  else if (acc>=50){emoji='';title='Gut gemacht!';}
  document.getElementById('qCompleteEmoji').textContent = emoji;
  document.getElementById('qCompleteTitle').textContent = title;
  document.getElementById('qFinalScore').textContent = `${quizScore}/${quizDeck.length}`;
  document.getElementById('qFinalAcc').textContent = acc+'%';
  document.getElementById('qProgFill').style.width = '100%';
  document.getElementById('quizComplete').classList.add('show');
}

// ── Init ──────────────────────────────────────────────────────────
renderBrowse();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[SW] Registered:', reg.scope))
      .catch(err => console.warn('[SW] Registration failed:', err));
  });
}
</script>
