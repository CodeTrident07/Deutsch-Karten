<title>DeutschKarten – Spelling</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0c0c0f;
  --surface:  #141418;
  --surface2: #1c1c22;
  --border:   #26262e;
  --border2:  #32323d;
  --text:     #eeeef0;
  --text2:    #8888a0;
  --text3:    #45455a;
  --green:    #69db7c;
  --greend:   #0f3018;
  --red:      #ff6b6b;
  --redd:     #3d1515;
  --orange:   #ffa94d;
  --oranged:  #3d2610;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body {
  background: var(--bg);
  font-family: 'Bricolage Grotesque', sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* grid bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.2;
  pointer-events: none;
  z-index: 0;
}

/* ── Topbar ── */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 1rem 1.8rem;
  border-bottom: 1px solid var(--border);
  background: rgba(20,20,24,0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.04em; }
.logo span { color: var(--green); }
.logo small { font-size: 0.65rem; font-weight: 500; color: var(--text3); margin-left: 0.4rem; font-family: 'JetBrains Mono', monospace; }
.top-center { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text3); text-align: center; }
.top-right { display: flex; align-items: center; gap: 0.6rem; justify-self: end; }
.back-btn {
  display: flex; align-items: center; gap: 0.4rem;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px; padding: 0.3rem 0.8rem;
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  color: var(--text); text-decoration: none; transition: all 0.2s; font-weight: 600;
}
.back-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--green); color: var(--green); }

/* ── Controls ── */
.controls {
  display: flex;
  gap: 0.6rem;
  padding: 0.9rem 1.8rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-wrap: wrap;
  align-items: center;
  position: relative;
  z-index: 1;
}
.level-btn {
  padding: 0.35rem 0.9rem;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.88rem; font-weight: 700;
  color: var(--text2); cursor: pointer; transition: all 0.2s;
}
.level-btn.active { background: var(--green); color: var(--bg); border-color: var(--green); }
.divider { width: 1px; height: 24px; background: var(--border2); margin: 0 0.2rem; }
.mode-btn {
  padding: 0.35rem 0.9rem;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.88rem; font-weight: 700;
  color: var(--text2); cursor: pointer; transition: all 0.2s;
}
.mode-btn.active { background: var(--surface); color: var(--text); border-color: var(--text2); }
.score-pill {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  display: flex; gap: 0.8rem;
}
.score-c { color: var(--green); font-weight: 700; }
.score-w { color: var(--red); font-weight: 700; }

/* ── Main arena ── */
.arena {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  position: relative;
  z-index: 1;
}

.prompt-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 2.5rem 3rem;
  text-align: center;
  max-width: 560px;
  width: 100%;
  margin-bottom: 1.8rem;
  animation: cardIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.prompt-level-tag {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; font-weight: 700;
  padding: 0.2rem 0.6rem; border-radius: 20px;
  margin-bottom: 1.2rem;
  border: 1px solid var(--border2);
  color: var(--text3);
}

.prompt-english {
  font-family: 'Crimson Pro', serif;
  font-size: 2.2rem;
  font-style: italic;
  color: var(--text2);
  margin-bottom: 0.4rem;
  line-height: 1.2;
}
.prompt-hint {
  font-size: 0.85rem;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 1.5rem;
}

/* letter blanks (show mode) */
.blanks {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: center;
  margin-bottom: 0.5rem;
}
.blank {
  width: 32px; height: 40px;
  border-bottom: 2px solid var(--border2);
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem; font-weight: 700;
  color: var(--text);
  transition: border-color 0.2s;
}
.blank.space { border-bottom-color: transparent; width: 16px; }
.blank.revealed { border-bottom-color: var(--green); color: var(--green); }

/* Input area */
.input-area {
  max-width: 560px; width: 100%;
  display: flex; flex-direction: column; gap: 0.8rem;
}

.spelling-input-wrap {
  position: relative;
}

.spelling-input {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: 16px;
  padding: 1rem 1.2rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.45rem;
  font-weight: 600;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  text-align: center;
  letter-spacing: 0.05em;
}
.spelling-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(105,219,124,0.1); }
.spelling-input.correct { border-color: var(--green); background: var(--greend); color: var(--green); }
.spelling-input.wrong   { border-color: var(--red);   background: var(--redd);   color: var(--red);   animation: shake 0.35s ease; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-8px); }
  60%      { transform: translateX(8px); }
}

.input-hint {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: var(--text3);
}

.btn-row { display: flex; gap: 0.6rem; }
.btn-check {
  flex: 1;
  padding: 0.85rem;
  background: var(--green);
  color: var(--bg);
  border: none; border-radius: 14px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1rem; font-weight: 800;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
}
.btn-check:hover { opacity: 0.88; }
.btn-check:active { transform: scale(0.97); }
.btn-skip {
  padding: 0.85rem 1.2rem;
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border2); border-radius: 14px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.btn-skip:hover { border-color: var(--text2); color: var(--text); }

/* Result banner */
.result-banner {
  display: none;
  align-items: center;
  gap: 0.6rem;
  padding: 0.75rem 1.2rem;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  animation: cardIn 0.25s ease;
}
.result-banner.correct { display: flex; background: var(--greend); color: var(--green); border: 1px solid var(--green); }
.result-banner.wrong   { display: flex; background: var(--redd);   color: var(--red);   border: 1px solid var(--red);   }
.result-answer { font-family: 'JetBrains Mono', monospace; }

/* Stats panel */
.stats-bar {
  display: flex; gap: 1.5rem;
  padding: 0.6rem 1.8rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; color: var(--text3);
  justify-content: center;
}
.stat-item { display: flex; gap: 0.4rem; }
.stat-val { color: var(--text2); font-weight: 700; }

/* German special chars */
.char-btns {
  display: flex; flex-wrap: wrap; gap: 0.35rem;
  justify-content: center; margin-bottom: 0.3rem;
}
.char-btn {
  width: 38px; height: 38px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem; color: var(--text2);
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.char-btn:hover { border-color: var(--green); color: var(--green); }

/* session complete */
.complete-screen {
  display: none;
  flex-direction: column; align-items: center;
  text-align: center; gap: 1rem;
  padding: 2rem;
}
.complete-screen.show { display: flex; }
.complete-emoji { font-size: 3.5rem; animation: bounce 0.6s ease; }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
.complete-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }
.complete-sub { font-family: 'Crimson Pro', serif; font-size: 1.2rem; font-style: italic; color: var(--text2); }
.complete-stats { display: flex; gap: 2rem; margin-top: 0.5rem; }
.cstat { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
.cstat-val { font-size: 2rem; font-weight: 800; }
.cstat-label { font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
.btn-restart { margin-top: 0.5rem; padding: 0.8rem 2rem; background: var(--green); color: var(--bg); border: none; border-radius: 14px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
.btn-restart:hover { opacity: 0.88; }

/* contact footer */
.contact-footer {
  position: fixed; bottom: 1rem; left: 1.5rem;
  font-size: 0.7rem; color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none; z-index: 50;
}
.contact-footer span { color: var(--text2); }

@media (max-width: 600px) {
  .topbar { padding: 0.8rem 1rem; }
  .controls { padding: 0.7rem 1rem; }
  .prompt-card { padding: 1.5rem 1.2rem; }
  .prompt-english { font-size: 1.5rem; }
  .spelling-input { font-size: 1.1rem; }
  .stats-bar { padding: 0.6rem 1rem; gap: 0.8rem; }
}
</style>
</head>
<body>

// ── State ─────────────────────────────────────────────────
let currentLevel  = 'A1';
let typeFilter    = 'noun';
let deck          = [];
let idx           = 0;
let correct       = 0;
let wrong         = 0;
let answered      = false;
let hintRevealed  = 0; // number of letters shown as hint

// ── Build deck ────────────────────────────────────────────
function buildDeck() {
  const cats = VOCAB[currentLevel]?.cats || {};
  let all = [];
  for (const cat of Object.values(cats)) {
    for (const card of cat) {
      if (typeFilter === 'all' || card.t === typeFilter) {
        all.push(card);
      }
    }
  }
  // Shuffle
  all = all.sort(() => Math.random() - 0.5);
  deck = all.slice(0, 20); // 20 cards per session
}

// ── Render card ───────────────────────────────────────────
function renderCard() {
  if (idx >= deck.length) { showComplete(); return; }
  const card = deck[idx];
  answered = false;
  hintRevealed = 0;

  // Reset input
  const input = document.getElementById('spellingInput');
  input.value = '';
  input.className = 'spelling-input';
  input.disabled = false;
  input.focus();

  // Hide result
  document.getElementById('resultBanner').className = 'result-banner';

  // Tag
  document.getElementById('promptTag').textContent = currentLevel + ' · ' + (card.t || '');

  // English prompt — strip HTML tags from example
  const en = card.en || '?';
  document.getElementById('promptEnglish').textContent = en;

  // Hint: show article if noun, show first letter otherwise
  const word = card.w.replace(/<[^>]+>/g, '');
  let hint = '';
  if (card.t === 'noun' && card.a && card.a !== 'Pl.') {
    hint = 'Article: ' + card.a;
  } else {
    hint = 'First letter: ' + word[0];
  }
  document.getElementById('promptHint').textContent = hint;

  // Blanks
  renderBlanks(word, 0);

  // Stats
  document.getElementById('statIdx').textContent = idx + 1;
  document.getElementById('statTotal').textContent = deck.length;
  document.getElementById('statLevel').textContent = currentLevel;
  updateStats();

  // Re-animate card
  const pc = document.getElementById('promptCard');
  pc.style.animation = 'none';
  pc.offsetHeight;
  pc.style.animation = '';
}

function renderBlanks(word, revealed) {
  const container = document.getElementById('blanks');
  container.innerHTML = '';
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    const div = document.createElement('div');
    if (ch === ' ') {
      div.className = 'blank space';
    } else {
      div.className = 'blank' + (i < revealed ? ' revealed' : '');
      div.textContent = i < revealed ? ch : '';
    }
    container.appendChild(div);
  }
}

// ── Check answer ──────────────────────────────────────────
function checkAnswer() {
  if (answered) { nextCard(); return; }
  const card = deck[idx];
  const word = card.w.replace(/<[^>]+>/g, '').trim();
  const input = document.getElementById('spellingInput');
  const typed = input.value.trim();

  if (!typed) return;

  // Flexible match: ignore leading article if user included it
  const normalize = s => s.toLowerCase().replace(/^(der|die|das|ein|eine)\s+/i, '').trim();
  const isCorrect = normalize(typed) === normalize(word) || typed.toLowerCase() === word.toLowerCase();

  answered = true;
  const banner = document.getElementById('resultBanner');

  if (isCorrect) {
    correct++;
    input.className = 'spelling-input correct';
    banner.className = 'result-banner correct';
    document.getElementById('resultIcon').textContent = '✓';
    document.getElementById('resultText').innerHTML = 'Correct! <span class="result-answer">' + word + '</span>';
    renderBlanks(word, word.length);
    document.getElementById('btnCheck').textContent = 'Next →';
  } else {
    wrong++;
    input.className = 'spelling-input wrong';
    banner.className = 'result-banner wrong';
    document.getElementById('resultIcon').textContent = '✗';
    document.getElementById('resultText').innerHTML = 'Answer: <span class="result-answer">' + word + '</span>';
    renderBlanks(word, word.length);
    document.getElementById('btnCheck').textContent = 'Next →';
  }

  document.getElementById('scoreC').textContent = correct;
  document.getElementById('scoreW').textContent = wrong;
  updateStats();
}

function nextCard() {
  idx++;
  document.getElementById('btnCheck').textContent = 'Check ↵';
  renderCard();
}

function skipCard() {
  if (!answered) wrong++;
  document.getElementById('scoreW').textContent = wrong;
  updateStats();
  nextCard();
}

function updateStats() {
  const total = correct + wrong;
  const acc = total === 0 ? '—' : Math.round((correct / total) * 100) + '%';
  document.getElementById('statAcc').textContent = acc;
}

// ── Complete ──────────────────────────────────────────────
function showComplete() {
  document.getElementById('promptCard').style.display = 'none';
  document.querySelector('.input-area').style.display = 'none';
  const cs = document.getElementById('completeScreen');
  cs.classList.add('show');
  const total = correct + wrong;
  const acc = total === 0 ? 0 : Math.round((correct / total) * 100);
  document.getElementById('cStatC').textContent = correct;
  document.getElementById('cStatW').textContent = wrong;
  document.getElementById('cStatAcc').textContent = acc + '%';
  document.getElementById('completeSub').textContent = acc >= 80 ? 'Ausgezeichnet! 🌟' : acc >= 50 ? 'Gut gemacht! Keep practising.' : 'Keep at it — jede Übung zählt!';

  // Save best spelling accuracy
  try {
    const s = JSON.parse(localStorage.getItem('dk_session'));
    if (s && s.email) {
      const accKey = 'dk_spell_acc_' + s.email;
      const prev = JSON.parse(localStorage.getItem(accKey) || '{"pct":0}');
      if (acc > (prev.pct || 0)) localStorage.setItem(accKey, JSON.stringify({ pct: acc, ts: Date.now() }));
      publishSpellingStats(s.email, acc);
    }
  } catch {}
}

async function publishSpellingStats(email, acc) {
  try {
    if (!window.storage) return;
    const users = JSON.parse(localStorage.getItem('dk_users') || '{}');
    const user  = users[email];
    if (!user) return;
    const key = 'lb_user_' + email.replace(/[^a-z0-9]/gi,'_');
    let existing = {};
    try { const r = await window.storage.get(key, true); if (r?.value) existing = JSON.parse(r.value); } catch {}
    existing.spellingAcc = Math.max(acc, existing.spellingAcc || 0);
    existing.name = user.name; existing.email = email;
    existing.updatedAt = Date.now(); existing.today = new Date().toISOString().slice(0,10);
    await window.storage.set(key, JSON.stringify(existing), true);
  } catch {}
}

function startSession() {
  correct = 0; wrong = 0; idx = 0; answered = false;
  document.getElementById('scoreC').textContent = 0;
  document.getElementById('scoreW').textContent = 0;
  document.getElementById('promptCard').style.display = '';
  document.querySelector('.input-area').style.display = '';
  document.getElementById('completeScreen').classList.remove('show');
  buildDeck();
  renderCard();
}

// ── Level / type switching ────────────────────────────────
function setLevel(lvl, btn) {
  currentLevel = lvl;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startSession();
}

function setTypeFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startSession();
}

// ── German special chars ──────────────────────────────────
function insertChar(ch) {
  const input = document.getElementById('spellingInput');
  const pos = input.selectionStart;
  input.value = input.value.slice(0, pos) + ch + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = pos + 1;
  input.focus();
}

// ── Keyboard ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
  if (e.key === 'ArrowRight' && answered) { e.preventDefault(); nextCard(); }
    if (e.key === 'ArrowRight' && !answered) { e.preventDefault(); checkAnswer(); }
});

// ── Boot ─────────────────────────────────────────────────────
startSession();
</script>
