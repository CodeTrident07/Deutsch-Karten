<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starke Verben – DeutschKarten</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:  #080808;
  --s1:  #0f0f0f;
  --s2:  #161616;
  --s3:  #1e1e1e;
  --g1:  #f5f5f5;
  --g2:  #888;
  --g3:  #444;
  --g4:  #2e2e2e;
  --glow-sm: 0 0 14px rgba(255,255,255,0.07);
  --glow-md: 0 0 28px rgba(255,255,255,0.1);
  --r1: 4px; --r2: 8px; --r3: 12px; --r4: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  background:var(--bg);
  color:var(--g1);
  font-family:'Bricolage Grotesque',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── TOPBAR ── */
.topbar{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.8rem;border-bottom:1px solid var(--g4);background:var(--bg);
  position:sticky;top:0;z-index:100;flex-shrink:0;
}
.logo{font-size:1.05rem;font-weight:800;letter-spacing:-.05em;color:var(--g1);
  text-decoration:none;transition:opacity .2s}
.logo:hover{opacity:.6}
.logo-slash{font-size:.65rem;font-family:'JetBrains Mono',monospace;color:var(--g3);
  font-weight:400;margin-left:8px}
.back-link{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--g3);
  text-decoration:none;padding:5px 10px;border:1px solid var(--g4);border-radius:var(--r1);
  transition:color .15s,border-color .15s,box-shadow .2s}
.back-link:hover{color:var(--g1);border-color:var(--g3);box-shadow:var(--glow-sm)}

/* ── MAIN ── */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem 4rem;gap:1.2rem}

/* ── MODE SELECTOR ── */
.mode-bar{
  width:100%;max-width:680px;
  display:flex;gap:.35rem;
  background:var(--s1);border:1px solid var(--g4);border-radius:var(--r2);
  padding:.4rem;
}
.mode-btn{
  flex:1;padding:.45rem .5rem;border-radius:var(--r1);border:none;
  background:transparent;font-family:'JetBrains Mono',monospace;
  font-size:.65rem;font-weight:500;letter-spacing:.05em;
  color:var(--g3);cursor:pointer;transition:background .15s,color .15s,box-shadow .2s;
  text-align:center;
}
.mode-btn:hover{color:var(--g2);background:var(--s2)}
.mode-btn.active{background:var(--s2);color:var(--g1);box-shadow:var(--glow-sm)}

/* ── FILTER BAR ── */
.filter-bar{
  width:100%;max-width:680px;
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
}
.filter-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--g3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.search-input{
  flex:1;min-width:160px;background:var(--s1);border:1px solid var(--g4);border-radius:var(--r1);
  padding:.38rem .75rem;font-family:'Bricolage Grotesque',sans-serif;font-size:.82rem;
  color:var(--g1);outline:none;transition:border-color .15s,box-shadow .15s;
}
.search-input::placeholder{color:var(--g3)}
.search-input:focus{border-color:var(--g3);box-shadow:var(--glow-sm)}
.count-pill{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--g3);
  border:1px solid var(--g4);border-radius:var(--r1);padding:2px 7px;white-space:nowrap}

/* ── PROGRESS ── */
.progress-area{width:100%;max-width:680px;display:flex;flex-direction:column;gap:.4rem}
.progress-meta{display:flex;justify-content:space-between;align-items:center}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:.63rem;color:var(--g3)}
.progress-label strong{color:var(--g2)}
.score-row{font-family:'JetBrains Mono',monospace;font-size:.63rem;display:flex;gap:1rem}
.sc-correct{color:var(--g2)}
.sc-wrong{color:var(--g3)}
.progress-bar{width:100%;height:2px;background:var(--g4);overflow:hidden}
.progress-fill{height:100%;background:var(--g1);transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── FLASH CARD ── */
.card-wrap{width:100%;max-width:680px}
.flash-card{
  background:var(--s1);border:1px solid var(--g4);border-radius:var(--r4);
  padding:2.2rem 2.5rem 2rem;position:relative;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  transition:border-color .25s,box-shadow .3s;
  cursor:pointer;user-select:none;
}
.flash-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  border-radius:var(--r4) var(--r4) 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
}
.flash-card:hover{border-color:var(--g3);box-shadow:0 0 30px rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.55)}

.card-eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--g3);margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.5rem;
}
.card-eyebrow-dot{width:4px;height:4px;border-radius:50%;background:var(--g3);flex-shrink:0}

/* The German word — huge */
.card-infinitiv{
  font-size:clamp(2rem,7vw,3.5rem);font-weight:800;letter-spacing:-.05em;
  color:var(--g1);line-height:1;margin-bottom:.5rem;
}
.card-meaning{
  font-family:'DM Serif Display',serif;font-style:italic;
  font-size:1rem;color:var(--g2);margin-bottom:2rem;
}
.card-flip-hint{
  position:absolute;bottom:1rem;right:1.4rem;
  font-size:.58rem;font-family:'JetBrains Mono',monospace;color:var(--g4);
}

/* Answer area (shown after flip) */
.answer-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem;
  margin-top:1.5rem;padding-top:1.5rem;
  border-top:1px solid var(--g4);
}
.answer-col{display:flex;flex-direction:column;gap:.2rem}
.answer-col-label{font-family:'JetBrains Mono',monospace;font-size:.55rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--g3);margin-bottom:.1rem}
.answer-col-value{font-size:1rem;font-weight:700;letter-spacing:-.02em;color:var(--g1)}
.answer-col-sub{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--g3)}
.answer-hidden{filter:blur(6px);transition:filter .25s;cursor:pointer}
.answer-hidden.revealed{filter:none}

/* ── QUIZ MODE ── */
.quiz-card{
  background:var(--s1);border:1px solid var(--g4);border-radius:var(--r4);
  padding:2rem 2.2rem 1.8rem;position:relative;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  transition:border-color .25s;
}
.quiz-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  border-radius:var(--r4) var(--r4) 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.quiz-card.correct{border-color:var(--g2)}
.quiz-card.wrong{border-color:var(--g3)}

.quiz-prompt-label{font-family:'JetBrains Mono',monospace;font-size:.58rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--g3);margin-bottom:.5rem}
.quiz-prompt-word{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.05em;
  color:var(--g1);margin-bottom:.3rem}
.quiz-prompt-meaning{font-family:'DM Serif Display',serif;font-style:italic;
  font-size:.9rem;color:var(--g2);margin-bottom:1.6rem}

.quiz-input-row{display:flex;flex-direction:column;gap:.7rem}
.quiz-field{display:flex;flex-direction:column;gap:.25rem}
.quiz-field label{font-family:'JetBrains Mono',monospace;font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--g3)}
.quiz-input{
  background:var(--s2);border:1px solid var(--g4);border-radius:var(--r1);
  padding:.55rem .85rem;font-family:'Bricolage Grotesque',sans-serif;
  font-size:1rem;font-weight:600;color:var(--g1);outline:none;
  transition:border-color .15s,box-shadow .15s;width:100%;
}
.quiz-input:focus{border-color:var(--g3);box-shadow:var(--glow-sm)}
.quiz-input.inp-correct{border-color:var(--g2);background:rgba(255,255,255,.03)}
.quiz-input.inp-wrong{border-color:var(--g3)}
.quiz-input.inp-wrong + .field-answer{display:block}
.field-answer{display:none;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--g2);margin-top:.15rem;padding-left:.1rem}

.quiz-submit{
  margin-top:.5rem;padding:.65rem 1.8rem;border-radius:var(--r2);
  background:var(--g1);color:var(--bg);border:none;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.85rem;
  cursor:pointer;transition:opacity .15s,box-shadow .2s,transform .12s;
  letter-spacing:-.02em;align-self:flex-start;
}
.quiz-submit:hover{opacity:.85;box-shadow:0 0 20px rgba(255,255,255,.12);transform:translateY(-1px)}
.quiz-submit:active{transform:scale(.97)}

.feedback-row{
  display:flex;align-items:flex-start;gap:.7rem;padding:.8rem .95rem;
  border-radius:var(--r2);font-size:.82rem;margin-top:.9rem;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;
  border:1px solid var(--g4);background:rgba(255,255,255,.02);
}
.feedback-row.visible{opacity:1;transform:translateY(0)}
.feedback-row.fb-wrong{border-color:var(--g3)}
.feedback-row.fb-correct{border-color:var(--g3)}
.fb-icon{font-size:.95rem;flex-shrink:0;margin-top:1px}
.fb-text strong{color:var(--g1)}
.fb-text em{font-family:'DM Serif Display',serif;font-size:.9rem;color:var(--g2)}

/* ── ACTION ROW ── */
.action-row{
  width:100%;max-width:680px;
  display:grid;grid-template-columns:42px 1fr 1fr 42px;gap:.5rem;
}
.icon-btn{
  width:42px;height:42px;border-radius:var(--r2);border:1px solid var(--g4);
  background:var(--s1);color:var(--g3);cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:.95rem;
  transition:border-color .15s,color .15s,box-shadow .2s;
}
.icon-btn:hover{border-color:var(--g2);color:var(--g1);box-shadow:var(--glow-sm)}
.icon-btn:active{opacity:.6;transform:scale(.95)}
.act-btn{
  height:42px;border-radius:var(--r2);border:1px solid var(--g4);background:var(--s1);
  font-family:'Bricolage Grotesque',sans-serif;font-size:.82rem;font-weight:700;
  cursor:pointer;transition:border-color .15s,color .15s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  color:var(--g2);
}
.act-btn:hover{border-color:var(--g2);color:var(--g1);box-shadow:var(--glow-sm)}
.act-btn:active{transform:scale(.97)}
.act-btn.marked{background:var(--s2);border-color:var(--g2);color:var(--g1)}

/* ── TABLE MODE ── */
.table-wrap{width:100%;max-width:860px;overflow-x:auto}
.verb-table{width:100%;border-collapse:collapse;font-size:.82rem}
.verb-table th{
  font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--g3);padding:.6rem 1rem;
  text-align:left;border-bottom:1px solid var(--g4);background:var(--s1);
  position:sticky;top:52px;
}
.verb-table td{
  padding:.55rem 1rem;border-bottom:1px solid var(--g4);
  vertical-align:middle;transition:background .12s;
}
.verb-table tr:hover td{background:var(--s2)}
.verb-table .col-inf{font-weight:700;color:var(--g1);font-size:.9rem}
.verb-table .col-3p{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--g3)}
.verb-table .col-prat{color:var(--g2)}
.verb-table .col-aux{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--g3)}
.verb-table .col-p2{color:var(--g2)}
.verb-table .col-en{font-family:'DM Serif Display',serif;font-style:italic;color:var(--g3);font-size:.82rem}

/* ── COMPLETE ── */
.complete-screen{
  width:100%;max-width:680px;background:var(--s1);border:1px solid var(--g4);
  border-radius:var(--r4);padding:2.5rem 2.2rem 2rem;text-align:center;
  display:none;flex-direction:column;align-items:center;gap:1.4rem;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
}
.complete-screen.visible{display:flex}
.complete-emoji{font-size:2.4rem;line-height:1}
.complete-title{font-size:1.5rem;font-weight:800;letter-spacing:-.05em;color:var(--g1)}
.complete-sub{font-family:'DM Serif Display',serif;font-style:italic;font-size:.95rem;color:var(--g2);line-height:1.65}
.complete-stats{display:flex;gap:3rem;padding:1rem 0;border-top:1px solid var(--g4);border-bottom:1px solid var(--g4);width:100%;justify-content:center}
.c-val{font-size:1.7rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin-bottom:.2rem;color:var(--g1)}
.c-lbl{font-size:.57rem;font-family:'JetBrains Mono',monospace;color:var(--g3);letter-spacing:.1em;text-transform:uppercase}
.complete-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.btn-primary{padding:.62rem 1.7rem;border-radius:var(--r2);background:var(--g1);color:var(--bg);
  border:none;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.85rem;
  cursor:pointer;transition:opacity .15s,box-shadow .2s,transform .12s}
.btn-primary:hover{opacity:.85;box-shadow:0 0 20px rgba(255,255,255,.12);transform:translateY(-1px)}
.btn-ghost{padding:.62rem 1.3rem;border-radius:var(--r2);background:transparent;color:var(--g2);
  border:1px solid var(--g4);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
  font-size:.85rem;cursor:pointer;transition:border-color .15s,color .15s,box-shadow .2s}
.btn-ghost:hover{border-color:var(--g3);color:var(--g1);box-shadow:var(--glow-sm)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--s2);border:1px solid var(--g4);border-radius:var(--r1);
  padding:.42rem .9rem;font-size:.68rem;color:var(--g2);
  font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .22s,transform .22s;
  pointer-events:none;z-index:200;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:560px){
  .topbar{padding:0 1rem}
  main{padding:1.2rem 1rem 3rem}
  .flash-card,.quiz-card{padding:1.5rem 1.2rem 1.2rem}
  .action-row{grid-template-columns:38px 1fr 1fr 38px}
  .answer-grid{grid-template-columns:1fr 1fr}
  .verb-table th,.verb-table td{padding:.45rem .6rem;font-size:.75rem}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="app.html" class="logo">
    DeutschKarten
    <span class="logo-slash">/ Starke Verben</span>
  </a>
  <a href="app.html" class="back-link">← Flashcards</a>
</header>

<main id="mainArea">

  <!-- MODE SELECTOR -->
  <div class="mode-bar" id="modeBar">
    <button class="mode-btn active" onclick="setMode('flash')" id="modeFlash">⟳ Flashcards</button>
    <button class="mode-btn" onclick="setMode('quiz')"  id="modeQuiz">✎ Quiz</button>
    <button class="mode-btn" onclick="setMode('table')" id="modeTable">☰ Reference</button>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar">
    <span class="filter-label">Filter:</span>
    <input class="search-input" id="searchInput" placeholder="Search verb or meaning…" oninput="applyFilter()">
    <span class="count-pill" id="countPill">96 verbs</span>
  </div>

  <!-- PROGRESS -->
  <div class="progress-area" id="progressArea">
    <div class="progress-meta">
      <div class="progress-label"><strong id="progIdx">1</strong> / <strong id="progTotal">96</strong></div>
      <div class="score-row">
        <span class="sc-correct">✓ <span id="scoreCorrect">0</span></span>
        <span class="sc-wrong">✗ <span id="scoreWrong">0</span></span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <!-- FLASH CARD -->
  <div class="card-wrap" id="flashWrap">
    <div class="flash-card" id="flashCard" onclick="toggleReveal()">
      <div class="card-eyebrow"><span class="card-eyebrow-dot"></span><span id="fcEyebrow">Infinitiv</span></div>
      <div class="card-infinitiv" id="fcInfinitiv">—</div>
      <div class="card-meaning" id="fcMeaning">—</div>
      <div class="answer-grid" id="fcAnswer">
        <div class="answer-col">
          <div class="answer-col-label">3. Pers. Präs.</div>
          <div class="answer-col-value answer-hidden" id="fc3p">—</div>
        </div>
        <div class="answer-col">
          <div class="answer-col-label">Präteritum</div>
          <div class="answer-col-value answer-hidden" id="fcPrat">—</div>
          <div class="answer-col-sub answer-hidden" id="fcAux">—</div>
        </div>
        <div class="answer-col">
          <div class="answer-col-label">Partizip II</div>
          <div class="answer-col-value answer-hidden" id="fcP2">—</div>
        </div>
      </div>
      <div class="card-flip-hint">tap to reveal</div>
    </div>
  </div>

  <!-- FLASH ACTION ROW -->
  <div class="action-row" id="flashActions">
    <button class="icon-btn" onclick="prevCard()" title="Previous">←</button>
    <button class="act-btn" id="btnWrong" onclick="markCard(false)">✗ Still learning</button>
    <button class="act-btn" id="btnKnow"  onclick="markCard(true)">✓ Know it</button>
    <button class="icon-btn" onclick="shuffleCards()" title="Shuffle">⇄</button>
  </div>

  <!-- QUIZ CARD -->
  <div class="quiz-card" id="quizCard" style="display:none">
    <div class="quiz-prompt-label" id="qPromptLabel">Give the forms for:</div>
    <div class="quiz-prompt-word" id="qWord">—</div>
    <div class="quiz-prompt-meaning" id="qMeaning">—</div>

    <div class="quiz-input-row" id="qInputRow">
      <div class="quiz-field" id="q3pField">
        <label>3. Pers. Präsens</label>
        <input class="quiz-input" id="q3pInput" placeholder="er/sie/es …" autocomplete="off" spellcheck="false">
        <div class="field-answer" id="q3pAnswer"></div>
      </div>
      <div class="quiz-field">
        <label>Präteritum</label>
        <input class="quiz-input" id="qPratInput" placeholder="er/sie/es …" autocomplete="off" spellcheck="false">
        <div class="field-answer" id="qPratAnswer"></div>
      </div>
      <div class="quiz-field">
        <label>Partizip II</label>
        <input class="quiz-input" id="qP2Input" placeholder="ge…" autocomplete="off" spellcheck="false">
        <div class="field-answer" id="qP2Answer"></div>
      </div>
      <button class="quiz-submit" id="qSubmit" onclick="submitQuiz()">Check →</button>
    </div>

    <div class="feedback-row" id="qFeedback">
      <span class="fb-icon" id="qFbIcon"></span>
      <span class="fb-text" id="qFbText"></span>
    </div>
  </div>

  <!-- QUIZ ACTION ROW -->
  <div class="action-row" id="quizActions" style="display:none">
    <button class="icon-btn" onclick="prevCard()">←</button>
    <button class="act-btn" id="qBtnNext" onclick="nextCard()" style="grid-column:2/4">Next →</button>
    <button class="icon-btn" onclick="shuffleCards()">⇄</button>
  </div>

  <!-- TABLE MODE -->
  <div class="table-wrap" id="tableWrap" style="display:none">
    <table class="verb-table" id="verbTable">
      <thead>
        <tr>
          <th>Infinitiv</th>
          <th>3. P. Präs.</th>
          <th>Präteritum</th>
          <th>Aux</th>
          <th>Partizip II</th>
          <th>English</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- COMPLETE -->
  <div class="complete-screen" id="completeScreen">
    <div class="complete-emoji" id="cEmoji">🏆</div>
    <div class="complete-title" id="cTitle">Deck complete!</div>
    <div class="complete-sub" id="cSub"></div>
    <div class="complete-stats">
      <div><div class="c-val" id="cKnown">0</div><div class="c-lbl">Known</div></div>
      <div><div class="c-val" id="cLearn">0</div><div class="c-lbl">Learning</div></div>
      <div><div class="c-val" id="cTotal">0</div><div class="c-lbl">Total</div></div>
    </div>
    <div class="complete-btns">
      <button class="btn-primary" onclick="restartDeck()">↺ Restart</button>
      <button class="btn-ghost"   onclick="reviewWrong()">Practice ✗ only</button>
    </div>
  </div>

</main>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  VERB DATA — all strong/irregular verbs from the book
//  Format: [infinitiv, 3rdPres, prät, aux, partizipII, en]
//  aux: '' = haben, 'ist' = sein, 'hat/ist' = both
// ═══════════════════════════════════════════════════════

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let mode = 'flash';       // 'flash' | 'quiz' | 'table'
let deck = [...VERBS];    // filtered+shuffled working set
let idx  = 0;
let revealed = false;
let known = {};           // idx in original VERBS → true/false
let quizAnswered = false;
let quizScoreC = 0, quizScoreW = 0;

// ═══════════════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════════════
function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  deck = q
    ? VERBS.filter(v => v[0].toLowerCase().includes(q) || v[5].toLowerCase().includes(q))
    : [...VERBS];
  idx = 0;
  known = {};
  quizScoreC = 0; quizScoreW = 0;
  document.getElementById('countPill').textContent = deck.length + ' verbs';
  renderCurrent();
  hideComplete();
  if (mode === 'table') buildTable();
}

// ═══════════════════════════════════════════════
//  MODE SWITCHING
// ═══════════════════════════════════════════════
function setMode(m) {
  mode = m;
  ['flash','quiz','table'].forEach(n => {
    document.getElementById('mode' + n.charAt(0).toUpperCase() + n.slice(1)).classList.toggle('active', n === m);
  });

  document.getElementById('flashWrap').style.display    = m === 'flash' ? 'block' : 'none';
  document.getElementById('flashActions').style.display = m === 'flash' ? 'grid'  : 'none';
  document.getElementById('quizCard').style.display     = m === 'quiz'  ? 'block' : 'none';
  document.getElementById('quizActions').style.display  = m === 'quiz'  ? 'grid'  : 'none';
  document.getElementById('tableWrap').style.display    = m === 'table' ? 'block' : 'none';
  document.getElementById('progressArea').style.display = m === 'table' ? 'none'  : 'flex';
  document.getElementById('filterBar').style.display    = 'flex';
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('completeScreen').classList.remove('visible');

  idx = 0; known = {}; quizScoreC = 0; quizScoreW = 0; revealed = false; quizAnswered = false;

  if (m === 'table') { buildTable(); return; }
  renderCurrent();
}

// ═══════════════════════════════════════════════
//  FLASH MODE
// ═══════════════════════════════════════════════
function renderCurrent() {
  if (!deck.length) return;
  const v = deck[idx];
  revealed = false;

  // Flash card
  document.getElementById('fcEyebrow').textContent  = 'Starkes Verb';
  document.getElementById('fcInfinitiv').textContent = v[0];
  document.getElementById('fcMeaning').textContent   = v[5];
  document.getElementById('fc3p').textContent   = v[1] || '— (regular)';
  document.getElementById('fcPrat').textContent = v[2];
  document.getElementById('fcAux').textContent  = v[3] ? '(' + v[3] + ' +)' : '(hat +)';
  document.getElementById('fcP2').textContent   = v[4];

  // Hide answers
  document.querySelectorAll('.answer-hidden').forEach(el => {
    el.classList.add('answer-hidden');
    if (!el.classList.contains('answer-hidden')) el.classList.add('answer-hidden');
  });
  // Re-add blur
  document.getElementById('fc3p').classList.add('answer-hidden');
  document.getElementById('fcPrat').classList.add('answer-hidden');
  document.getElementById('fcAux').classList.add('answer-hidden');
  document.getElementById('fcP2').classList.add('answer-hidden');

  document.querySelector('.card-flip-hint').textContent = 'tap to reveal';

  // Card state
  document.getElementById('flashCard').style.borderColor = '';
  document.getElementById('flashCard').style.boxShadow = '';

  // Buttons
  const k = known[idx];
  document.getElementById('btnKnow').classList.toggle('marked', k === true);
  document.getElementById('btnWrong').classList.toggle('marked', k === false);

  updateProgress();

  // Quiz card
  if (mode === 'quiz') renderQuiz();
}

function toggleReveal() {
  if (mode !== 'flash') return;
  revealed = !revealed;
  ['fc3p','fcPrat','fcAux','fcP2'].forEach(id => {
    document.getElementById(id).classList.toggle('answer-hidden', !revealed);
  });
  document.querySelector('.card-flip-hint').textContent = revealed ? 'tap to hide' : 'tap to reveal';
}

function nextCard(animate) {
  if (idx >= deck.length - 1) { showComplete(); return; }
  idx++;
  quizAnswered = false;
  clearQuizInputs();
  renderCurrent();
}

function prevCard() {
  if (idx === 0) return;
  idx--;
  quizAnswered = false;
  clearQuizInputs();
  renderCurrent();
}

function markCard(isKnown) {
  known[idx] = isKnown;
  document.getElementById('btnKnow').classList.toggle('marked', isKnown);
  document.getElementById('btnWrong').classList.toggle('marked', !isKnown);
  showToast(isKnown ? '✓ Marked as known' : '✗ Still learning');
  setTimeout(() => nextCard(), 180);
}

function shuffleCards() {
  deck = deck.sort(() => Math.random() - 0.5);
  idx = 0; known = {}; quizScoreC = 0; quizScoreW = 0;
  quizAnswered = false;
  clearQuizInputs();
  renderCurrent();
  showToast('⇄ Shuffled!');
}

// ═══════════════════════════════════════════════
//  QUIZ MODE
// ═══════════════════════════════════════════════
function renderQuiz() {
  const v = deck[idx];
  quizAnswered = false;

  // Randomly decide what to show: infinitiv → forms, OR one form → others
  document.getElementById('qWord').textContent    = v[0];
  document.getElementById('qMeaning').textContent = v[5];
  document.getElementById('qPromptLabel').textContent = 'Give the forms for:';

  clearQuizInputs();
  document.getElementById('qFeedback').classList.remove('visible','fb-correct','fb-wrong');
  document.getElementById('quizCard').className = 'quiz-card';
  document.getElementById('qSubmit').style.display = 'block';

  // Show 3rd person field only if verb has irregular present
  document.getElementById('q3pField').style.display = v[1] ? 'flex' : 'none';
  document.getElementById('qBtnNext').style.display = 'none';
}

function clearQuizInputs() {
  ['q3pInput','qPratInput','qP2Input'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('inp-correct','inp-wrong'); }
  });
  ['q3pAnswer','qPratAnswer','qP2Answer'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; el.textContent = ''; }
  });
  ['q3pInput','qPratInput','qP2Input'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = false;
  });
}

function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/ä/g,'ä').replace(/ö/g,'ö').replace(/ü/g,'ü').replace(/ß/g,'ß');
}

function submitQuiz() {
  if (quizAnswered) { nextCard(); return; }
  quizAnswered = true;
  const v = deck[idx];

  let allCorrect = true;

  // Check 3rd pres (if applicable)
  if (v[1]) {
    const inp = document.getElementById('q3pInput');
    const ok = normalize(inp.value) === normalize(v[1]);
    inp.classList.add(ok ? 'inp-correct' : 'inp-wrong');
    inp.disabled = true;
    if (!ok) {
      document.getElementById('q3pAnswer').textContent = '✓ ' + v[1];
      document.getElementById('q3pAnswer').style.display = 'block';
      allCorrect = false;
    }
  }

  // Check Präteritum
  const pratInp = document.getElementById('qPratInput');
  const pratOk  = normalize(pratInp.value) === normalize(v[2]);
  pratInp.classList.add(pratOk ? 'inp-correct' : 'inp-wrong');
  pratInp.disabled = true;
  if (!pratOk) {
    document.getElementById('qPratAnswer').textContent = '✓ ' + v[2] + (v[3] ? ' (' + v[3] + ')' : '');
    document.getElementById('qPratAnswer').style.display = 'block';
    allCorrect = false;
  }

  // Check Partizip II
  const p2Inp = document.getElementById('qP2Input');
  const p2Ok  = normalize(p2Inp.value) === normalize(v[4]);
  p2Inp.classList.add(p2Ok ? 'inp-correct' : 'inp-wrong');
  p2Inp.disabled = true;
  if (!p2Ok) {
    document.getElementById('qP2Answer').textContent = '✓ ' + v[4];
    document.getElementById('qP2Answer').style.display = 'block';
    allCorrect = false;
  }

  // Update score
  if (allCorrect) { quizScoreC++; known[idx] = true; }
  else            { quizScoreW++; known[idx] = false; }
  document.getElementById('scoreCorrect').textContent = quizScoreC;
  document.getElementById('scoreWrong').textContent   = quizScoreW;

  // Feedback
  const fb = document.getElementById('qFeedback');
  fb.className = 'feedback-row visible ' + (allCorrect ? 'fb-correct' : 'fb-wrong');
  document.getElementById('qFbIcon').textContent = allCorrect ? '✓' : '✗';
  document.getElementById('qFbText').innerHTML   = allCorrect
    ? `<strong>Perfekt!</strong> All forms correct.`
    : `<strong>Not quite.</strong> <em>Check the corrections above.</em>`;

  document.getElementById('quizCard').classList.add(allCorrect ? 'correct' : 'wrong');
  document.getElementById('qSubmit').style.display = 'none';
  document.getElementById('qBtnNext').style.display = 'block';

  updateProgress();
}

// ═══════════════════════════════════════════════
//  TABLE MODE
// ═══════════════════════════════════════════════
function buildTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  deck.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="col-inf">${v[0]}</span>${v[1] ? '<br><span class="col-3p">(' + v[1] + ')</span>' : ''}</td>
      <td class="col-3p">${v[1] || '—'}</td>
      <td class="col-prat">${v[2]}</td>
      <td class="col-aux">${v[3] || 'hat'}</td>
      <td class="col-p2">${v[4]}</td>
      <td class="col-en">${v[5]}</td>`;
    tbody.appendChild(tr);
  });
}

// ═══════════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════════
function updateProgress() {
  const total = deck.length;
  const pct   = total ? Math.round((idx / total) * 100) : 0;
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progIdx').textContent   = Math.min(idx + 1, total);
  document.getElementById('progTotal').textContent = total;
}

// ═══════════════════════════════════════════════
//  COMPLETE
// ═══════════════════════════════════════════════
function showComplete() {
  document.getElementById('flashWrap').style.display    = 'none';
  document.getElementById('flashActions').style.display = 'none';
  document.getElementById('quizCard').style.display     = 'none';
  document.getElementById('quizActions').style.display  = 'none';

  const ks = Object.values(known).filter(v => v === true).length;
  const ls = Object.values(known).filter(v => v === false).length;
  const pct = deck.length ? Math.round((ks / deck.length) * 100) : 0;

  document.getElementById('cKnown').textContent = ks;
  document.getElementById('cLearn').textContent = ls;
  document.getElementById('cTotal').textContent = deck.length;

  let emoji, title, sub;
  if (pct >= 90) { emoji='🏆'; title='Ausgezeichnet!'; sub=pct+'% — you know your strong verbs!'; }
  else if (pct >= 70) { emoji='🎉'; title='Sehr gut!'; sub=pct+'% — great work, keep it up.'; }
  else if (pct >= 50) { emoji='📚'; title='Gut gemacht!'; sub=pct+'% — practise the rest!'; }
  else { emoji='💪'; title='Weiter üben!'; sub=pct+'% — review the "still learning" pile.'; }

  document.getElementById('cEmoji').textContent = emoji;
  document.getElementById('cTitle').textContent = title;
  document.getElementById('cSub').textContent   = sub;

  document.getElementById('reviewWrongBtn') && (document.getElementById('reviewWrongBtn').style.display = ls > 0 ? '' : 'none');

  const screen = document.getElementById('completeScreen');
  screen.style.display = 'flex';
  screen.classList.add('visible');
}

function hideComplete() {
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('completeScreen').classList.remove('visible');
  if (mode === 'flash') {
    document.getElementById('flashWrap').style.display    = 'block';
    document.getElementById('flashActions').style.display = 'grid';
  } else if (mode === 'quiz') {
    document.getElementById('quizCard').style.display     = 'block';
    document.getElementById('quizActions').style.display  = 'grid';
  }
}

function restartDeck() {
  idx = 0; known = {}; quizScoreC = 0; quizScoreW = 0; quizAnswered = false;
  clearQuizInputs();
  hideComplete();
  renderCurrent();
}

function reviewWrong() {
  const wrong = deck.filter((_, i) => known[i] === false);
  if (!wrong.length) { showToast('No learning cards!'); return; }
  deck = wrong;
  idx  = 0; known = {}; quizScoreC = 0; quizScoreW = 0; quizAnswered = false;
  clearQuizInputs();
  document.getElementById('countPill').textContent = deck.length + ' verbs';
  hideComplete();
  renderCurrent();
}

// ═══════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (mode === 'flash') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleReveal(); }
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft')  prevCard();
    if (e.key === 'y' || e.key === 'Y') markCard(true);
    if (e.key === 'n' || e.key === 'N') markCard(false);
  }
  if (mode === 'quiz' && e.key === 'Enter' && quizAnswered) nextCard();
});

// Submit quiz on Enter in last input
document.getElementById('qP2Input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submitQuiz(); }
});

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2000);
}
