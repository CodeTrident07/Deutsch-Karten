<title>DeutschKarten – Wördle</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Surfaces ── */
  --bg:   #080808;
  --s1:   #0f0f0f;
  --s2:   #161616;
  --s3:   #1e1e1e;
  --s4:   #242424;

  /* ── Greyscale ── */
  --g1:   #f0f0f0;
  --g2:   #ababab;
  --g3:   #7c7c7c;
  --g4:   #303030;

  /* ── Semantic aliases ── */
  --surface:   var(--s1);
  --surface2:  var(--s2);
  --surface3:  var(--s3);
  --border:    var(--g4);
  --border2:   #3d3d3d;
  --text:      var(--g1);
  --text2:     var(--g2);
  --text3:     var(--g3);
  --ink:       var(--g1);
  --ink2:      var(--g2);
  --ink3:      var(--g3);

  /* ── Spacing scale (4px base) ── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ── Typography ── */
  --font-sans:  'Bricolage Grotesque', system-ui, sans-serif;
  --font-serif: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --text-xs:   0.65rem;   /* 10.4px — labels, badges */
  --text-sm:   0.75rem;   /* 12px   — secondary text */
  --text-base: 0.875rem;  /* 14px   — body */
  --text-md:   1rem;      /* 16px   — UI text */
  --text-lg:   1.25rem;   /* 20px   — card headings */
  --text-xl:   1.5rem;    /* 24px   — section headings */
  --text-2xl:  2rem;      /* 32px   — display */
  --text-3xl:  2.8rem;    /* 44px   — hero */

  /* ── Border radius ── */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 24px;

  /* ── Shadows ── */
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.5);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.6);
  --shadow-lg:  0 12px 40px rgba(0,0,0,0.7);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.6), 0 16px 40px rgba(0,0,0,0.5);

  /* ── Glow (monochrome white) ── */
  --glow-xs:  0 0 8px  rgba(255,255,255,0.04);
  --glow-sm:  0 0 16px rgba(255,255,255,0.06);
  --glow-md:  0 0 28px rgba(255,255,255,0.08);

  /* ── Transitions ── */
  --ease:       cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:   cubic-bezier(0, 0, 0.2, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast:     100ms;
  --t-base:     160ms;
  --t-slow:     280ms;

  /* ── Layout ── */
  --topbar-h:   52px;
  --card-max:   600px;
  --page-max:   860px;

  /* ── Keep old names pointing to new tokens (backward compat) ── */
  --surf:    var(--s1);
  --surf2:   var(--s2);
  --surf3:   var(--s3);
  --sf2:     var(--s2);
  --sf3:     var(--s3);
  --bord:    var(--g4);
  --bord2:   #3d3d3d;
  --rule:    var(--g4);
  --rule2:   #3d3d3d;
  --ln2:     #3d3d3d;
  --line:    var(--g4);
  --glow:    var(--glow-sm);
  --glow-sm: 0 0 16px rgba(255,255,255,0.06);

  /* ── Activity-specific (keep for derdiedas, old level vars) ── */
  --der:  var(--g1); --derd: var(--s2);
  --die:  var(--g2); --died: var(--s2);
  --das:  var(--g2); --dasd: var(--s2);
  --a1: var(--g1); --a1d: var(--s2); --a1m: rgba(255,255,255,0.04);
  --a2: var(--g1); --a2d: var(--s2); --a2m: rgba(255,255,255,0.04);
  --b1: var(--g1); --b1d: var(--s2); --b1m: rgba(255,255,255,0.04);
  --b2: var(--g1); --b2d: var(--s2); --b2m: rgba(255,255,255,0.04);
  --c1: var(--g1); --c1d: var(--s2); --c1m: rgba(255,255,255,0.04);
  --amber: var(--g1); --amberd: var(--s2);
  --accent: var(--g1); --accentd: var(--s2);
  --lvl: var(--g1); --lvld: var(--s2); --lvlm: rgba(255,255,255,0.04);
  --green:   var(--g1); --greend: var(--s2);
  --red:     var(--g2); --redd:   var(--s2);
  --gold:    var(--g1); --goldd:  var(--s2);
  --silver:  var(--g2);
  --bronze:  var(--g3);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--g1);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font-family: inherit; }

/* ── Focus ring — accessibility ── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--g4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--g3); }

/* ── Topbar — shared across all pages ── */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--g4);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--g1);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  transition: opacity var(--t-base) var(--ease);
  user-select: none;
}
.logo:hover {text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;}
.logo-slash {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--g3);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ── Back link / nav buttons — universal ── */
.back-link, .nav-btn, .back-btn {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  color: var(--g3);
  text-decoration: none;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--g4);
  border-radius: var(--r-xs);
  background: transparent;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.back-link:hover, .nav-btn:hover, .back-btn:hover {
  color: var(--g1);
  border-color: var(--g3);
  box-shadow: var(--glow-sm);
}
:is(.back-link, .nav-btn, .back-btn):focus-visible {
  outline: 2px solid var(--g2);
  outline-offset: 2px;
}

/* ── Primary button ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.6rem;
  background: var(--g1);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 800;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: opacity var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease),
              transform var(--t-fast) var(--ease);
}
.btn-primary:hover {background: #cfcfcf;}
.btn-primary:active { transform: scale(0.97); opacity: 0.8; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Ghost button ── */
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.6rem 1.4rem;
  background: transparent;
  color: var(--g2);
  border: 1px solid var(--g4);
  border-radius: var(--r-md);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 700;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.btn-ghost:hover { color: var(--g1); border-color: var(--g3); box-shadow: var(--glow-sm); }
.btn-ghost:active { transform: scale(0.97); }
.btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Card surface ── */
.card {
  background: var(--s1);
  border: 1px solid var(--g4);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: none;
  pointer-events: none;
}

/* ── Input ── */
.input {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.55rem 0.85rem;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--g1);
  outline: none;
  transition: border-color var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease);
}
.input:focus {
  border-color: var(--g3);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
}
.input::placeholder { color: var(--g3); }
.input:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Progress bar ── */
.progress-bar {
  width: 100%;
  height: 2px;
  background: var(--g4);
  overflow: hidden;
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  background: var(--g1);
  border-radius: 1px;
  transition: width 0.4s var(--ease);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--sp-8);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s2);
  border: 1px solid var(--g4);
  border-radius: var(--r-sm);
  padding: 0.45rem 1rem;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.03em;
  color: var(--g2);
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  transition: opacity var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Utility ── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}


.card-scene:hover .card-face,
.quiz-card:hover {
  border-color: var(--g3);
  box-shadow: 0 0 30px rgba(255,255,255,0.05), 0 20px 48px rgba(0,0,0,0.5) !important;
}

.nav-btn, .back-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--ink3);
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid var(--border2);
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.nav-btn:hover, .back-btn:hover {
  color: var(--ink);
  border-color: var(--ink3);
  background: var(--surface2);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:18px; }
body {
  background:var(--bg);
  font-family:'Bricolage Grotesque',sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex; flex-direction:column;
  overflow-x:hidden;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:48px 48px;
  opacity:0.15; pointer-events:none; z-index:0; display: none;}

/* ── Topbar ── */
.topbar {
  display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; padding:0.9rem 1.6rem;
  border-bottom:1px solid var(--border);
  background: var(--bg);
  position:sticky; top:0; z-index:100;
}
.logo { font-size:1.25rem; font-weight:800; letter-spacing:-0.04em; display:flex; align-items:center; gap:0.5rem; }
.top-center { font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--text3); text-align:center; line-height:1.4; }
.top-right { display:flex; align-items:center; gap:0.5rem; justify-self:end; }



/* ── Arena ── */
.arena {
  flex:1; display:flex; flex-direction:column;
  align-items:center; padding:1.5rem 1rem 1rem;
  position:relative; z-index:1; gap:0.8rem;
}

/* ── Word hint ── */
.word-hint {
  font-family: var(--font-sans); 
  font-size:1rem; color:var(--text3);
  background:var(--surface); border:1px solid var(--bord2);
  border-radius: 6px; padding:0.3rem 1rem;
}

/* ── Grid ── */
.grid-wrap { display:flex; flex-direction:column; gap:0.45rem; }
.grid-row { display:flex; gap:0.45rem; }
.tile {
  width:54px; height:54px;
  border:2px solid var(--bord2);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:1.3rem; font-weight:700;
  color:var(--text); background:var(--surf2);
  transition:background 0.25s, border-color 0.25s, transform 0.1s;
  position:relative; overflow:hidden;
  text-transform:uppercase;
}
.tile.filled { border-color:var(--text3); animation:pop 0.1s ease; }
.tile.hit   { background:var(--surf-hit);  border-color:var(--green);  color:var(--green); }
.tile.near  { background:var(--surf-near); border-color:var(--yellow); color:var(--yellow); }
.tile.miss  { background:var(--surf-miss); border-color:var(--text3);  color:var(--text3); }
.tile.shake { animation:shake 0.4s ease; }
.tile.flip  { animation:flip 0.4s ease forwards; }

@keyframes pop  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 60%{transform:translateX(5px)} }
@keyframes flip  { 0%{transform:rotateX(0)} 50%{transform:rotateX(-90deg)} 100%{transform:rotateX(0)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* ── Keyboard ── */
.keyboard { display:flex; flex-direction:column; gap:0.4rem; align-items:center; width:100%; max-width:500px; }
.kb-row { display:flex; gap:0.3rem; }
.key {
  min-width:34px; height:48px; padding:0 0.5rem;
  background:var(--surf2); border:1px solid var(--bord2);
  border-radius:8px; font-family:'JetBrains Mono',monospace;
  font-size:0.78rem; font-weight:700; color:var(--text2);
  cursor:pointer; transition:all 0.15s;
  display:flex; align-items:center; justify-content:center;
  text-transform:uppercase;
}
.key:hover { border-color:var(--text2); color:var(--text); }
.key.wide { min-width:52px; font-size:0.68rem; }
.key.hit  { background:var(--surf-hit);  border-color:var(--green);  color:var(--green); }
.key.near { background:var(--surf-near); border-color:var(--yellow); color:var(--yellow); }
.key.miss { background:var(--surf-miss); border-color:var(--text3);  color:var(--text3); opacity:0.5; }

/* ── Message ── */
.msg-bar {
  font-family:'JetBrains Mono',monospace; font-size:0.82rem;
  color:var(--text3); min-height:1.4rem; text-align:center;
  transition:color 0.2s;
}
.msg-bar.good { color:var(--green); }
.msg-bar.bad  { color:var(--red); }

/* ── Result card ── */
.result-card {
  display:none; flex-direction:column; align-items:center;
  gap:1rem; background:var(--surface); border:1px solid var(--bord2);
  border-radius: 6px; padding:1.8rem; max-width:400px; width:100%;
  text-align:center; animation:cardIn 0.35s ease;
}
.result-card.show { display:flex; }
@keyframes cardIn { from{opacity:0;transform:translateY(12px) scale(0.97)} to{opacity:1;transform:none} }
.result-emoji { font-size:3rem; }
.result-title { font-size:1.5rem; font-weight:800; letter-spacing:-0.03em; }
.result-word {
  font-family:'JetBrains Mono',monospace; font-size:1.2rem;
  font-weight:700; color:var(--green); letter-spacing:0.1em;
  text-transform:uppercase;
}
.result-def { font-family: var(--font-sans);  color:var(--text2); font-size:1rem; }
.result-stats { display:flex; gap:1.5rem; }
.rstat { display:flex; flex-direction:column; align-items:center; gap:0.2rem; }
.rstat-val { font-size:1.6rem; font-weight:800; }
.rstat-label { font-size:0.68rem; font-family:'JetBrains Mono',monospace; color:var(--text3); text-transform:uppercase; }
.share-btn {
  background:var(--green); color:var(--bg);
  border:none; border-radius:12px; padding:0.7rem 1.8rem;
  font-family:'Bricolage Grotesque',sans-serif; font-size:0.95rem; font-weight:800;
  cursor:pointer; transition:opacity 0.2s; width:100%;
}
.share-btn:hover {background: #cfcfcf;}
.play-again-btn {
  background:var(--surf2); color:var(--text2);
  border:1px solid var(--bord2); border-radius:12px; padding:0.6rem 1.5rem;
  font-family:'Bricolage Grotesque',sans-serif; font-size:0.9rem; font-weight:700;
  cursor:pointer; transition:all 0.2s; width:100%;
}
.play-again-btn:hover { border-color:var(--text2); color:var(--text); }

/* ── Umlauts bar ── */
.umlaut-bar { display:flex; gap:0.4rem; }
.um-btn {
  padding:0.3rem 0.6rem; background:var(--surf2);
  border:1px solid var(--bord2); border-radius:8px;
  font-family:'JetBrains Mono',monospace; font-size:0.85rem;
  color:var(--text2); cursor:pointer; transition:all 0.15s;
}
.um-btn:hover { border-color:var(--green); color:var(--green); }

/* ── Daily badge ── */
.daily-badge {
  font-family:'JetBrains Mono',monospace; font-size:0.7rem;
  color:var(--text3); background:var(--surf2);
  border:1px solid var(--bord2); border-radius: 6px;
  padding:0.2rem 0.6rem;
}

@media(max-width:480px) {
  .tile { width:44px; height:44px; font-size:1.1rem; border-radius:8px; }
  .key  { min-width:28px; height:42px; font-size:0.7rem; }
  .key.wide { min-width:44px; }
  .topbar { padding:0.8rem 1rem; }
}

/* Emoji slots are left in the markup for the scripts but not shown */

    initGame(word, true);
  } else {
    const word = ALL_WORDS[Math.floor(Math.random() * ALL_WORDS.length)];
    initGame(word, false);
  }
}

function initGame(wordObj, isDaily) {
  target = wordObj.w.toLowerCase();
  targetLetters = target.split('');
  wordLen = target.length;
  maxGuesses = wordLen + 1; // 6 for 5-letter, 7 for 6-letter

  guesses = [];
  currentGuess = '';
  gameOver = false;
  startTime = Date.now();

  document.getElementById('wordHint').textContent =
    isDaily ? `Daily word: ${wordLen} letters (${wordObj.en})` : `${wordLen} letters: ${wordObj.en}`;
  document.getElementById('dailyBadge').textContent = isDaily ? `Daily #${getDayIndex()}` : 'Practice';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('msgBar').textContent = '';
  document.getElementById('msgBar').className = 'msg-bar';

  buildGrid();
  buildKeyboard();
  updateGrid();
}

// ── Grid ────────────────────────────────────────────────────────
function buildGrid() {
  const wrap = document.getElementById('gridWrap');
  wrap.innerHTML = '';
  for (let r = 0; r < maxGuesses; r++) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.id = 'row-' + r;
    for (let c = 0; c < wordLen; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    wrap.appendChild(row);
  }
}

function updateGrid() {
  for (let r = 0; r < maxGuesses; r++) {
    const guess = guesses[r] || '';
    for (let c = 0; c < wordLen; c++) {
      const tile = document.getElementById(`tile-${r}-${c}`);
      if (r < guesses.length) {
        // Submitted guess — already colored
      } else if (r === guesses.length) {
        // Current row
        const ch = currentGuess[c] || '';
        tile.textContent = ch.toUpperCase();
        tile.className = 'tile' + (ch ? ' filled' : '');
      } else {
        tile.textContent = '';
        tile.className = 'tile';
      }
    }
  }
}

function colorRow(rowIdx, result) {
  for (let c = 0; c < wordLen; c++) {
    const tile = document.getElementById(`tile-${rowIdx}-${c}`);
    setTimeout(() => {
      tile.classList.add('flip');
      setTimeout(() => {
        tile.classList.remove('flip');
        tile.classList.add(result[c]);
      }, 200);
    }, c * 100);
  }
}

// ── Keyboard ────────────────────────────────────────────────────
const KB_ROWS = [
  ['q','w','e','r','t','z','u','i','o','p','ü'],
  ['a','s','d','f','g','h','j','k','l','ö','ä'],
  ['ENTER','y','x','c','v','b','n','m','ß','⌫'],
];

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k.toUpperCase();
      btn.id = 'key-' + k;
      btn.addEventListener('click', () => handleKey(k));
      div.appendChild(btn);
    });
    kb.appendChild(div);
  });
}

function updateKeyboard(guess, result) {
  for (let i = 0; i < guess.length; i++) {
    const keyEl = document.getElementById('key-' + guess[i]);
    if (!keyEl) continue;
    const cur = keyEl.className;
    if (result[i] === 'hit') { keyEl.className = 'key wide'.includes(guess[i]) ? 'key wide hit' : 'key hit'; }
    else if (result[i] === 'near' && !cur.includes('hit')) { keyEl.className = 'key near'; }
    else if (result[i] === 'miss' && !cur.includes('hit') && !cur.includes('near')) { keyEl.className = 'key miss'; }
  }
}

// ── Guess logic ─────────────────────────────────────────────────
function evaluate(guess) {
  const result = Array(wordLen).fill('miss');
  const tCopy = [...targetLetters];
  const gArr = guess.split('');

  // First pass: hits
  for (let i = 0; i < wordLen; i++) {
    if (gArr[i] === tCopy[i]) {
      result[i] = 'hit';
      tCopy[i] = null;
    }
  }
  // Second pass: near
  for (let i = 0; i < wordLen; i++) {
    if (result[i] !== 'hit') {
      const j = tCopy.indexOf(gArr[i]);
      if (j !== -1) { result[i] = 'near'; tCopy[j] = null; }
    }
  }
  return result;
}

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫' || k === 'backspace') {
    currentGuess = currentGuess.slice(0,-1);
    updateGrid();
    return;
  }
  if (k === 'enter') {
    submitGuess();
    return;
  }
  if (currentGuess.length >= wordLen) return;
  // Accept letters + umlauts
  if (/^[a-zäöüß]$/i.test(k)) {
    currentGuess += k.toLowerCase();
    updateGrid();
  }
}

function shakeRow(rowIdx) {
  const row = document.getElementById('row-' + rowIdx);
  row.querySelectorAll('.tile').forEach(t => {
    t.classList.add('shake');
    setTimeout(() => t.classList.remove('shake'), 400);
  });
}

function submitGuess() {
  if (currentGuess.length !== wordLen) {
    showMsg(`Need ${wordLen} letters`, 'bad');
    shakeRow(guesses.length);
    return;
  }

  const result = evaluate(currentGuess);
  const rowIdx = guesses.length;
  guesses.push(currentGuess);

  // Color tiles in this row
  for (let c = 0; c < wordLen; c++) {
    const tile = document.getElementById(`tile-${rowIdx}-${c}`);
    tile.textContent = currentGuess[c].toUpperCase();
  }
  colorRow(rowIdx, result);
  updateKeyboard(currentGuess, result);

  const won = result.every(r => r === 'hit');
  currentGuess = '';
  updateGrid();

  setTimeout(() => {
    if (won) {
      gameOver = true;
      saveDailyResult(true, guesses.length);
      showResult(true);
    } else if (guesses.length >= maxGuesses) {
      gameOver = true;
      saveDailyResult(false, guesses.length);
      showResult(false);
    }
  }, wordLen * 100 + 300);
}

function typeUmlaut(ch) { handleKey(ch); }

function showMsg(text, type) {
  const el = document.getElementById('msgBar');
  el.textContent = text;
  el.className = 'msg-bar ' + (type || '');
  setTimeout(() => { el.textContent = ''; el.className = 'msg-bar'; }, 2000);
}

// ── Result ──────────────────────────────────────────────────────
function showResult(won) {
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  document.getElementById('resultEmoji').textContent = won ? (guesses.length <= 2 ? '' : guesses.length <= 4 ? '' : '') : '';
  document.getElementById('resultTitle').textContent = won ? ['Perfekt!','Ausgezeichnet!','Sehr gut!','Gut gemacht!','Geschafft!'][Math.min(guesses.length-1,4)] : 'Nicht diesmal...';

  const wordObj = ALL_WORDS.find(w => w.w.toLowerCase() === target);
  document.getElementById('resultWord').textContent = (wordObj?.full || target).toUpperCase();
  document.getElementById('resultDef').textContent = wordObj?.en || '';

  const mins = Math.floor(elapsed/60), secs = elapsed%60;
  document.getElementById('resultStats').innerHTML = won ? `
    <div class="rstat"><div class="rstat-val" style="color:var(--green)">${guesses.length}</div><div class="rstat-label">guesses</div></div>
    <div class="rstat"><div class="rstat-val" style="color:var(--yellow)">${mins}:${String(secs).padStart(2,'0')}</div><div class="rstat-label">time</div></div>
  ` : `<div class="rstat"><div class="rstat-val" style="color:var(--red)">${maxGuesses}</div><div class="rstat-label">guesses used</div></div>`;

  document.getElementById('resultCard').classList.add('show');
}

function shareResult() {
  const wordObj = ALL_WORDS.find(w => w.w.toLowerCase() === target);
  const emoji = guesses.map((g,i) => evaluate(g).map(r => r==='hit'?'🟩':r==='near'?'🟨':'⬛').join('')).join('\n');
  const text = `DeutschKarten Wördle #${getDayIndex()}\n${wordObj?.full || target.toUpperCase()}\n${emoji}\nhttps://codetrident07.github.io/Deutsch-Karten/wordle.html`;
  if (navigator.share) { navigator.share({text}); }
  else { navigator.clipboard.writeText(text).then(()=>showMsg('Copied to clipboard!','good')); }
}

// ── Daily save ──────────────────────────────────────────────────
function getDailySave() {
  try { return JSON.parse(localStorage.getItem('dk_wordle_daily')); } catch { return null; }
}

function saveDailyResult(won, guessCount) {
  const day = getDayIndex();
  const history = getDailySave()?.history || {};
  history[day] = { won, guesses: guessCount };
  localStorage.setItem('dk_wordle_daily', JSON.stringify({ day, won, guesses, history }));
}

function restoreDaily(saved) {
  const wordObj = ALL_WORDS[saved.day % ALL_WORDS.length];
  initGame(wordObj, true);
  // Replay saved guesses
  saved.guesses.forEach(g => {
    const result = evaluate(g);
    const rowIdx = guesses.length;
    guesses.push(g);
    for (let c = 0; c < wordLen; c++) {
      const tile = document.getElementById(`tile-${rowIdx}-${c}`);
      tile.textContent = g[c].toUpperCase();
      tile.classList.add(result[c]);
    }
    updateKeyboard(g, result);
  });
  const lastResult = evaluate(saved.guesses[saved.guesses.length-1]);
  if (lastResult.every(r=>r==='hit') || saved.guesses.length >= maxGuesses) {
    gameOver = true;
    showResult(lastResult.every(r=>r==='hit'));
  }
}

// ── Keyboard events ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') handleKey('enter');
  else if (e.key === 'Backspace') handleKey('backspace');
  else handleKey(e.key.toLowerCase());
});

// ── Start ────────────────────────────────────────────────────────
newGame(true);
</script>
